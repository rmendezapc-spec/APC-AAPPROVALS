<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Approval Board</title>
<style>
  :root {
    --ink: #1C2B36;
    --ink-soft: #3D4E5C;
    --muted: #6B7A85;
    --line: #DCE2E6;
    --field: #F6F7F5;
    --paper: #FFFFFF;
    --panel-alt: #EEF1F0;
    --row-border: #EFF2F3;
    --amber: #C8791E;
    --amber-soft: #F3E2CC;
    --green: #2F6B4F;
    --green-soft: #DCEAE2;
    --red: #A83A3A;
    --red-soft: #F3DEDE;
    --steel: #1C2B36;
    --radius: 6px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --shadow-xs: 0 1px 2px rgba(16,23,29,0.05);
    --shadow-sm: 0 1px 3px rgba(16,23,29,0.07), 0 1px 2px rgba(16,23,29,0.05);
    --shadow-md: 0 3px 8px rgba(16,23,29,0.10), 0 1px 3px rgba(16,23,29,0.06);
    --shadow-lg: 0 10px 28px rgba(16,23,29,0.18), 0 3px 10px rgba(16,23,29,0.08);
    --inset-shadow: inset 0 1px 2px rgba(16,23,29,0.05);
    --highlight: rgba(255,255,255,0.14);
  }

  body.dark {
    --ink: #E7ECEF;
    --ink-soft: #C3CDD3;
    --muted: #8A98A3;
    --line: #2B3640;
    --field: #10171D;
    --paper: #1A222A;
    --panel-alt: #222B33;
    --row-border: #26313A;
    --amber: #E0954A;
    --amber-soft: #3A2E1D;
    --green: #6FBF97;
    --green-soft: #16281F;
    --red: #E08080;
    --red-soft: #3A2020;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.30);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.40), 0 1px 2px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 10px rgba(0,0,0,0.48), 0 1px 4px rgba(0,0,0,0.35);
    --shadow-lg: 0 14px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.40);
    --inset-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
    --highlight: rgba(255,255,255,0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--field);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  header.topbar {
    background: var(--steel);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 3;
  }

  header.topbar .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  header.topbar .brand .title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  header.topbar .brand .subtitle {
    font-size: 12.5px;
    color: #9FB0BC;
  }

  header.topbar .nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn {
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    transition: filter 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:active { filter: brightness(0.88); transform: translateY(1px); box-shadow: none !important; }

  .btn-primary {
    background: linear-gradient(180deg, var(--highlight), rgba(0,0,0,0)), var(--amber);
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .btn-primary:hover { box-shadow: var(--shadow-md); }
  .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
  .btn-outline { background: var(--paper); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-xs); }
  .btn-danger { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .btn-success { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .btn-small { padding: 5px 10px; font-size: 12.5px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  main {
    max-width: min(1500px, 96vw);
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--amber);
  }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 16px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }

  .deal-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .deal-card:hover { border-color: var(--muted); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .deal-card .info .job { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  .deal-card .info .meta { font-size: 12.5px; color: var(--muted); }

  .deal-card .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .deal-card .price { font-family: var(--mono); font-weight: 700; font-size: 15px; text-align: right; }
  .deal-card .price .label { display:block; font-family: var(--sans); font-weight: 500; font-size: 11px; color: var(--muted); }

  .stamp {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 2px solid currentColor;
    border-radius: 3px;
    transform: rotate(-4deg);
    white-space: nowrap;
    box-shadow: 1px 1px 0 rgba(0,0,0,0.10);
  }
  .stamp.pending { color: var(--amber); }
  .stamp.approved { color: var(--green); }
  .stamp.rejected { color: var(--red); }

  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }

  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--inset-shadow);
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
    border-color: var(--amber);
  }

  .section-block {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .section-head {
    background: var(--panel-alt);
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 1px 0 var(--line);
  }
  .section-head input[type=text] {
    font-weight: 700;
    border: none;
    background: transparent;
    padding: 4px 2px;
  }
  .section-head input[type=text]:focus { outline: none; border-bottom: 2px solid var(--amber); }

  table.items {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.items th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  table.items td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--row-border);
    vertical-align: middle;
  }
  table.items td input, table.items td select { padding: 6px 8px; font-size: 13px; }
  table.items td.num { text-align: right; font-family: var(--mono); }
  table.items tr.subtotal td { font-weight: 700; background: var(--panel-alt); font-family: var(--mono); box-shadow: inset 0 1px 0 var(--line); }
  table.items tr.subtotal td.label-cell { font-family: var(--sans); }

  .table-scroll { overflow-x: auto; }
  table.items { min-width: 1060px; }
  table.items input, table.items select { min-width: 76px; }
  table.items select { min-width: 132px; }
  .col-desc { min-width: 160px; }
  .col-action { width: 34px; text-align: center; }

  .totals-bar {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-end;
    background: var(--panel-alt);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-top: 6px;
    box-shadow: var(--inset-shadow);
  }
  .totals-bar .stat .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .totals-bar .stat .stat-value {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
  }
  .totals-bar .profit-input { max-width: 90px; }

  .attachments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .attachment-thumb {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 1;
    background: var(--field);
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .attachment-thumb:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .attachment-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attachment-thumb .remove-x {
    position: absolute;
    top: 3px;
    right: 3px;
    background: rgba(28,43,54,0.75);
    color: #fff;
    border: none;
    border-radius: 3px;
    width: 20px;
    height: 20px;
    font-size: 12px;
    cursor: pointer;
    line-height: 1;
  }
  .attachment-thumb .file-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(28,43,54,0.65);
    color: #fff;
    font-size: 9.5px;
    padding: 2px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attach-btn-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .attach-hint { font-size: 12px; color: var(--muted); }

  #lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,15,20,0.88);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  #lightbox-overlay img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
  }

  .job-site-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    font-size: 13.5px;
  }
  .job-site-summary .kv .k { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .job-site-summary .kv .v { font-weight: 600; }

  .approval-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .approver-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-xs);
    background: var(--paper);
  }
  .approver-card .name { font-weight: 700; margin-bottom: 8px; font-size: 14.5px; }
  .approver-card .actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .approver-card .status-line { font-size: 12.5px; color: var(--muted); }
  .approver-card textarea { margin-top: 8px; }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-weight: 600;
  }
  .back-link:hover { color: var(--amber); }

  .add-row-btn {
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 7px 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    margin: 8px;
  }
  .add-row-btn:hover { border-color: var(--amber); color: var(--amber); }

  .banner {
    background: var(--red-soft);
    color: var(--red);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* Real device width drives layout directly — no manual override needed. */
  @media (max-width: 640px) {
    .approval-grid { grid-template-columns: 1fr; }
    .field-grid { grid-template-columns: 1fr; }
    .job-site-summary { grid-template-columns: 1fr; }
    .totals-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
    header.topbar { padding: 14px 16px; }
    main { padding: 18px 12px 60px; }
    table.items { min-width: 900px; font-size: 12.5px; }
  }

  /* Touch-target sizing for phones and other coarse-pointer devices. */
  @media (max-width: 640px), (pointer: coarse) {
    .btn { min-height: 40px; }
    .icon-btn { width: 42px; height: 42px; }
    input[type=text], input[type=number], input[type=date], select, textarea {
      padding: 10px 10px;
      font-size: 16px; /* prevents iOS Safari auto-zoom on focus */
    }
    .tab { padding: 11px 14px; }
  }

  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--steel);
    padding: 20px;
  }
  #gate .gate-card {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }

  .brand-strip {
    background: #000;
    display: flex;
    justify-content: center;
    padding: 14px 16px;
  }
  .brand-logo {
    display: block;
    width: 100%;
    max-width: 280px;
    height: auto;
  }
  #gate .gate-card .brand-logo {
    max-width: 220px;
    margin: 0 auto 20px;
  }
  #gate .gate-card .title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  #gate .gate-card .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  #gate input[type=password] {
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  #gate .gate-error {
    color: var(--red);
    font-size: 12.5px;
    margin-bottom: 10px;
    min-height: 16px;
  }
  #gate .btn { width: 100%; }

  #pin-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,15,20,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pin-modal {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 24px 24px 20px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .pin-modal .title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .pin-modal input[type=password] { text-align: center; letter-spacing: 1px; margin-bottom: 12px; }
  .pin-modal-actions { display: flex; gap: 8px; }
  .pin-modal-actions .btn { flex: 1; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <img src="fence-installers-logo.png" alt="Fence Installers" class="brand-logo">
    <div class="title">Deal Approval Board</div>
    <div class="subtitle">Enter the team passphrase to continue</div>
    <div class="gate-error" id="gate-error"></div>
    <input type="password" id="gate-input" placeholder="Passphrase" onkeydown="if(event.key==='Enter') checkPassphrase()">
    <button class="btn btn-primary" onclick="checkPassphrase()">Unlock</button>
  </div>
</div>

<div id="app" style="display:none;">
<div class="brand-strip">
  <img src="fence-installers-logo.png" alt="Fence Installers" class="brand-logo">
</div>
<header class="topbar">
  <div class="brand">
    <div class="title">Deal Approval Board</div>
    <div class="subtitle">Residential sales &mdash; cost breakdown &amp; sign-off</div>
  </div>
  <div class="nav">
    <button class="btn btn-ghost icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle day/night mode">🌙</button>
    <button class="btn btn-ghost" onclick="App.goList()">All Deals</button>
    <button class="btn btn-primary" onclick="App.goNewDeal()">+ New Deal</button>
  </div>
</header>

<main id="main"></main>

</div>

<div id="lightbox-overlay" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Attachment preview">
</div>

<div id="pin-modal-overlay">
  <div class="pin-modal">
    <div class="title" id="pin-modal-title">Enter PIN</div>
    <div class="gate-error" id="pin-modal-error"></div>
    <input type="password" id="pin-modal-input" placeholder="PIN" onkeydown="if(event.key==='Enter') submitPinModal(); if(event.key==='Escape') closePinModal();">
    <div class="pin-modal-actions">
      <button class="btn btn-outline" onclick="closePinModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitPinModal()">Unlock</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDDHjIX-V_DwizD85TzwvcjuDPu1lMZoSc",
    authDomain: "apc-approvals.firebaseapp.com",
    projectId: "apc-approvals",
    storageBucket: "apc-approvals.firebasestorage.app",
    messagingSenderId: "170502222959",
    appId: "1:170502222959:web:2a9b4345c3ac9bef8b099a",
    measurementId: "G-X2P3DWF9DD"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  // Legacy single-document store (one JSON blob for every deal). Superseded
  // by the `deals` collection below, kept only as a one-time migration source.
  const legacyDocRef = doc(db, 'apcDealBoard', 'deals');
  const dealsCollRef = collection(db, 'deals');

  // Each deal is its own document, keyed by the deal's own id. This avoids the
  // 1MB single-document cap and the "last write wins, whole list" concurrency
  // issue that came with storing everything in one blob.
  window.__firebaseSaveDeal = async function (deal) {
    try {
      await setDoc(doc(dealsCollRef, deal.id), deal);
      return { ok: true };
    } catch (e) {
      console.error('Firestore save failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  // Real-time subscription over the whole collection — fires immediately with
  // current data, then again any time ANYONE (any device) changes it.
  window.__firebaseSubscribeDeals = function (onData, onError) {
    onSnapshot(dealsCollRef, (snap) => {
      const arr = [];
      snap.forEach((d) => arr.push(d.data()));
      arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      onData(arr);
    }, (err) => {
      console.error('Firestore listen error:', err);
      if (onError) onError(err);
    });
  };

  // One-time migration: if the `deals` collection is still empty but the old
  // single-document store has data, copy each deal into its own document.
  // Safe to call on every load — a no-op once the collection is populated.
  window.__firebaseMigrateLegacy = async function () {
    try {
      const existing = await getDocs(dealsCollRef);
      if (!existing.empty) return;
      const legacySnap = await getDoc(legacyDocRef);
      if (!legacySnap.exists()) return;
      const parsed = JSON.parse(legacySnap.data().data || '[]');
      for (const deal of parsed) {
        await setDoc(doc(dealsCollRef, deal.id), deal);
      }
    } catch (e) {
      console.error('Legacy migration failed:', e);
    }
  };
</script>

<script>
const TEAM_PASSPHRASE = 'PLUTUS';

// Per-approver PINs — same lightweight, client-side trust model as
// TEAM_PASSPHRASE above (a deterrent, not real security). Change these to
// whatever Connor and Sandy want before relying on them.
const APPROVER_PINS = { connor: 'CONNOR2385', sandy: 'SANDY888' };
const APPROVER_LABELS = { connor: 'Connor', sandy: 'Sandy' };

let pendingPinAction = null;

function requireApproverUnlock(approver, action) {
  let unlocked = false;
  try { unlocked = localStorage.getItem('apc_approver_unlocked_' + approver) === 'yes'; } catch (e) {}
  if (unlocked) { action(); return; }
  pendingPinAction = action;
  const input = document.getElementById('pin-modal-input');
  document.getElementById('pin-modal-title').textContent = "Enter " + APPROVER_LABELS[approver] + "'s PIN";
  document.getElementById('pin-modal-error').textContent = '';
  input.value = '';
  input.dataset.approver = approver;
  document.getElementById('pin-modal-overlay').style.display = 'flex';
  setTimeout(() => input.focus(), 30);
}

function closePinModal() {
  document.getElementById('pin-modal-overlay').style.display = 'none';
  pendingPinAction = null;
}

function submitPinModal() {
  const input = document.getElementById('pin-modal-input');
  const approver = input.dataset.approver;
  const val = (input.value || '').trim();
  if (val.toUpperCase() === (APPROVER_PINS[approver] || '').toUpperCase()) {
    try { localStorage.setItem('apc_approver_unlocked_' + approver, 'yes'); } catch (e) {}
    document.getElementById('pin-modal-overlay').style.display = 'none';
    const action = pendingPinAction;
    pendingPinAction = null;
    if (action) action();
  } else {
    document.getElementById('pin-modal-error').textContent = 'Incorrect PIN — try again.';
    input.value = '';
    input.focus();
  }
}

function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem('apc_theme', next); } catch (e) {}
  applyTheme(next);
}

function initTheme() {
  let theme = 'light';
  try {
    const stored = localStorage.getItem('apc_theme');
    if (stored) theme = stored;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
  } catch (e) {}
  applyTheme(theme);
}

initTheme();

function checkPassphrase() {
  const input = document.getElementById('gate-input');
  const val = (input.value || '').trim();
  if (val.toUpperCase() === TEAM_PASSPHRASE.toUpperCase()) {
    try { localStorage.setItem('apc_deal_board_unlocked', 'yes'); } catch (e) {}
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('gate-error').textContent = 'That\'s not the right passphrase — try again.';
    input.value = '';
    input.focus();
  }
}

document.addEventListener('DOMContentLoaded', function checkGateOnLoad() {
  let unlocked = false;
  try { unlocked = localStorage.getItem('apc_deal_board_unlocked') === 'yes'; } catch (e) {}
  if (unlocked) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('gate-input').focus();
  }
});
</script>

<script>
const COST_TYPES = ['Labor','Material','Subcontractor','Equipment','Other','None'];
const PROPERTY_TYPES = ['Single-Family','Multi-Family','New Construction','Remodel / Addition','Commercial'];
const ACCESS_OPTIONS = ['Easy — full access','Moderate — some restrictions','Difficult — tight / crane needed'];
const DEFAULT_SECTIONS = ['General Requirements','Labor & Installation','Materials & Products','Mobilization'];

let deals = [];
let currentView = 'list';
let currentFilter = 'all';
let draftDeal = null;
let currentDealId = null;
let storageError = false;
let storageErrorDetail = '';

function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

function money(n) {
  n = Number(n) || 0;
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

let firebaseSubscribed = false;

// Save a single deal document, used after every mutation (submit,
// approve/reject, etc.) — only the changed deal is written, not the whole list.
async function saveDeal(deal) {
  try {
    const result = window.__firebaseSaveDeal
      ? await window.__firebaseSaveDeal(deal)
      : { ok: false, error: 'Firebase failed to load in this browser.' };
    storageError = !result.ok;
    storageErrorDetail = result.ok ? '' : (result.error || '');
  } catch (e) {
    storageError = true;
    storageErrorDetail = (e && e.message) || String(e);
  }
  render();
}

// Subscribes once to the shared Firestore `deals` collection. Resolves after
// the first snapshot arrives (or the first error) so initApp never hangs on
// "Loading deals..." forever, then keeps updating `deals` live as anyone
// (any device) makes changes.
function subscribeToDealsOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeDeals) {
      // Firebase script failed to load (offline, blocked, bad config, etc.)
      storageError = true;
      storageErrorDetail = 'Firebase failed to load in this browser.';
      resolve();
      return;
    }
    let settled = false;
    window.__firebaseSubscribeDeals((remoteDeals) => {
      deals = remoteDeals;
      storageError = false;
      storageErrorDetail = '';
      if (currentView === 'list' || currentView === 'detail') render();
      if (!settled) {
        settled = true;
        firebaseSubscribed = true;
        resolve();
      }
    }, (err) => {
      storageError = true;
      storageErrorDetail = (err && err.message) || String(err);
      render();
      if (!settled) {
        settled = true;
        resolve();
      }
    });
  });
}

function blankDeal() {
  return {
    id: uid('deal'),
    customerName: '',
    address: '',
    repName: '',
    date: todayStr(),
    jobSite: { propertyType: '', accessDifficulty: '', notes: '' },
    sections: DEFAULT_SECTIONS.map(name => ({ id: uid('sec'), name, items: [] })),
    attachments: [],
    approvals: { connor: null, sandy: null },
    rejectReasons: { connor: '', sandy: '' },
    createdAt: Date.now()
  };
}

function blankItem() {
  return { id: uid('item'), desc: '', qty: 1, unit: 'each', unitCost: 0, costType: 'Material', markupPercent: 25 };
}

// Per-line-item cost math, mirroring the Builder Cost -> Markup -> Client Price -> Margin/Profit
// flow from the BuilderTrend reference.
function itemCalc(item) {
  const qty = Number(item.qty) || 0;
  const unitCost = Number(item.unitCost) || 0;
  const markup = Number(item.markupPercent) || 0;
  const builderCost = qty * unitCost;
  const unitPrice = unitCost * (1 + markup / 100);
  const clientPrice = qty * unitPrice;
  const profit = clientPrice - builderCost;
  const margin = clientPrice > 0 ? (profit / clientPrice) * 100 : 0;
  return { builderCost, unitPrice, clientPrice, profit, margin };
}

function sectionTotals(section) {
  return section.items.reduce((acc, item) => {
    const c = itemCalc(item);
    acc.builderCost += c.builderCost;
    acc.clientPrice += c.clientPrice;
    acc.profit += c.profit;
    return acc;
  }, { builderCost: 0, clientPrice: 0, profit: 0 });
}

function sectionMargin(totals) {
  return totals.clientPrice > 0 ? (totals.profit / totals.clientPrice) * 100 : 0;
}

function dealTotals(deal) {
  return deal.sections.reduce((acc, s) => {
    const t = sectionTotals(s);
    acc.builderCost += t.builderCost;
    acc.clientPrice += t.clientPrice;
    acc.profit += t.profit;
    return acc;
  }, { builderCost: 0, clientPrice: 0, profit: 0 });
}

function dealClientPrice(deal) {
  return dealTotals(deal).clientPrice;
}

function dealBuilderCost(deal) {
  return dealTotals(deal).builderCost;
}

function dealProfit(deal) {
  return dealTotals(deal).profit;
}

function dealMargin(deal) {
  const t = dealTotals(deal);
  return t.clientPrice > 0 ? (t.profit / t.clientPrice) * 100 : 0;
}

function dealStatus(deal) {
  if (deal.approvals.connor === false || deal.approvals.sandy === false) return 'rejected';
  if (deal.approvals.connor === true && deal.approvals.sandy === true) return 'approved';
  return 'pending';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Resize + compress a photo client-side before storing it, so a multi-MB phone
// photo shrinks down to something small enough to save alongside deal data.
function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 1280;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-overlay').style.display = 'flex';
}

function closeLightbox() {
  document.getElementById('lightbox-overlay').style.display = 'none';
  document.getElementById('lightbox-img').src = '';
}

// ---------- App namespace ----------
const App = {

  goList(filter) {
    currentView = 'list';
    if (filter) currentFilter = filter;
    render();
  },

  goNewDeal() {
    draftDeal = blankDeal();
    currentView = 'form';
    render();
  },

  editDeal(id) {
    const d = deals.find(x => x.id === id);
    if (!d) return;
    draftDeal = JSON.parse(JSON.stringify(d));
    if (!draftDeal.attachments) draftDeal.attachments = [];
    currentView = 'form';
    render();
  },

  viewDeal(id) {
    currentDealId = id;
    currentView = 'detail';
    render();
  },

  setFilter(f) {
    currentFilter = f;
    render();
  },

  updateHeaderField(field, value) {
    draftDeal[field] = value;
  },

  updateJobSiteField(field, value) {
    draftDeal.jobSite[field] = value;
  },

  addSection() {
    draftDeal.sections.push({ id: uid('sec'), name: 'New Section', items: [blankItem()] });
    render();
  },

  removeSection(secId) {
    draftDeal.sections = draftDeal.sections.filter(s => s.id !== secId);
    render();
  },

  renameSection(secId, value) {
    const s = draftDeal.sections.find(s => s.id === secId);
    if (s) s.name = value;
  },

  addItem(secId) {
    const s = draftDeal.sections.find(s => s.id === secId);
    if (s) s.items.push(blankItem());
    render();
  },

  removeItem(secId, itemId) {
    const s = draftDeal.sections.find(s => s.id === secId);
    if (s) s.items = s.items.filter(i => i.id !== itemId);
    render();
  },

  updateItemText(secId, itemId, field, value) {
    const s = draftDeal.sections.find(s => s.id === secId);
    const i = s && s.items.find(i => i.id === itemId);
    if (i) i[field] = value;
  },

  updateItemNumeric(secId, itemId, field, value) {
    const s = draftDeal.sections.find(s => s.id === secId);
    const i = s && s.items.find(i => i.id === itemId);
    if (i) i[field] = value;
    this.refreshTotals(secId, itemId);
  },

  // Editing Margin % directly back-solves the Markup % needed to hit that margin,
  // so either field can be used to drive pricing and they stay in sync.
  updateItemMargin(secId, itemId, value) {
    const s = draftDeal.sections.find(s => s.id === secId);
    const item = s && s.items.find(i => i.id === itemId);
    if (!item) return;

    const qty = Number(item.qty) || 0;
    const unitCost = Number(item.unitCost) || 0;
    const builderCost = qty * unitCost;

    let margin = Number(value);
    if (isNaN(margin)) margin = 0;
    margin = Math.min(margin, 99.9); // 100%+ margin implies infinite price, not solvable

    let markup = Number(item.markupPercent) || 0;
    if (builderCost > 0 && unitCost > 0 && qty > 0) {
      const clientPrice = builderCost / (1 - margin / 100);
      const unitPrice = clientPrice / qty;
      markup = (unitPrice / unitCost - 1) * 100;
    }
    item.markupPercent = markup;

    const markupInput = document.getElementById('markupinput-' + itemId);
    if (markupInput && document.activeElement !== markupInput) {
      markupInput.value = Math.round(markup * 100) / 100;
    }
    this.refreshTotals(secId, itemId);
  },

  refreshTotals(secId, itemId) {
    // Refresh the single edited row's computed cells (preserves input focus).
    if (secId && itemId) {
      const s = draftDeal.sections.find(s => s.id === secId);
      const item = s && s.items.find(i => i.id === itemId);
      if (item) {
        const c = itemCalc(item);
        const upEl = document.getElementById('itemup-' + itemId);
        const bcEl = document.getElementById('itembc-' + itemId);
        const cpEl = document.getElementById('itemcp-' + itemId);
        const mgEl = document.getElementById('itemmg-' + itemId);
        const pfEl = document.getElementById('itempf-' + itemId);
        if (upEl) upEl.textContent = money(c.unitPrice);
        if (bcEl) bcEl.textContent = money(c.builderCost);
        if (cpEl) cpEl.textContent = money(c.clientPrice);
        if (mgEl && document.activeElement !== mgEl) mgEl.value = Math.round(c.margin * 100) / 100;
        if (pfEl) pfEl.textContent = money(c.profit);
      }
    }
    // Refresh section subtotals.
    draftDeal.sections.forEach(s => {
      const t = sectionTotals(s);
      const bcEl = document.getElementById('sec-bc-' + s.id);
      const cpEl = document.getElementById('sec-cp-' + s.id);
      const mgEl = document.getElementById('sec-mg-' + s.id);
      const pfEl = document.getElementById('sec-pf-' + s.id);
      if (bcEl) bcEl.textContent = money(t.builderCost);
      if (cpEl) cpEl.textContent = money(t.clientPrice);
      if (mgEl) mgEl.textContent = sectionMargin(t).toFixed(1) + '%';
      if (pfEl) pfEl.textContent = money(t.profit);
    });
    // Refresh deal grand totals.
    const dt = dealTotals(draftDeal);
    const bcEl = document.getElementById('grand-buildercost');
    const cpEl = document.getElementById('grand-clientprice');
    const mgEl = document.getElementById('grand-margin');
    const pfEl = document.getElementById('grand-profit');
    if (bcEl) bcEl.textContent = money(dt.builderCost);
    if (cpEl) cpEl.textContent = money(dt.clientPrice);
    if (mgEl) mgEl.textContent = dealMargin(draftDeal).toFixed(1) + '%';
    if (pfEl) pfEl.textContent = money(dt.profit);
  },

  async handleFiles(fileList) {
    const files = Array.from(fileList || []);
    for (const file of files) {
      try {
        const dataUrl = await compressImageFile(file);
        draftDeal.attachments.push({
          id: uid('att'),
          name: file.name || 'photo.jpg',
          dataUrl,
          addedAt: Date.now()
        });
      } catch (e) {
        alert('Could not attach "' + (file.name || 'that file') + '" — try a different photo.');
      }
    }
    render();
  },

  removeAttachment(attId) {
    draftDeal.attachments = draftDeal.attachments.filter(a => a.id !== attId);
    render();
  },

  async submitDeal() {
    if (!draftDeal.customerName.trim()) {
      alert('Add a customer / job name before submitting.');
      return;
    }
    const hasItems = draftDeal.sections.some(s => s.items.length > 0);
    if (!hasItems) {
      alert('Add at least one line item before submitting.');
      return;
    }
    const existingIdx = deals.findIndex(d => d.id === draftDeal.id);
    if (existingIdx >= 0) {
      deals[existingIdx] = draftDeal;
    } else {
      deals.unshift(draftDeal);
    }
    const saved = draftDeal;
    draftDeal = null;
    currentView = 'list';
    await saveDeal(saved);
  },

  cancelForm() {
    draftDeal = null;
    currentView = 'list';
    render();
  },

  async setApproval(dealId, approver, value) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    d.approvals[approver] = value;
    if (value !== false) d.rejectReasons[approver] = '';
    await saveDeal(d);
    currentView = 'detail';
    currentDealId = dealId;
    render();
  },

  updateRejectReason(dealId, approver, value) {
    const d = deals.find(x => x.id === dealId);
    if (d) d.rejectReasons[approver] = value;
  },

  async saveRejectReason(dealId, approver) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    await saveDeal(d);
    currentView = 'detail';
    currentDealId = dealId;
    render();
  }
};

// ---------- Render functions ----------
function render() {
  const main = document.getElementById('main');
  if (currentView === 'list') main.innerHTML = renderList();
  else if (currentView === 'form') main.innerHTML = renderForm();
  else if (currentView === 'detail') main.innerHTML = renderDetail();
}

function renderList() {
  let filtered = deals;
  if (currentFilter !== 'all') filtered = deals.filter(d => dealStatus(d) === currentFilter);

  const counts = {
    all: deals.length,
    pending: deals.filter(d => dealStatus(d) === 'pending').length,
    approved: deals.filter(d => dealStatus(d) === 'approved').length,
    rejected: deals.filter(d => dealStatus(d) === 'rejected').length
  };

  const tabs = ['all','pending','approved','rejected'].map(f =>
    `<div class="tab ${currentFilter===f?'active':''}" onclick="App.setFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)} (${counts[f]})</div>`
  ).join('');

  let body;
  if (filtered.length === 0) {
    body = `<div class="empty-state">
      <div class="big">No deals here yet</div>
      <div>New submissions will show up in this list.</div>
    </div>`;
  } else {
    body = filtered.map(d => {
      const status = dealStatus(d);
      return `<div class="deal-card" onclick="App.viewDeal('${d.id}')">
        <div class="info">
          <div class="job">${esc(d.customerName || 'Untitled deal')}</div>
          <div class="meta">${esc(d.address || 'No address')} &middot; Rep: ${esc(d.repName || '—')} &middot; ${esc(d.date || '')}</div>
        </div>
        <div class="right">
          <div class="price">${money(dealClientPrice(d))}<span class="label">Client Price</span></div>
          <div class="stamp ${status}">${status}</div>
        </div>
      </div>`;
    }).join('');
  }

  const errBanner = storageError ? `<div class="banner">Something went wrong saving your last change. Try again — if it keeps happening, this device may be offline.${storageErrorDetail ? `<div style="margin-top:5px; font-size:11.5px; opacity:0.8;">Details: ${esc(storageErrorDetail)}</div>` : ''}</div>` : '';

  return `${errBanner}<div class="tabs">${tabs}</div>${body}`;
}

function renderForm() {
  const d = draftDeal;
  const sectionsHtml = d.sections.map(sec => {
    const rows = sec.items.map(item => {
      const c = itemCalc(item);
      return `
      <tr>
        <td class="col-desc"><input type="text" value="${esc(item.desc)}" placeholder="Item description"
            oninput="App.updateItemText('${sec.id}','${item.id}','desc', this.value)"></td>
        <td><input type="number" step="any" value="${item.qty}"
            oninput="App.updateItemNumeric('${sec.id}','${item.id}','qty', this.value)"></td>
        <td><input type="text" value="${esc(item.unit)}" placeholder="each"
            oninput="App.updateItemText('${sec.id}','${item.id}','unit', this.value)"></td>
        <td><input type="number" step="any" value="${item.unitCost}"
            oninput="App.updateItemNumeric('${sec.id}','${item.id}','unitCost', this.value)"></td>
        <td>
          <select onchange="App.updateItemText('${sec.id}','${item.id}','costType', this.value)">
            ${COST_TYPES.map(t => `<option value="${t}" ${t===item.costType?'selected':''}>${t}</option>`).join('')}
          </select>
        </td>
        <td><input id="markupinput-${item.id}" type="number" step="any" value="${item.markupPercent}"
            oninput="App.updateItemNumeric('${sec.id}','${item.id}','markupPercent', this.value)"></td>
        <td class="num" id="itemup-${item.id}">${money(c.unitPrice)}</td>
        <td class="num" id="itembc-${item.id}">${money(c.builderCost)}</td>
        <td class="num" id="itemcp-${item.id}">${money(c.clientPrice)}</td>
        <td><input id="itemmg-${item.id}" type="number" step="any" value="${Math.round(c.margin*100)/100}"
            oninput="App.updateItemMargin('${sec.id}','${item.id}', this.value)"></td>
        <td class="num" id="itempf-${item.id}">${money(c.profit)}</td>
        <td class="col-action"><button class="btn btn-danger btn-small" onclick="App.removeItem('${sec.id}','${item.id}')">✕</button></td>
      </tr>`;
    }).join('');

    const t = sectionTotals(sec);
    return `<div class="section-block">
      <div class="section-head">
        <input type="text" value="${esc(sec.name)}" oninput="App.renameSection('${sec.id}', this.value)">
        <button class="btn btn-outline btn-small" onclick="App.removeSection('${sec.id}')">Remove Section</button>
      </div>
      <div class="table-scroll">
      <table class="items">
        <thead><tr>
          <th class="col-desc">Description</th><th>Qty</th><th>Unit</th>
          <th>Unit Cost</th><th>Cost Type</th><th>Markup %</th><th>Unit Price</th>
          <th>Builder Cost</th><th>Client Price</th><th>Margin %</th><th>Profit $</th><th class="col-action"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="subtotal">
          <td class="label-cell" colspan="7">Section Subtotal</td>
          <td id="sec-bc-${sec.id}">${money(t.builderCost)}</td>
          <td id="sec-cp-${sec.id}">${money(t.clientPrice)}</td>
          <td id="sec-mg-${sec.id}">${sectionMargin(t).toFixed(1)}%</td>
          <td id="sec-pf-${sec.id}">${money(t.profit)}</td>
          <td></td>
        </tr></tfoot>
      </table>
      </div>
      <button class="add-row-btn" onclick="App.addItem('${sec.id}')">+ Add line item</button>
    </div>`;
  }).join('');

  const attachmentsHtml = d.attachments.map(a => `
    <div class="attachment-thumb" onclick="openLightbox('${a.dataUrl}')">
      <img src="${a.dataUrl}" alt="${esc(a.name)}">
      <button class="remove-x" onclick="event.stopPropagation(); App.removeAttachment('${a.id}')">✕</button>
      <div class="file-name">${esc(a.name)}</div>
    </div>`).join('');

  return `
  <div class="back-link" onclick="App.cancelForm()">&larr; Back to all deals</div>
  <div class="panel">
    <h2>Deal Details</h2>
    <div class="field-grid">
      <div><label class="field-label">Customer / Job Name</label>
        <input type="text" value="${esc(d.customerName)}" oninput="App.updateHeaderField('customerName', this.value)"></div>
      <div><label class="field-label">Job Address</label>
        <input type="text" value="${esc(d.address)}" oninput="App.updateHeaderField('address', this.value)"></div>
      <div><label class="field-label">Sales Rep</label>
        <input type="text" value="${esc(d.repName)}" oninput="App.updateHeaderField('repName', this.value)"></div>
      <div><label class="field-label">Date</label>
        <input type="date" value="${esc(d.date)}" oninput="App.updateHeaderField('date', this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Job Site Specifics</h2>
    <div class="field-grid">
      <div><label class="field-label">Property Type</label>
        <select onchange="App.updateJobSiteField('propertyType', this.value)">
          <option value="">Select...</option>
          ${PROPERTY_TYPES.map(p => `<option value="${p}" ${p===d.jobSite.propertyType?'selected':''}>${p}</option>`).join('')}
        </select></div>
      <div><label class="field-label">Site Access</label>
        <select onchange="App.updateJobSiteField('accessDifficulty', this.value)">
          <option value="">Select...</option>
          ${ACCESS_OPTIONS.map(a => `<option value="${a}" ${a===d.jobSite.accessDifficulty?'selected':''}>${a}</option>`).join('')}
        </select></div>
    </div>
    <div style="margin-top:12px;">
      <label class="field-label">Site Notes</label>
      <textarea placeholder="Anything Connor and Sandy should know before approving — access, terrain, timeline pressure, HOA, etc."
        oninput="App.updateJobSiteField('notes', this.value)">${esc(d.jobSite.notes)}</textarea>
    </div>
  </div>

  <div class="panel">
    <h2>Cost Breakdown</h2>
    ${sectionsHtml}
    <button class="btn btn-outline" onclick="App.addSection()">+ Add Section</button>

    <div class="totals-bar">
      <div class="stat"><div class="stat-label">Total Builder Cost</div><div class="stat-value" id="grand-buildercost">${money(dealBuilderCost(d))}</div></div>
      <div class="stat"><div class="stat-label">Client Price</div><div class="stat-value" id="grand-clientprice">${money(dealClientPrice(d))}</div></div>
      <div class="stat"><div class="stat-label">Margin %</div><div class="stat-value" id="grand-margin">${dealMargin(d).toFixed(1)}%</div></div>
      <div class="stat"><div class="stat-label">Profit $</div><div class="stat-value" id="grand-profit">${money(dealProfit(d))}</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Attachments</h2>
    <div class="attach-btn-row">
      <label class="btn btn-outline btn-small" style="cursor:pointer;">
        + Add Photos
        <input type="file" accept="image/*" multiple capture="environment" style="display:none;" onchange="App.handleFiles(this.files); this.value='';">
      </label>
      <span class="attach-hint">Photos of the site, damage, or signed paperwork — compressed automatically before saving.</span>
    </div>
    <div class="attachments-grid">${attachmentsHtml}</div>
  </div>

  <div class="form-actions">
    <button class="btn btn-outline" onclick="App.cancelForm()">Cancel</button>
    <button class="btn btn-primary" onclick="App.submitDeal()">Submit for Approval</button>
  </div>`;
}

function renderDetail() {
  const d = deals.find(x => x.id === currentDealId);
  if (!d) return `<div class="empty-state">Deal not found.<div class="back-link" onclick="App.goList()">&larr; Back</div></div>`;

  const status = dealStatus(d);

  const sectionsHtml = d.sections.map(sec => {
    const rows = sec.items.map(item => {
      const c = itemCalc(item);
      return `
      <tr>
        <td class="col-desc">${esc(item.desc || '—')}</td>
        <td class="num">${item.qty}</td>
        <td>${esc(item.unit)}</td>
        <td class="num">${money(item.unitCost)}</td>
        <td>${esc(item.costType)}</td>
        <td class="num">${Number(item.markupPercent)||0}%</td>
        <td class="num">${money(c.unitPrice)}</td>
        <td class="num">${money(c.builderCost)}</td>
        <td class="num">${money(c.clientPrice)}</td>
        <td class="num">${c.margin.toFixed(1)}%</td>
        <td class="num">${money(c.profit)}</td>
      </tr>`;
    }).join('');
    const t = sectionTotals(sec);
    return `<div class="section-block">
      <div class="section-head"><strong>${esc(sec.name)}</strong></div>
      <div class="table-scroll">
      <table class="items">
        <thead><tr><th class="col-desc">Description</th><th>Qty</th><th>Unit</th>
        <th>Unit Cost</th><th>Cost Type</th><th>Markup %</th><th>Unit Price</th>
        <th>Builder Cost</th><th>Client Price</th><th>Margin %</th><th>Profit $</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="subtotal">
          <td class="label-cell" colspan="7">Section Subtotal</td>
          <td>${money(t.builderCost)}</td>
          <td>${money(t.clientPrice)}</td>
          <td>${sectionMargin(t).toFixed(1)}%</td>
          <td>${money(t.profit)}</td>
        </tr></tfoot>
      </table>
      </div>
    </div>`;
  }).join('');

  const attachmentsHtml = (d.attachments || []).map(a => `
    <div class="attachment-thumb" onclick="openLightbox('${a.dataUrl}')">
      <img src="${a.dataUrl}" alt="${esc(a.name)}">
      <div class="file-name">${esc(a.name)}</div>
    </div>`).join('');

  function approverBlock(approver, label) {
    const val = d.approvals[approver];
    const reason = d.rejectReasons[approver] || '';
    let statusLine = 'Awaiting decision';
    if (val === true) statusLine = 'Approved';
    if (val === false) statusLine = 'Rejected' + (reason ? ': ' + esc(reason) : '');
    return `<div class="approver-card">
      <div class="name">${label}</div>
      <div class="actions">
        <button class="btn btn-success btn-small" onclick="requireApproverUnlock('${approver}', () => App.setApproval('${d.id}','${approver}', true))">Approve</button>
        <button class="btn btn-danger btn-small" onclick="requireApproverUnlock('${approver}', () => { document.getElementById('reason-${approver}').style.display='block'; })">Reject</button>
      </div>
      <div class="status-line">${statusLine}</div>
      <div id="reason-${approver}" style="display:${val===false ? 'block':'none'};">
        <textarea placeholder="Reason for rejection" oninput="App.updateRejectReason('${d.id}','${approver}', this.value)">${esc(reason)}</textarea>
        <button class="btn btn-outline btn-small" style="margin-top:6px;" onclick="requireApproverUnlock('${approver}', () => { App.setApproval('${d.id}','${approver}', false); App.saveRejectReason('${d.id}','${approver}'); })">Confirm Reject</button>
      </div>
    </div>`;
  }

  return `
  <div class="back-link" onclick="App.goList()">&larr; Back to all deals</div>

  <div class="panel" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px;">
    <div>
      <h2 style="margin-bottom:6px;">${esc(d.customerName)}</h2>
      <div style="color:var(--muted); font-size:13.5px;">${esc(d.address)} &middot; Rep: ${esc(d.repName)} &middot; ${esc(d.date)}</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="stamp ${status}">${status}</div>
      ${status === 'pending' ? `<button class="btn btn-outline btn-small" onclick="App.editDeal('${d.id}')">Edit</button>` : ''}
    </div>
  </div>

  <div class="panel">
    <h2>Job Site Specifics</h2>
    <div class="job-site-summary">
      <div class="kv"><div class="k">Property Type</div><div class="v">${esc(d.jobSite.propertyType || '—')}</div></div>
      <div class="kv"><div class="k">Site Access</div><div class="v">${esc(d.jobSite.accessDifficulty || '—')}</div></div>
    </div>
    ${d.jobSite.notes ? `<div style="margin-top:12px; font-size:13.5px;"><div class="k" style="font-size:11px; text-transform:uppercase; color:var(--muted); margin-bottom:4px;">Notes</div>${esc(d.jobSite.notes)}</div>` : ''}
  </div>

  <div class="panel">
    <h2>Cost Breakdown</h2>
    ${sectionsHtml}
    <div class="totals-bar">
      <div class="stat"><div class="stat-label">Total Builder Cost</div><div class="stat-value">${money(dealBuilderCost(d))}</div></div>
      <div class="stat"><div class="stat-label">Client Price</div><div class="stat-value">${money(dealClientPrice(d))}</div></div>
      <div class="stat"><div class="stat-label">Margin %</div><div class="stat-value">${dealMargin(d).toFixed(1)}%</div></div>
      <div class="stat"><div class="stat-label">Profit $</div><div class="stat-value">${money(dealProfit(d))}</div></div>
    </div>
  </div>

  ${attachmentsHtml ? `<div class="panel">
    <h2>Attachments</h2>
    <div class="attachments-grid">${attachmentsHtml}</div>
  </div>` : ''}

  <div class="panel">
    <h2>Approval</h2>
    <div class="approval-grid">
      ${approverBlock('connor', 'Connor')}
      ${approverBlock('sandy', 'Sandy')}
    </div>
  </div>`;
}

// ---------- Init ----------
let appInitialized = false;
async function initApp() {
  if (appInitialized) return;
  appInitialized = true;
  document.getElementById('main').innerHTML = `<div class="empty-state">Loading deals...</div>`;
  if (window.__firebaseMigrateLegacy) {
    try { await window.__firebaseMigrateLegacy(); } catch (e) { console.error('Migration failed:', e); }
  }
  await subscribeToDealsOnce();
  render();
}
</script>
</body>
</html>
