  async submitDeal() {
    const checklist = evaluateSubmissionChecklist(draftDeal);
    if (checklist.length > 0) {
      submissionChecklistErrors = checklist;
      render();
      const banner = document.getElementById('submission-checklist-banner');
      if (banner) banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    submissionChecklistErrors = null;
    const existingIdx = deals.findIndex(d => d.id === draftDeal.id);
    if (existingIdx >= 0) {
      // Editing only ever happens on a rejected deal (see the Edit button in
      // the detail view), so resubmitting always starts a fresh approval round.
      draftDeal.approvals = { connor: null, sandy: null };
      draftDeal.rejectReasons = { connor: '', sandy: '' };
      deals[existingIdx] = draftDeal;
    } else {
      deals.unshift(draftDeal);
    }
    const saved = draftDeal;
    draftDeal = null;
    currentView = 'list';
    await saveDeal(saved);
  },

  // Drops a notification in the assignee's inbox for the Proposal, Handoff
  // Sheet, or Engineering Order on this deal — wherever that type's
  // "assignedTo" currently points.
  // estimateId is only used for type 'material-estimate', which can have
  // several saved entries per deal, each independently assignable.
  async sendNotification(dealId, type, estimateId) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    let assigneeId;
    if (type === 'proposal') assigneeId = d.proposalAssignedTo;
    else if (type === 'handoff') assigneeId = d.handoff && d.handoff.assignedTo;
    else if (type === 'engineering') assigneeId = d.engineering && d.engineering.assignedTo;
    else if (type === 'intake') assigneeId = d.intake && d.intake.assignedTo;
    else if (type === 'material-estimate') {
      const est = (d.materialEstimates || []).find(e => e.id === estimateId);
      assigneeId = est && est.assignedTo;
    }
    if (!assigneeId) { alert('Pick someone to assign this to first.'); return; }
    const assignee = allUsers.find(u => u.id === assigneeId);
    if (!assignee) return;
    const notification = {
      id: uid('notif'),
      recipientId: assignee.id,
      recipientName: assignee.name,
      type, // 'proposal' | 'handoff' | 'engineering' | 'intake' | 'material-estimate'
      dealId: d.id,
      estimateId: estimateId || null,
      customerName: d.customerName || 'Untitled deal',
      fromId: currentUser ? currentUser.id : '',
      fromName: currentUser ? currentUser.name : '',
      createdAt: Date.now(),
      read: false
    };
    if (!window.__firebaseSaveNotification) return;
    const result = await window.__firebaseSaveNotification(notification);
    alert(result.ok ? `${assignee.name} has been notified.` : 'Failed to send notification — try again. ' + (result.error || ''));
  },

  async openNotification(notificationId) {
    const n = notifications.find(x => x.id === notificationId);
    if (!n) return;
    closeNotifMenu();
    if (!n.read) {
      n.read = true;
      renderNotifChrome();
      if (window.__firebaseMarkNotificationRead) await window.__firebaseMarkNotificationRead(notificationId);
    }
    currentDealId = n.dealId;
    if (n.type === 'proposal') {
      currentView = 'proposal';
      if (!selectedTemplateId || !allTemplates.some(t => t.id === selectedTemplateId)) {
        selectedTemplateId = allTemplates.length ? allTemplates[0].id : null;
      }
    } else if (n.type === 'material-estimate') {
      currentView = 'material-estimate-view';
      currentEstimateId = n.estimateId;
    } else {
      currentView = 'detail';
      detailTab = n.type === 'engineering' ? 'engineering' : n.type === 'intake' ? 'intake' : 'handoff';
    }
    render();
  },

  saveMaterialEstimate(dealId) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const product = MATERIAL_CALC_PRODUCTS.find(p => p.key === materialCalcState.productKey) || MATERIAL_CALC_PRODUCTS[0];
    const style = product.styles.find(s => s.key === materialCalcState.styleKey) || product.styles[0];
    const lf = Number(materialCalcState.linearFeet) || 0;
    if (lf <= 0) { alert('Enter linear footage before saving an estimate.'); return; }
    const posts = computeMaterialCalcPosts();
    d.materialEstimates = d.materialEstimates || [];
    d.materialEstimates.push({
      id: uid('estimate'),
      savedAt: Date.now(),
      savedBy: currentUser ? currentUser.name : '',
      productName: product.name,
      styleLabel: style.label,
      kind: product.kind,
      linearFeet: lf,
      heightFt: product.kind === 'panel' ? style.height : null, // rail systems have no height concept
      unitPrice: style.pricePerLF,
      totalPrice: lf * style.pricePerLF,
      posts,
      secondaryLabel: product.kind === 'rail' ? 'Rails' : 'Panels',
      secondaryValue: product.kind === 'rail' ? posts * style.rails : posts * style.height,
      hasPanelCaps: !!product.hasPanelCaps,
      hasPostCaps: !!product.hasPostCaps,
      postTypeRows: (materialCalcState.postTypeRows || []).map(r => ({ type: r.type, qty: Number(r.qty) || 0 })),
      assignedTo: '',
      assignedToName: ''
    });
    saveDeal(d);
    this.viewDeal(dealId);
  },

  removeMaterialEstimate(dealId, estimateId) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    d.materialEstimates = (d.materialEstimates || []).filter(e => e.id !== estimateId);
    saveDeal(d);
  },

  setMaterialEstimateAssignee(dealId, estimateId, userId) {
    const d = deals.find(x => x.id === dealId);
    const est = d && (d.materialEstimates || []).find(e => e.id === estimateId);
    if (!est) return;
    const assignee = allUsers.find(u => u.id === userId);
    est.assignedTo = assignee ? assignee.id : '';
    est.assignedToName = assignee ? assignee.name : '';
    saveDeal(d);
  },

  openMaterialEstimate(dealId, estimateId) {
    currentDealId = dealId;
    currentEstimateId = estimateId;
    currentView = 'material-estimate-view';
    render();
  },

  async addAttachmentsToDeal(dealId, fileList) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const files = Array.from(fileList || []);
    for (const file of files) {
      try {
        const dataUrl = await processAttachmentFile(file);
        d.attachments = d.attachments || [];
        d.attachments.push({
          id: uid('att'),
          name: file.name || 'file',
          dataUrl,
          mimeType: file.type || '',
          category: guessAttachmentCategory(file),
          description: '',
          addedAt: Date.now()
        });
      } catch (e) {
        alert('Could not attach "' + (file.name || 'that file') + '" — try a different file.');
      }
    }
    await saveDeal(d);
  },

  async removeAttachmentFromDeal(dealId, attId) {
    if (!confirm('Delete this attachment? This cannot be undone.')) return;
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    d.attachments = (d.attachments || []).filter(a => a.id !== attId);
    await saveDeal(d);
  },

  async updateAttachmentCategoryOnDeal(dealId, attId, value) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const a = (d.attachments || []).find(x => x.id === attId);
    if (!a) return;
    a.category = value;
    await saveDeal(d);
  },

  async updateAttachmentDescriptionOnDeal(dealId, attId, value) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const a = (d.attachments || []).find(x => x.id === attId);
    if (!a) return;
    a.description = value;
    await saveDeal(d);
  },

  async updateHandoffField(dealId, path, value) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    d.handoff = d.handoff || blankHandoff(d);
    setPath(d.handoff, path, value);
    await saveDeal(d);
  },

  async updateEngineeringField(dealId, path, value) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    d.engineering = d.engineering || blankEngineering(d);
    setPath(d.engineering, path, value);
    await saveDeal(d);
  },

  async downloadHandoffDocx(dealId) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    try {
      const docxLib = await import('https://unpkg.com/docx@9.7.1/dist/index.mjs');
      const blob = await buildHandoffDocx(docxLib, d);
      downloadBlob(blob, (d.customerName || 'handoff').replace(/[^\w\- ]+/g, '').trim() + ' - Handoff Sheet.docx');
      await recordDocumentGenerated(d, 'handoff');
    } catch (e) {
      alert('Could not generate the Word document — check your connection and try again.');
    }
  },

  async downloadEngineeringDocx(dealId) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    try {
      const docxLib = await import('https://unpkg.com/docx@9.7.1/dist/index.mjs');
      const blob = await buildEngineeringDocx(docxLib, d);
      downloadBlob(blob, (d.customerName || 'engineering').replace(/[^\w\- ]+/g, '').trim() + ' - Engineering Order.docx');
      await recordDocumentGenerated(d, 'engineering');
    } catch (e) {
      alert('Could not generate the Word document — check your connection and try again.');
    }
  },

  async updateIntakeField(dealId, field, value) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    d.intake = d.intake || { assignedTo: '', selectedEstimateId: '' };
    d.intake[field] = value;
    await saveDeal(d);
  },

  async downloadIntakeDocx(dealId) {
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const estimates = d.materialEstimates || [];
    if (!estimates.length) { alert('Save a Material Estimate first — the Intake Sheet pulls its component breakdown from there.'); return; }
    const intake = d.intake || {};
    const est = estimates.find(e => e.id === intake.selectedEstimateId) || estimates[estimates.length - 1];
    try {
      const docxLib = await import('https://unpkg.com/docx@9.7.1/dist/index.mjs');
      const blob = await buildIntakeDocx(docxLib, d, est);
      downloadBlob(blob, (d.customerName || 'intake').replace(/[^\w\- ]+/g, '').trim() + ' - Intake Sheet.docx');
      await recordDocumentGenerated(d, 'intake');
    } catch (e) {
      alert('Could not generate the Word document — check your connection and try again.');
    }
  },

  async postComment(dealId) {
    if (!currentUser) return;
    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const input = document.getElementById('comment-input');
    const text = (input.value || '').trim();
    if (!text) return;
    d.comments = d.comments || [];
    d.comments.push({ id: uid('cmt'), author: currentUser.name, text, createdAt: Date.now() });
    input.value = '';
    await saveDeal(d);
  },

  // Manage Users is only reachable via goManageUsers, which already checks
  // this, but these are re-checked here too since they mutate shared data.
  updateUserField(userId, field, value) {
    if (!isAdminUser(currentUser)) return;
    const u = allUsers.find(x => x.id === userId);
    if (u) u[field] = value;
  },

  async saveUserField(userId) {
    if (!isAdminUser(currentUser)) return;
    const u = allUsers.find(x => x.id === userId);
    if (!u || !window.__firebaseSaveUser) return;
    await window.__firebaseSaveUser(u);
    render();
  },

  // Existing PINs are never shown to admins editing other users — this only
  // ever writes a NEW value, and does nothing if left blank.
  async resetUserPin(userId, newPin) {
    if (!isAdminUser(currentUser)) return;
    const val = (newPin || '').trim();
    if (!val) return;
    const u = allUsers.find(x => x.id === userId);
    if (!u) return;
    u.pin = val;
    if (window.__firebaseSaveUser) await window.__firebaseSaveUser(u);
    render();
  },

  async addUser() {
    if (!isAdminUser(currentUser)) return;
    const nameInput = document.getElementById('new-user-name');
    const emailInput = document.getElementById('new-user-email');
    const pinInput = document.getElementById('new-user-pin');
    const roleSelect = document.getElementById('new-user-role');
    const name = (nameInput.value || '').trim();
    const email = (emailInput.value || '').trim();
    const pin = (pinInput.value || '').trim();
    const role = (roleSelect.value === 'admin' || roleSelect.value === 'viewer') ? roleSelect.value : 'rep';
    if (!name || !pin) {
      alert('Enter a name and a PIN for the new user.');
      return;
    }
    if (allUsers.some(u => u.name.toLowerCase() === name.toLowerCase())) {
      alert('A user named "' + name + '" already exists.');
      return;
    }
    const user = { id: uid('usr'), name, email: email || null, pin, role, approverSlot: null, createdAt: Date.now() };
    if (window.__firebaseSaveUser) await window.__firebaseSaveUser(user);
    nameInput.value = '';
    emailInput.value = '';
    pinInput.value = '';
    roleSelect.value = 'rep';
    render();
  },

  async removeUser(userId) {
    if (!isAdminUser(currentUser)) return;
    const u = allUsers.find(x => x.id === userId);
    if (!u) return;
    if (u.id === currentUser.id) {
      alert("You can't remove your own account while logged in as them.");
      return;
    }
    const warning = u.approverSlot
      ? (u.name + ' is the ' + (u.approverSlot === 'connor' ? 'Connor' : 'Sandy') + ' approver account — removing it means no one can approve or reject in that slot. Continue?')
      : ('Remove ' + u.name + '? They will no longer be able to log in.');
    if (!confirm(warning)) return;
    if (window.__firebaseDeleteUser) await window.__firebaseDeleteUser(userId);
    render();
  },

  // Templates (unlike Manage Users) are open to any logged-in user to create
  // and edit — anyone building proposals may need to add or adjust boilerplate.
  updateTemplateField(templateId, field, value) {
    if (!currentUser) return;
    const t = allTemplates.find(x => x.id === templateId);
    if (t) t[field] = value;
  },

  async saveTemplateField(templateId) {
    if (!currentUser) return;
    const t = allTemplates.find(x => x.id === templateId);
    if (!t || !window.__firebaseSaveTemplate) return;
    await window.__firebaseSaveTemplate(t);
    render();
  },

  async addTemplate() {
    if (!currentUser) return;
    const nameInput = document.getElementById('new-template-name');
    const name = (nameInput.value || '').trim();
    if (!name) {
      alert('Enter a name for the new template.');
      return;
    }
    const template = {
      id: uid('tpl'), name,
      scopeIntro: '', scopeSteps: '', conditions: '', exclusions: '', legalProtections: '', nextSteps: '',
      createdAt: Date.now()
    };
    if (window.__firebaseSaveTemplate) await window.__firebaseSaveTemplate(template);
    nameInput.value = '';
    render();
  },

  async removeTemplate(templateId) {
    if (!currentUser) return;
    const t = allTemplates.find(x => x.id === templateId);
    if (!t) return;
    if (!confirm('Remove template "' + t.name + '"? This cannot be undone.')) return;
    if (window.__firebaseDeleteTemplate) await window.__firebaseDeleteTemplate(templateId);
    render();
  },

  goManageCostCodes() {
    if (!currentUser) return;
    currentView = 'cost-codes';
    render();
  },

  // Cost codes are open to any logged-in user, same as Templates — any rep
  // building a Cost Breakdown may need to add a code that isn't there yet.
  updateCostCodeField(costCodeId, field, value) {
    if (!currentUser) return;
    const c = costCodes.find(x => x.id === costCodeId);
    if (c) c[field] = value;
  },

  async saveCostCodeField(costCodeId) {
    if (!currentUser) return;
    const c = costCodes.find(x => x.id === costCodeId);
    if (!c || !window.__firebaseSaveCostCode) return;
    await window.__firebaseSaveCostCode(c);
    render();
  },

  async addCostCode() {
    if (!currentUser) return;
    const codeInput = document.getElementById('new-cost-code-code');
    const nameInput = document.getElementById('new-cost-code-name');
    const categoryInput = document.getElementById('new-cost-code-category');
    const code = (codeInput.value || '').trim();
    const name = (nameInput.value || '').trim();
    if (!code || !name) {
      alert('Enter both a code number and a name.');
      return;
    }
    if (costCodes.some(c => c.code === code)) {
      alert('Cost code "' + code + '" already exists.');
      return;
    }
    const costCode = {
      id: uid('cc'), code, name,
      category: (categoryInput.value || '').trim(),
      defaultCostType: '', defaultUnit: '',
      createdAt: Date.now()
    };
    if (window.__firebaseSaveCostCode) await window.__firebaseSaveCostCode(costCode);
    codeInput.value = '';
    nameInput.value = '';
    categoryInput.value = '';
    render();
  },

  async removeCostCode(costCodeId) {
    if (!currentUser) return;
    const c = costCodes.find(x => x.id === costCodeId);
    if (!c) return;
    if (!confirm('Remove cost code "' + costCodeLabel(c) + '"? This cannot be undone.')) return;
    if (window.__firebaseDeleteCostCode) await window.__firebaseDeleteCostCode(costCodeId);
    render();
  },

  // Attaching a code auto-fills the description (only if still blank) and
  // syncs the cost type to the code's default — the whole point of a code
  // is consistent classification, so that one always wins.
  setItemCostCode(secId, itemId, costCodeId) {
    const s = draftDeal.sections.find(s => s.id === secId);
    const i = s && s.items.find(i => i.id === itemId);
    if (!i) return;
    i.costCodeId = costCodeId;
    const code = costCodeId ? costCodes.find(c => c.id === costCodeId) : null;
    if (code) {
      if (!i.desc.trim()) i.desc = code.name;
      if (code.defaultCostType) i.costType = code.defaultCostType;
      if (code.defaultUnit) i.unit = code.defaultUnit;
    }
    render();
  },

  goManageDealTemplates() {
    if (!currentUser) return;
    currentView = 'deal-templates';
    render();
  },

  // Captures the current draft's Cost Breakdown as a reusable template —
  // this is the only way templates get their line items; there's no
  // separate item editor for templates themselves, so it's always a real,
  // already-tested deal structure rather than hand-typed template data.
  async saveAsDealTemplate() {
    if (!currentUser) return;
    const hasItems = draftDeal.sections.some(s => s.items.length > 0);
    if (!hasItems) {
      alert('Add at least one line item before saving this as a template.');
      return;
    }
    const defaultName = 'Main Template';
    const name = (prompt('Name this template:', defaultName) || '').trim();
    if (!name) return;
    const existing = dealTemplates.find(t => t.name.toLowerCase() === name.toLowerCase());
    const template = {
      id: existing ? existing.id : uid('dtpl'),
      name,
      sections: draftDeal.sections.map(sec => ({
        id: uid('sec'),
        name: sec.name,
        items: sec.items.map(item => ({ ...item, id: uid('item') }))
      })),
      createdAt: existing ? existing.createdAt : Date.now()
    };
    if (window.__firebaseSaveDealTemplate) {
      const result = await window.__firebaseSaveDealTemplate(template);
      alert(result.ok ? `Saved as template "${name}".` : 'Failed to save template — try again. ' + (result.error || ''));
    }
  },

  // Lets a rep swap in a different template after landing on the form —
  // "+ New Deal" already auto-applies Main Template, this is for switching
  // to another one or reloading it after making changes.
  loadDealTemplateFromSelect() {
    const select = document.getElementById('choose-template-select');
    const templateId = select && select.value;
    if (!templateId) { alert('Pick a template first.'); return; }
    const template = dealTemplates.find(t => t.id === templateId);
    if (!template) return;
    const hasContent = draftDeal.sections.some(s => s.items.length > 0);
    if (hasContent && !confirm('Replace the current Cost Breakdown with "' + template.name + '"? Any unsaved line items will be lost.')) return;
    draftDeal.sections = template.sections.map(sec => ({
      id: uid('sec'),
      name: sec.name,
      items: sec.items.map(item => ({ ...item, id: uid('item') }))
    }));
    render();
  },

  updateDealTemplateField(templateId, field, value) {
    if (!currentUser) return;
    const t = dealTemplates.find(x => x.id === templateId);
    if (t) t[field] = value;
  },

  async saveDealTemplateField(templateId) {
    if (!currentUser) return;
    const t = dealTemplates.find(x => x.id === templateId);
    if (!t || !window.__firebaseSaveDealTemplate) return;
    await window.__firebaseSaveDealTemplate(t);
    render();
  },

  async removeDealTemplate(templateId) {
    if (!currentUser) return;
    const t = dealTemplates.find(x => x.id === templateId);
    if (!t) return;
    if (!confirm('Remove template "' + t.name + '"? This cannot be undone.')) return;
    if (window.__firebaseDeleteDealTemplate) await window.__firebaseDeleteDealTemplate(templateId);
    render();
  }
};

// ---------- Render functions ----------
// Grows a textarea to fit its full content height, no internal scrollbar —
// used for Site Notes so reading everything doesn't require scrolling
// inside a tiny box. Re-run after every keystroke and after every render()
// (a fresh innerHTML paint has no prior height to build on).
function autoGrowTextarea(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function render() {
  const main = document.getElementById('main');
  if (currentView === 'list') main.innerHTML = renderList();
  else if (currentView === 'form') main.innerHTML = renderForm();
  else if (currentView === 'detail') main.innerHTML = renderDetail();
  else if (currentView === 'users') main.innerHTML = renderUsers();
  else if (currentView === 'change-password') main.innerHTML = renderChangePassword();
  else if (currentView === 'templates') main.innerHTML = renderTemplates();
  else if (currentView === 'cost-codes') main.innerHTML = renderCostCodes();
  else if (currentView === 'deal-templates') main.innerHTML = renderDealTemplates();
  else if (currentView === 'proposal') main.innerHTML = renderProposal();
  else if (currentView === 'material-calc') main.innerHTML = renderMaterialCalculator();
  else if (currentView === 'material-estimate-view') main.innerHTML = renderMaterialEstimateView();
  main.querySelectorAll('textarea.notes-autogrow').forEach(autoGrowTextarea);
}

function renderList() {
  let filtered = deals;
  if (currentFilter !== 'all') filtered = deals.filter(d => dealStatus(d) === currentFilter);

  const counts = {
    all: deals.length,
    pending: deals.filter(d => dealStatus(d) === 'pending').length,
    approved: deals.filter(d => dealStatus(d) === 'approved').length,
    rejected: deals.filter(d => dealStatus(d) === 'rejected').length
  };

  const tabs = ['all','pending','approved','rejected'].map(f =>
    `<div class="tab ${currentFilter===f?'active':''}" onclick="App.setFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)} (${counts[f]})</div>`
  ).join('');

  let body;
  if (filtered.length === 0) {
    body = `<div class="empty-state">
      <div class="big">No deals here yet</div>
      <div>New submissions will show up in this list.</div>
    </div>`;
  } else {
    body = filtered.map(d => {
      const status = dealStatus(d);
      return `<div class="deal-card" onclick="App.viewDeal('${d.id}')">
        <div class="info">
          <div class="job">${esc(d.customerName || 'Untitled deal')}</div>
          <div class="meta">${esc(fullAddressLine(d) || 'No address')} &middot; Rep: ${esc(d.repName || '—')} &middot; ${esc(d.date || '')}</div>
        </div>
        <div class="right">
          <div class="price">${money(dealClientPrice(d))}<span class="label">Client Price</span></div>
          <div class="stamp ${status}">${status}</div>
        </div>
      </div>`;
    }).join('');
  }

  const errBanner = storageError ? `<div class="banner">Something went wrong saving your last change. Try again — if it keeps happening, this device may be offline.${storageErrorDetail ? `<div style="margin-top:5px; font-size:11.5px; opacity:0.8;">Details: ${esc(storageErrorDetail)}</div>` : ''}</div>` : '';

  return `${errBanner}<div class="tabs">${tabs}</div>${body}`;
}

function renderForm() {
  const d = draftDeal;

    const rows = sec.items.map(item => {
      const c = itemCalc(item);
      return `
      <tr>

            <option value="">No cost code</option>
            ${costCodeOptions(item.costCodeId)}

        </td>

        <button class="btn btn-outline btn-small" onclick="App.removeSection('${sec.id}')">Remove Section</button>
      </div>
      <div class="table-scroll">
      <table class="items">
        <thead><tr>
          <th class="col-desc">Description</th><th>Qty</th><th>Unit</th>
          <th>Unit Cost</th><th>Cost Type</th><th>Markup %</th><th>Unit Price</th>
          <th>Builder Cost</th><th>Client Price</th><th>Margin %</th><th>Profit $</th><th class="col-action"></th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="subtotal">
          <td class="label-cell" colspan="7">Section Subtotal</td>
          <td id="sec-bc-${sec.id}">${money(t.builderCost)}</td>
          <td id="sec-cp-${sec.id}">${money(t.clientPrice)}</td>
          <td id="sec-mg-${sec.id}">${sectionMargin(t).toFixed(1)}%</td>
          <td id="sec-pf-${sec.id}">${money(t.profit)}</td>
          <td></td>
        </tr></tfoot>
      </table>
      </div>
      <button class="add-row-btn" onclick="App.addItem('${sec.id}')">+ Add line item</button>
    </div>`;

  const attachmentsHtml = d.attachments.map(a => renderAttachmentCard(a, {
    categoryOnChange: `App.updateAttachmentCategory('${a.id}', this.value)`,
    descriptionOnChange: `App.updateAttachmentDescription('${a.id}', this.value)`,
    deleteOnClick: `App.removeAttachment('${a.id}')`
  })).join('');

  const checklistBannerHtml = !submissionChecklistErrors || submissionChecklistErrors.length === 0 ? '' : `
  <div class="banner" id="submission-checklist-banner">
    <strong>This proposal is missing required information — Sandy and Connor can't review it until it's complete (CFI SOP Improvement 02).</strong>
    <ul style="margin:8px 0 0; padding-left:18px;">
      ${submissionChecklistErrors.map(c => `<li><strong>${esc(c.title)}:</strong> ${c.missing.map(esc).join(', ')}</li>`).join('')}
    </ul>
  </div>`;

  return `
  <div class="back-link" onclick="App.cancelForm()">&larr; Back to all deals</div>

  ${checklistBannerHtml}

  <div class="panel">
    <div class="attach-btn-row">
      <label class="btn btn-outline btn-small" style="cursor:pointer;">
        + Import from Estimate File
        <input type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            style="display:none;" onchange="App.importEstimateFile(this.files); this.value='';">
      </label>
      <span class="attach-hint">Upload a cost estimate export (.xls/.xlsx) to auto-fill the cost breakdown below. Customer info still needs to be entered manually.</span>
    </div>
    ${dealTemplates.length ? `
    <div class="attach-btn-row" style="margin-top:10px;">
      <select id="choose-template-select" style="max-width:260px;">
        <option value="">Choose a template...</option>
        ${dealTemplates.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-small" onclick="App.loadDealTemplateFromSelect()">Load Template</button>
      <span class="attach-hint">Replaces the Cost Breakdown below with the picked template's sections and line items.</span>
    </div>` : ''}
  </div>

  <div class="panel">
    <h2>Deal Details</h2>
    <div class="field-grid">
      <div><label class="field-label">Customer Name</label>
        <input type="text" value="${esc(d.customerName)}" oninput="App.updateHeaderField('customerName', this.value)"></div>
      <div><label class="field-label">Company</label>
        <input type="text" value="${esc(d.company)}" oninput="App.updateHeaderField('company', this.value)"></div>
      <div><label class="field-label">Email Address</label>
        <input type="text" value="${esc(d.email)}" oninput="App.updateHeaderField('email', this.value)"></div>
      <div><label class="field-label">Sales Rep</label>
        <input type="text" value="${esc(d.repName)}" oninput="App.updateHeaderField('repName', this.value)"></div>
      <div><label class="field-label">Date</label>
        <input type="date" value="${esc(d.date)}" oninput="App.updateHeaderField('date', this.value)"></div>
    </div>
    <div class="field-grid" style="margin-top:14px;">
      <div><label class="field-label">Address</label>
        <input type="text" value="${esc(d.address)}" oninput="App.updateHeaderField('address', this.value)"></div>
      <div><label class="field-label">City</label>
        <input type="text" value="${esc(d.city)}" oninput="App.updateHeaderField('city', this.value)"></div>
      <div><label class="field-label">State</label>
        <input type="text" value="${esc(d.state)}" oninput="App.updateHeaderField('state', this.value)"></div>
      <div><label class="field-label">Zip</label>
        <input type="text" value="${esc(d.zip)}" oninput="App.updateHeaderField('zip', this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Product Specs</h2>
    <p class="attach-hint" style="margin-top:-6px;">Shown on the client proposal's Scope of Work section.</p>
    <div class="field-grid">
      <div><label class="field-label">Product Design</label>
        <input type="text" placeholder="e.g. Smoothstone" value="${esc(d.productDesign)}" oninput="App.updateHeaderField('productDesign', this.value)"></div>
      <div><label class="field-label">Color</label>
        <input type="text" placeholder="e.g. Sequoia Sandstone Integral" value="${esc(d.colorFinish)}" oninput="App.updateHeaderField('colorFinish', this.value)"></div>
      <div><label class="field-label">Linear Feet</label>
        <input type="text" placeholder="e.g. 115" value="${esc(d.linearFeet)}" oninput="App.updateHeaderField('linearFeet', this.value)"></div>
      <div><label class="field-label">Height</label>
        <input type="text" placeholder="e.g. 6" value="${esc(d.wallHeightSpec)}" oninput="App.updateHeaderField('wallHeightSpec', this.value)"></div>
    </div>
    <div class="field-grid" style="margin-top:14px;">
      <div><label class="field-label">Panel / Post Style</label>
        <input type="text" placeholder="e.g. Standard post caps, flat panel face" value="${esc(d.panelPostStyle)}" oninput="App.updateHeaderField('panelPostStyle', this.value)"></div>
      <div><label class="field-label">Special Requirements</label>
        <input type="text" placeholder='e.g. "None" or match existing gate color' value="${esc(d.specialRequirements)}" oninput="App.updateHeaderField('specialRequirements', this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Job Description</h2>
    <div class="field-grid">
      <div><label class="field-label">Demo Requirements</label>
        <input type="text" placeholder='e.g. "None" or remove existing 120ft wood fence' value="${esc(d.demoRequirements)}" oninput="App.updateHeaderField('demoRequirements', this.value)"></div>
      <div><label class="field-label">Materials vs. Turnkey</label>
        <select onchange="App.updateHeaderField('installType', this.value)">
          <option value="">Select...</option>
          ${INSTALL_TYPES.map(t => `<option value="${t}" ${t===d.installType?'selected':''}>${t}</option>`).join('')}
        </select></div>
    </div>
  </div>

  <div class="panel">
    <h2>Job Site Specifics</h2>
    <div class="field-grid">
      <div><label class="field-label">Property Type</label>
        <select onchange="App.updateJobSiteField('propertyType', this.value)">
          <option value="">Select...</option>
          ${PROPERTY_TYPES.map(p => `<option value="${p}" ${p===d.jobSite.propertyType?'selected':''}>${p}</option>`).join('')}
        </select></div>
      <div><label class="field-label">Site Access</label>
        <select onchange="App.updateJobSiteField('accessDifficulty', this.value)">
          <option value="">Select...</option>
          ${ACCESS_OPTIONS.map(a => `<option value="${a}" ${a===d.jobSite.accessDifficulty?'selected':''}>${a}</option>`).join('')}
        </select></div>
    </div>
    <div style="margin-top:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px;">
        <label class="field-label" style="margin-bottom:0;">Site Notes</label>
        <button class="btn btn-outline btn-small" id="organize-draft-notes-btn" onclick="App.organizeDraftNotesWithAI()">✨ Organize with AI</button>
      </div>
      <textarea class="notes-autogrow" placeholder="Anything Connor and Sandy should know before approving — access, terrain, timeline pressure, HOA, etc."
        oninput="App.updateJobSiteField('notes', this.value); autoGrowTextarea(this)">${esc(d.jobSite.notes)}</textarea>
    </div>
  </div>

  <div class="panel">
    <h2>Cost Breakdown</h2>
    ${sectionsHtml}
    <button class="btn btn-outline" onclick="App.addSection()">+ Add Section</button>
    <button class="btn btn-outline" onclick="App.saveAsDealTemplate()">💾 Save as Template</button>

    <div class="totals-bar">
      <div class="stat"><div class="stat-label">Total Builder Cost</div><div class="stat-value" id="grand-buildercost">${money(dealBuilderCost(d))}</div></div>
      <div class="stat"><div class="stat-label">Client Price</div><div class="stat-value" id="grand-clientprice">${money(dealClientPrice(d))}</div></div>
      <div class="stat"><div class="stat-label">Margin %</div><div class="stat-value" id="grand-margin">${dealMargin(d).toFixed(1)}%</div></div>
      <div class="stat"><div class="stat-label">Profit $</div><div class="stat-value" id="grand-profit">${money(dealProfit(d))}</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Clarifications, Assumptions &amp; Exclusions</h2>
    <div><label class="field-label">Clarifications &amp; Assumptions</label>
      <textarea class="notes-autogrow" placeholder='Engineering, soil, grade, access, utilities, city/permit, customer responsibilities — enter "None" if not applicable.'
        oninput="App.updateHeaderField('clarificationsAssumptions', this.value); autoGrowTextarea(this)">${esc(d.clarificationsAssumptions)}</textarea>
    </div>
    <div style="margin-top:12px;">
      <label class="field-label">Exclusions</label>
      <textarea class="notes-autogrow" placeholder='Everything NOT included — landscaping, irrigation, surveying, rock excavation, etc. Enter "None" if not applicable.'
        oninput="App.updateHeaderField('exclusions', this.value); autoGrowTextarea(this)">${esc(d.exclusions)}</textarea>
    </div>
  </div>

  <div class="panel">
    <h2>Attachments</h2>
    <div class="attach-btn-row">
      <label class="btn btn-outline btn-small" style="cursor:pointer;">
        📷 Take Photo
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="App.handleFiles(this.files); this.value='';">
      </label>
      <label class="btn btn-outline btn-small" style="cursor:pointer;">
        + Add Attachments
        <input type="file" accept="image/*,application/pdf" multiple style="display:none;" onchange="App.handleFiles(this.files); this.value='';">
      </label>
      <span class="attach-hint">Photos, contracts, and site plans — images are compressed automatically before saving.</span>
    </div>
    <div class="attachments-grid">${attachmentsHtml}</div>
  </div>

  <div class="form-actions">
    <button class="btn btn-outline" onclick="App.cancelForm()">Cancel</button>
    <button class="btn btn-primary" onclick="App.submitDeal()">Submit for Approval</button>
  </div>`;
}

function renderDetail() {
  const d = deals.find(x => x.id === currentDealId);
  if (!d) return `<div class="empty-state">Deal not found.<div class="back-link" onclick="App.goList()">&larr; Back</div></div>`;

  const status = dealStatus(d);

  const sectionsHtml = d.sections.map(sec => {
    const rows = sec.items.map(item => {
      const c = itemCalc(item);
      return `
      <tr>
        <td class="col-desc">${esc(item.desc || '—')}${item.costCodeId ? (() => {
          const c = costCodes.find(cc => cc.id === item.costCodeId);
          return c ? `<div style="font-size:11px; color:var(--muted); margin-top:2px;">${esc(costCodeLabel(c))}</div>` : '';
        })() : ''}</td>
        <td class="num">${item.qty}</td>
        <td>${esc(item.unit)}</td>
        <td class="num">${money(item.unitCost)}</td>
        <td>${esc(item.costType === 'Other' && item.costTypeOther ? item.costTypeOther : item.costType)}</td>
        <td class="num">${Number(item.markupPercent)||0}%</td>
        <td class="num">${money(c.unitPrice)}</td>
        <td class="num">${money(c.builderCost)}</td>
        <td class="num">${money(c.clientPrice)}</td>
        <td class="num">${c.margin.toFixed(1)}%</td>
        <td class="num">${money(c.profit)}</td>
      </tr>`;
    }).join('');
    const t = sectionTotals(sec);
    return `<div class="section-block">
      <div class="section-head"><strong>${esc(sec.name)}</strong></div>
      <div class="table-scroll">
      <table class="items">
        <thead><tr><th class="col-desc">Description</th><th>Qty</th><th>Unit</th>
        <th>Unit Cost</th><th>Cost Type</th><th>Markup %</th><th>Unit Price</th>
        <th>Builder Cost</th><th>Client Price</th><th>Margin %</th><th>Profit $</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="subtotal">
          <td class="label-cell" colspan="7">Section Subtotal</td>
          <td>${money(t.builderCost)}</td>
          <td>${money(t.clientPrice)}</td>
          <td>${sectionMargin(t).toFixed(1)}%</td>
          <td>${money(t.profit)}</td>
        </tr></tfoot>
      </table>
      </div>
    </div>`;
  }).join('');

  const attachmentsHtml = (d.attachments || []).map(a => renderAttachmentCard(a, {
    categoryOnChange: `App.updateAttachmentCategoryOnDeal('${d.id}','${a.id}', this.value)`,
    descriptionOnChange: `App.updateAttachmentDescriptionOnDeal('${d.id}','${a.id}', this.value)`,
    deleteOnClick: `App.removeAttachmentFromDeal('${d.id}','${a.id}')`
  })).join('');

  const commentsHtml = (d.comments || []).length
    ? (d.comments || []).map(c => `
      <div class="comment">
        <div class="comment-head"><span class="comment-author">${esc(c.author)}</span><span class="comment-time">${new Date(c.createdAt).toLocaleString()}</span></div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>`).join('')
    : `<div class="comment-empty">No messages yet — start the conversation.</div>`;

  function approverBlock(approver) {
    const approverUser = allUsers.find(u => u.approverSlot === approver);
    const label = approverUser ? approverUser.name : (approver === 'connor' ? 'Connor' : 'Sandy');
    const val = d.approvals[approver];
    const reason = d.rejectReasons[approver] || '';
    let statusLine = 'Awaiting decision';
    if (val === true) statusLine = 'Approved';
    if (val === false) statusLine = 'Rejected' + (reason ? ': ' + esc(reason) : '');
    const canAct = currentUser && currentUser.approverSlot === approver;
    const actionsHtml = canAct ? `
      <div class="actions">
        <button class="btn btn-success btn-small" onclick="App.setApproval('${d.id}','${approver}', true)">Approve</button>
        <button class="btn btn-danger btn-small" onclick="App.openRejectBox('${approver}')">Reject</button>
      </div>
      <div class="status-line">${statusLine}</div>
      <div id="reason-${approver}" style="display:${openRejectBoxFor===approver ? 'block':'none'};">
        <textarea placeholder="Reason for rejection" oninput="App.updateRejectReason('${d.id}','${approver}', this.value)">${esc(reason)}</textarea>
        <button class="btn btn-outline btn-small" style="margin-top:6px;" onclick="App.setApproval('${d.id}','${approver}', false); App.saveRejectReason('${d.id}','${approver}')">Confirm Reject</button>
      </div>` : `<div class="status-line">${statusLine}</div>`;
    return `<div class="approver-card">
      <div class="name">${esc(label)}</div>
      ${actionsHtml}
    </div>`;
  }

  const overviewHtml = `
  <div class="panel">
    <h2>Material Estimates</h2>
    ${(d.materialEstimates && d.materialEstimates.length) ? d.materialEstimates.map(est => `
      <div class="section-block">
        <div class="section-head">
          <strong>${esc(est.productName)} — ${esc(est.styleLabel)} (${est.linearFeet} LF)</strong>
          <button class="btn btn-danger btn-small" onclick="App.removeMaterialEstimate('${d.id}','${est.id}')">✕</button>
        </div>
        <div style="padding:12px;">
          <div class="totals-bar" style="margin-bottom:12px;">
            <div class="stat"><div class="stat-label">Posts</div><div class="stat-value">${est.posts}</div></div>
            <div class="stat"><div class="stat-label">${esc(est.secondaryLabel)}</div><div class="stat-value">${est.secondaryValue}</div></div>
            ${est.hasPanelCaps ? `<div class="stat"><div class="stat-label">Panel Caps</div><div class="stat-value">${est.posts}</div></div>` : ''}
            ${est.hasPostCaps ? `<div class="stat"><div class="stat-label">Post Caps</div><div class="stat-value">${est.posts}</div></div>` : ''}
          </div>
          <p class="attach-hint" style="margin:0 0 10px;">Saved ${esc(new Date(est.savedAt).toLocaleDateString())} by ${esc(est.savedBy || '—')}</p>
          <div class="doc-download-row">
            <select onchange="App.setMaterialEstimateAssignee('${d.id}','${est.id}', this.value)" style="max-width:220px;">
              <option value="">Assign to...</option>
              ${otherUserOptions(est.assignedTo)}
            </select>
            <button class="btn btn-outline btn-small" onclick="App.sendNotification('${d.id}','material-estimate','${est.id}')">🔔 Notify</button>
            <button class="btn btn-outline btn-small" onclick="App.openMaterialEstimate('${d.id}','${est.id}')">Open / Print</button>
          </div>
        </div>
      </div>`).join('') : `<div class="attach-hint">No material estimates saved yet — use the Material Calculator to add one.</div>`}
  </div>

  <div class="panel">
    <h2>Job Site Specifics</h2>
    <div class="job-site-summary">
      <div class="kv"><div class="k">Property Type</div><div class="v">${esc(d.jobSite.propertyType || '—')}</div></div>
      <div class="kv"><div class="k">Site Access</div><div class="v">${esc(d.jobSite.accessDifficulty || '—')}</div></div>
    </div>
    <div style="margin-top:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px;">
        <label class="field-label" style="margin-bottom:0;">Site Notes</label>
        <button class="btn btn-outline btn-small" id="organize-notes-btn-${d.id}" onclick="App.organizeNotesWithAI('${d.id}')">✨ Organize with AI</button>
      </div>
      <textarea class="notes-autogrow" placeholder="Anything Connor and Sandy should know before approving — access, terrain, timeline pressure, HOA, etc."
        oninput="autoGrowTextarea(this)" onchange="App.updateDealNotes('${d.id}', this.value)">${esc(d.jobSite.notes)}</textarea>
    </div>
  </div>

  <div class="panel">
    <h2>Cost Breakdown</h2>
    ${sectionsHtml}
    <div class="totals-bar">
      <div class="stat"><div class="stat-label">Total Builder Cost</div><div class="stat-value">${money(dealBuilderCost(d))}</div></div>
      <div class="stat"><div class="stat-label">Client Price</div><div class="stat-value">${money(dealClientPrice(d))}</div></div>
      <div class="stat"><div class="stat-label">Margin %</div><div class="stat-value">${dealMargin(d).toFixed(1)}%</div></div>
      <div class="stat"><div class="stat-label">Profit $</div><div class="stat-value">${money(dealProfit(d))}</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Documents</h2>
    <p class="attach-hint" style="margin-top:-6px;">Each is generated fresh from the deal's current data — download from its own tab/screen above.</p>
    <div class="job-site-summary">
      <div class="kv"><div class="k">Proposal</div><div class="v">${documentStatusLine(d.documents && d.documents.proposal, d.proposalAssignedTo)}</div></div>
      <div class="kv"><div class="k">Handoff Sheet</div><div class="v">${documentStatusLine(d.documents && d.documents.handoff, d.handoff && d.handoff.assignedTo)}</div></div>
      <div class="kv"><div class="k">Engineering Order</div><div class="v">${documentStatusLine(d.documents && d.documents.engineering, d.engineering && d.engineering.assignedTo)}</div></div>
      <div class="kv"><div class="k">Intake Sheet</div><div class="v">${documentStatusLine(d.documents && d.documents.intake, d.intake && d.intake.assignedTo)}</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Attachments</h2>
    <div class="attach-btn-row">
      <label class="btn btn-outline btn-small" style="cursor:pointer;">
        📷 Take Photo
        <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="App.addAttachmentsToDeal('${d.id}', this.files); this.value='';">
      </label>
      <label class="btn btn-outline btn-small" style="cursor:pointer;">
        + Add Attachments
        <input type="file" accept="image/*,application/pdf" multiple style="display:none;" onchange="App.addAttachmentsToDeal('${d.id}', this.files); this.value='';">
      </label>
      <span class="attach-hint">Photos, contracts, and site plans — images are compressed automatically before saving.</span>
    </div>
    <div class="attachments-grid">${attachmentsHtml}</div>
  </div>

  <div class="panel">
    <h2>Approval</h2>
    <div class="approval-grid">
      ${approverBlock('connor')}
      ${approverBlock('sandy')}
    </div>
  </div>

  <div class="panel">
    <h2>Discussion</h2>
    <div class="comment-list">${commentsHtml}</div>
    <div class="comment-composer">
      <textarea id="comment-input" placeholder="Message about this deal, posting as ${esc(currentUser ? currentUser.name : '')}..."
        onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); App.postComment('${d.id}'); }"></textarea>
      <button class="btn btn-primary btn-small" onclick="App.postComment('${d.id}')">Send</button>
    </div>
  </div>`;

  const tabBody = detailTab === 'handoff' ? renderHandoffTab(d, status)
    : detailTab === 'engineering' ? renderEngineeringTab(d)
    : detailTab === 'intake' ? renderIntakeTab(d)
    : overviewHtml;

  return `
  <div class="back-link" onclick="App.goList()">&larr; Back to all deals</div>

  <div class="panel" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px;">
    <div>
      <h2 style="margin-bottom:6px;">${esc(d.customerName)}${d.company ? ' — ' + esc(d.company) : ''}</h2>
      <div style="color:var(--muted); font-size:13.5px;">${esc(fullAddressLine(d))} &middot; Rep: ${esc(d.repName)} &middot; ${esc(d.date)}</div>
      ${d.email ? `<div style="color:var(--muted); font-size:13.5px; margin-top:2px;">${esc(d.email)}</div>` : ''}
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="stamp ${status}">${status}</div>
      <button class="btn btn-outline btn-small" onclick="App.goProposal('${d.id}')">Generate Proposal</button>
      <button class="btn btn-outline btn-small" onclick="App.setDetailTab('handoff')">Handoff Sheet</button>
      <button class="btn btn-outline btn-small" onclick="App.setDetailTab('engineering')">Engineering Order</button>
      <button class="btn btn-outline btn-small" onclick="App.setDetailTab('intake')">Intake Sheet</button>
      <button class="btn btn-outline btn-small" onclick="App.goMaterialCalculator('${d.id}')">Material Calculator</button>
      ${status === 'rejected' ? `<button class="btn btn-outline btn-small" onclick="App.editDeal('${d.id}')">Edit</button>` : ''}
    </div>
  </div>

  <div class="tabs">
    <div class="tab ${detailTab === 'overview' ? 'active' : ''}" onclick="App.setDetailTab('overview')">Overview</div>
    <div class="tab ${detailTab === 'handoff' ? 'active' : ''}" onclick="App.setDetailTab('handoff')">Handoff Sheet</div>
    <div class="tab ${detailTab === 'engineering' ? 'active' : ''}" onclick="App.setDetailTab('engineering')">Engineering Order</div>

      const item = h.items[key] || { checked: false, notes: '' };
      return `<tr>
        <td class="col-check"><input type="checkbox" ${item.checked ? 'checked' : ''}
            onchange="App.updateHandoffField('${d.id}', ['items','${key}','checked'], this.checked)"></td>

// Component-quantity handoff to production — pulled from a saved Material
// Estimate (never entered separately), no pricing anywhere. Matches the
// company's printed Intake Sheet: project info, "Submit to Production
// Manager," and a component/quantity table with "N/A" wherever the chosen
// product doesn't use that component (e.g. Smoothstone has no caps).
function renderIntakeTab(d) {
  const estimates = d.materialEstimates || [];
  if (estimates.length === 0) {
    return `<div class="empty-state">
      <div class="big">No Material Estimate saved yet</div>
      Save one from the Material Calculator first — the Intake Sheet pulls its component breakdown from there.
    </div>`;
  }

  const intake = d.intake || { assignedTo: '', selectedEstimateId: '' };
  const selectedEst = estimates.find(e => e.id === intake.selectedEstimateId) || estimates[estimates.length - 1];
  const fields = computeIntakeFields(d, selectedEst);
  const estimateOptions = estimates.map(e => `<option value="${e.id}" ${e.id===selectedEst.id?'selected':''}>${esc(e.productName)} — ${esc(e.styleLabel)} (${e.linearFeet} LF, saved ${new Date(e.savedAt).toLocaleDateString()})</option>`).join('');

  return `
  <div class="doc-download-row">
    <button class="btn btn-primary" onclick="App.downloadIntakeDocx('${d.id}')">Download as Word (.docx)</button>
    <span class="attach-hint">Pulled from the selected Material Estimate below — component quantities only, no pricing.</span>
  </div>

  <div class="doc-download-row">
    <select onchange="App.updateIntakeField('${d.id}', 'assignedTo', this.value)" style="max-width:220px;">
      <option value="">Assign to...</option>
      ${otherUserOptions(intake.assignedTo)}
    </select>
    <button class="btn btn-outline btn-small" onclick="App.sendNotification('${d.id}','intake')">🔔 Notify</button>
    <span class="attach-hint">Sends a link to this Intake Sheet to their inbox.</span>
  </div>

  <div class="panel">
    <h2>Source Estimate</h2>
    ${estimates.length > 1 ? `
      <div class="field-grid" style="grid-template-columns:1fr;">
        <div><label class="field-label">Material Estimate</label>
          <select onchange="App.updateIntakeField('${d.id}', 'selectedEstimateId', this.value)">${estimateOptions}</select></div>
      </div>` : `<p class="attach-hint" style="margin:0;">${esc(selectedEst.productName)} — ${esc(selectedEst.styleLabel)} (${selectedEst.linearFeet} LF)</p>`}
  </div>

  <div class="panel">
    <h2>Intake Sheet</h2>
    <p class="attach-hint" style="margin-top:-6px;">Submit to Production Manager. Please include, if any, the engineering plans.</p>
    <div class="job-site-summary" style="margin-bottom:14px;">
      <div class="kv"><div class="k">Project</div><div class="v">${esc(fields.projectInfo)}</div></div>
    </div>
    <div class="table-scroll">
    <table class="items">
      <thead><tr><th class="col-desc">Item</th><th>Value</th></tr></thead>
      <tbody>
        <tr><td class="col-desc">Total length and height of wall</td><td>${esc(fields.wallLengthHeight)}</td></tr>
        <tr><td class="col-desc">Integral color or paint? If integral what color?</td><td>${esc(fields.color)}</td></tr>
        <tr><td class="col-desc">Total panels needed (retaining qty separate if applicable)</td><td>${esc(fields.panelsNeeded)}</td></tr>
        <tr><td class="col-desc">Total posts needed — line, end, and corner (retaining qty separate if applicable)</td><td>${esc(fields.postsNeeded)}</td></tr>
        <tr><td class="col-desc">Total post caps needed — line, end, and corner</td><td>${esc(fields.postCapsNeeded)}</td></tr>
        <tr><td class="col-desc">How many panel caps are needed?</td><td>${esc(fields.panelCapsNeeded)}</td></tr>
      </tbody>
    </table>
    </div>
  </div>`;
}

// Fence-product takeoff calculator: rail systems (Woodcrete Rail) are taken
// off by rail count, every other style is a stacked precast panel fence
// taken off by height. See the on-page "Estimation Methodology" panel for
// the formulas themselves.
//
// The results, post breakdown, and pricing table are each built by their
// own function (rather than inline in renderMaterialCalculator) so the
// Linear Footage and post-quantity inputs — typed character-by-character —
// can patch just their own computed panel via direct DOM updates instead of
// a full render(), which would recreate the input mid-keystroke and drop
// focus after every character.
function computeMaterialCalcPosts() {
  const product = MATERIAL_CALC_PRODUCTS.find(p => p.key === materialCalcState.productKey) || MATERIAL_CALC_PRODUCTS[0];
  const lf = Number(materialCalcState.linearFeet) || 0;
  if (lf <= 0) return 0;
  return Math.ceil(lf / (product.kind === 'rail' ? 8 : 5)) + 1;
}

function materialCalcResultsHtml() {
  const product = MATERIAL_CALC_PRODUCTS.find(p => p.key === materialCalcState.productKey) || MATERIAL_CALC_PRODUCTS[0];
  const style = product.styles.find(s => s.key === materialCalcState.styleKey) || product.styles[0];
  const lf = Number(materialCalcState.linearFeet) || 0;
  if (lf <= 0) return `<div class="attach-hint">Enter linear footage above to calculate pricing and material takeoff.</div>`;

  const totalPrice = lf * style.pricePerLF;
  const posts = computeMaterialCalcPosts();
  const postCapsHtml = product.hasPostCaps ? `<div class="stat"><div class="stat-label">Post Caps</div><div class="stat-value">${posts}</div></div>` : '';
  return `
    <div class="stat"><div class="stat-label">Unit Price</div><div class="stat-value">${money(style.pricePerLF)}/LF</div></div>
    <div class="stat"><div class="stat-label">Total Price</div><div class="stat-value">${money(totalPrice)}</div></div>
    <div class="stat"><div class="stat-label">Posts</div><div class="stat-value">${posts}</div></div>
    ${product.kind === 'rail'
      ? `<div class="stat"><div class="stat-label">Rails</div><div class="stat-value">${posts * style.rails}</div></div>${postCapsHtml}`
      : `<div class="stat"><div class="stat-label">Panels</div><div class="stat-value">${posts * style.height}</div></div>
         ${product.hasPanelCaps ? `<div class="stat"><div class="stat-label">Panel Caps</div><div class="stat-value">${posts}</div></div>` : ''}
         ${postCapsHtml}`}`;
}

function materialCalcPostTallyHtml(posts) {
  const rows = materialCalcState.postTypeRows || [];
  const allocated = rows.reduce((sum, r) => sum + (Number(r.qty) || 0), 0);
  const byType = POST_TYPES.map(pt => `
    <div class="stat"><div class="stat-label">${pt}</div><div class="stat-value">${rows.filter(r => r.type === pt).reduce((s, r) => s + (Number(r.qty) || 0), 0)}</div></div>`).join('');
  return `${byType}<div class="stat"><div class="stat-label">Allocated / Posts</div><div class="stat-value">${allocated} / ${posts}</div></div>`;
}

function materialCalcPostBreakdownHtml(posts) {
  if (posts === 0) return `<div class="attach-hint">Enter linear footage above to break posts out by type.</div>`;

  // Seed a single row defaulting to all posts as Line Posts the first time
  // there's something to break down — left alone after that so the rep's
  // own row edits survive further linear-footage tweaks.
  if (!Array.isArray(materialCalcState.postTypeRows) || materialCalcState.postTypeRows.length === 0) {
    materialCalcState.postTypeRows = [{ type: POST_TYPES[0], qty: posts }];
  }

  const rows = materialCalcState.postTypeRows;
  const rowsHtml = rows.map((r, i) => `
    <div style="display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px; max-width:280px;"><label class="field-label">Post Type</label>
        <select onchange="App.setPostTypeRowType(${i}, this.value)">
          ${POST_TYPES.map(pt => `<option value="${pt}" ${pt===r.type?'selected':''}>${pt}</option>`).join('')}
        </select></div>
      <div style="width:110px;"><label class="field-label">Quantity</label>
        <input type="number" step="1" min="0" value="${esc(r.qty)}"
            oninput="App.setPostTypeRowQty(${i}, this.value)"></div>
      ${rows.length > 1 ? `<button class="btn btn-danger btn-small" onclick="App.removePostTypeRow(${i})">✕</button>` : ''}
    </div>`).join('');

  return `
    <div id="calc-post-rows">${rowsHtml}</div>
    <button class="btn btn-outline btn-small" onclick="App.addPostTypeRow()">+ Add Post Type</button>
    <div id="calc-post-tally" class="totals-bar" style="margin-top:14px;">${materialCalcPostTallyHtml(posts)}</div>`;
}

function renderMaterialCalculator() {
  const d = deals.find(x => x.id === currentDealId);
  if (!d) return `<div class="empty-state">Deal not found.<div class="back-link" onclick="App.goList()">&larr; Back</div></div>`;

  const styleOptions = product.styles.map(s => `<option value="${s.key}" ${s.key===style.key?'selected':''}>${esc(s.label)}</option>`).join('');
  const posts = computeMaterialCalcPosts();

  return `
  <div class="back-link" onclick="App.viewDeal('${d.id}')">&larr; Back to deal</div>

    <h2>Material Calculator</h2>
    <p class="attach-hint" style="margin-top:-6px;">All pricing below is per linear foot, install only. Pick a fence style and enter the linear footage to get a unit price, total price, and material takeoff.</p>
    <div class="field-grid">
      <div><label class="field-label">Fence Product</label>

      <div><label class="field-label">Linear Footage (LF)</label>
        <input type="number" step="any" min="0" value="${esc(materialCalcState.linearFeet)}" placeholder="0"

    <div class="totals-bar" id="calc-results">
      ${materialCalcResultsHtml()}
    </div>

    <div class="doc-download-row" style="margin-top:14px;">
      <button class="btn btn-primary btn-small" onclick="App.saveMaterialEstimate('${d.id}')">💾 Save Estimate to Deal</button>
      <span class="attach-hint">Saves this calculation to the deal page, where it can be assigned, opened, and printed.</span>
    </div>
  </div>

  <div class="panel">
    <h2>Post Type Breakdown</h2>
    <p class="attach-hint" style="margin-top:-6px;">Denote each post type and how many you need for material ordering.</p>
    <div id="calc-post-breakdown">${materialCalcPostBreakdownHtml(posts)}</div>
  </div>

  <div class="panel">
    <h2>Estimation Methodology</h2>
    <ul style="margin:0; padding-left:18px; line-height:1.7;">
      <li><strong>Woodcrete Rail systems:</strong> Posts = ROUNDUP(LF &divide; 8) + 1 spare post. Rails = Posts &times; the rail count of the selected system (2, 3, 4, or 7). Post caps = number of posts.</li>
      <li><strong>All other styles</strong> (Smoothstone, Chiselstone, Woodcrete, Rusticbrick, Blockcrete): Posts = ROUNDUP(LF &divide; 5) + 1 spare post. Panels = Posts &times; fence height (ft). Where shown, panel caps and post caps both equal the number of posts — not every style uses both: Smoothstone uses neither, Woodcrete and Rusticbrick use panel caps only, and Chiselstone and Blockcrete use both.</li>
      <li>All prices are per linear foot, install only. Use the total price and takeoff counts above to build out the line items on the estimate.</li>
    </ul>
  </div>

  <div class="panel">
    <h2>Pricing Reference</h2>
    ${materialCalcPricingReferenceHtml()}
  </div>`;
}

    </div>`;
  }).join('');

  const templateOptions = allTemplates.map(t => `<option value="${t.id}" ${t.id === selectedTemplateId ? 'selected' : ''}>${esc(t.name)}</option>`).join('');

  return `
  <div class="back-link" onclick="App.viewDeal('${d.id}')">&larr; Back to deal</div>

  <div class="panel">
    <h2>Generate Proposal</h2>
    ${allTemplates.length === 0
      ? `<div class="banner">No proposal templates yet — <a href="#" onclick="App.goManageTemplates(); return false;">create one first</a>.</div>`
      : `<div class="field-grid" style="grid-template-columns:1fr;">
          <div><label class="field-label">Template</label>
            <select id="proposal-template-select" onchange="App.setProposalTemplate(this.value)">${templateOptions}</select></div>
        </div>`}
    <div class="doc-download-row" style="margin-top:14px;">
      <select onchange="App.updateDealField('${d.id}','proposalAssignedTo', this.value)" style="max-width:220px;">
        <option value="">Assign to...</option>
        ${otherUserOptions(d.proposalAssignedTo)}
      </select>
      <button class="btn btn-outline btn-small" onclick="App.sendNotification('${d.id}','proposal')">🔔 Notify</button>
      <span class="attach-hint">Sends a link to this Proposal to their inbox.</span>
    </div>
  </div>

  <div class="panel">
    <h2>Customer Information</h2>
    <p class="attach-hint" style="margin-top:-6px;">Fill in anything missing here — it saves to the deal and is used on the proposal.</p>
    <div class="field-grid">
      <div><label class="field-label">Customer Name</label>
        <input type="text" value="${esc(d.customerName)}" onchange="App.updateDealField('${d.id}','customerName', this.value)"></div>
      <div><label class="field-label">Company</label>
        <input type="text" value="${esc(d.company)}" onchange="App.updateDealField('${d.id}','company', this.value)"></div>
      <div><label class="field-label">Email Address</label>
        <input type="text" value="${esc(d.email)}" onchange="App.updateDealField('${d.id}','email', this.value)"></div>
    </div>
    <div class="field-grid" style="margin-top:14px;">
      <div><label class="field-label">Address</label>
        <input type="text" value="${esc(d.address)}" onchange="App.updateDealField('${d.id}','address', this.value)"></div>
      <div><label class="field-label">City</label>
        <input type="text" value="${esc(d.city)}" onchange="App.updateDealField('${d.id}','city', this.value)"></div>
      <div><label class="field-label">State</label>
        <input type="text" value="${esc(d.state)}" onchange="App.updateDealField('${d.id}','state', this.value)"></div>
      <div><label class="field-label">Zip</label>
        <input type="text" value="${esc(d.zip)}" onchange="App.updateDealField('${d.id}','zip', this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Product Specs</h2>
    <p class="attach-hint" style="margin-top:-6px;">Shown on the proposal's Scope of Work section.</p>
    <div class="field-grid">
      <div><label class="field-label">Product Design</label>
        <input type="text" value="${esc(d.productDesign)}" onchange="App.updateDealField('${d.id}','productDesign', this.value)"></div>
      <div><label class="field-label">Color</label>
        <input type="text" value="${esc(d.colorFinish)}" onchange="App.updateDealField('${d.id}','colorFinish', this.value)"></div>
      <div><label class="field-label">Linear Feet</label>
        <input type="text" value="${esc(d.linearFeet)}" onchange="App.updateDealField('${d.id}','linearFeet', this.value)"></div>
      <div><label class="field-label">Height</label>
        <input type="text" value="${esc(d.wallHeightSpec)}" onchange="App.updateDealField('${d.id}','wallHeightSpec', this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Scope Items</h2>
    <p class="attach-hint" style="margin-top:-6px;">Only item names and descriptions show on the proposal — cost, markup, and per-item pricing stay internal. Just the total price shows, at the end.</p>
    ${lineItemsHtml}
    <div class="totals-bar">
      <div class="stat"><div class="stat-label">Total Price</div><div class="stat-value">${money(dealClientPrice(d))}</div></div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-outline" onclick="App.viewDeal('${d.id}')">Cancel</button>
    <button class="btn btn-primary" id="download-proposal-btn" onclick="App.downloadProposalDocx('${d.id}')" ${allTemplates.length === 0 ? 'disabled' : ''}>Download as Word (.docx)</button>
  </div>`;
}

// ---------- Init ----------
let appInitialized = false;
async function initApp() {
  if (appInitialized) return;
  appInitialized = true;
  document.getElementById('main').innerHTML = `<div class="empty-state">Loading deals...</div>`;
  const bridgeReady = await waitForFirebaseBridge(10000);
  if (!bridgeReady) {
    storageError = true;
    storageErrorDetail = 'Firebase failed to load in this browser.';
    render();
    return;
  }
  if (window.__firebaseMigrateLegacy) {
    try { await window.__firebaseMigrateLegacy(); } catch (e) { console.error('Migration failed:', e); }
  }
  await subscribeToDealsOnce();
  if (window.__firebaseSeedTemplates) {
    try { await window.__firebaseSeedTemplates(); } catch (e) { console.error('Template seed failed:', e); }
  }
  await subscribeToTemplatesOnce();
  await subscribeToMaterialPricingOnce();
  if (window.__firebaseSeedCostCodes) {
    try { await window.__firebaseSeedCostCodes(); } catch (e) { console.error('Cost code seed failed:', e); }
  }
  await subscribeToCostCodesOnce();
  if (window.__firebaseSeedDealTemplates) {
    try { await window.__firebaseSeedDealTemplates(); } catch (e) { console.error('Deal template seed failed:', e); }
  }
  await subscribeToDealTemplatesOnce();
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.error('Service worker registration failed:', e));
  });
}
</script>
</body>
</html>
