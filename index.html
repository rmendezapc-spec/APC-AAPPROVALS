<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Approval Board</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1C2B36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deal Board">
<style>
  :root {
    --ink: #1C2B36;
    --ink-soft: #3D4E5C;
    --muted: #6B7A85;
    --line: #DCE2E6;
    --field: #F6F7F5;
    --paper: #FFFFFF;
    --panel-alt: #EEF1F0;
    --row-border: #EFF2F3;
    --amber: #C8791E;
    --amber-soft: #F3E2CC;
    --green: #2F6B4F;
    --green-soft: #DCEAE2;
    --red: #A83A3A;
    --red-soft: #F3DEDE;
    --steel: #1C2B36;
    --radius: 6px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --shadow-xs: 0 1px 2px rgba(16,23,29,0.05);
    --shadow-sm: 0 1px 3px rgba(16,23,29,0.07), 0 1px 2px rgba(16,23,29,0.05);
    --shadow-md: 0 3px 8px rgba(16,23,29,0.10), 0 1px 3px rgba(16,23,29,0.06);
    --shadow-lg: 0 10px 28px rgba(16,23,29,0.18), 0 3px 10px rgba(16,23,29,0.08);
    --inset-shadow: inset 0 1px 2px rgba(16,23,29,0.05);
    --highlight: rgba(255,255,255,0.14);
  }

  body.dark {
    --ink: #E7ECEF;
    --ink-soft: #C3CDD3;
    --muted: #8A98A3;
    --line: #2B3640;
    --field: #10171D;
    --paper: #1A222A;
    --panel-alt: #222B33;
    --row-border: #26313A;
    --amber: #E0954A;
    --amber-soft: #3A2E1D;
    --green: #6FBF97;
    --green-soft: #16281F;
    --red: #E08080;
    --red-soft: #3A2020;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.30);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.40), 0 1px 2px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 10px rgba(0,0,0,0.48), 0 1px 4px rgba(0,0,0,0.35);
    --shadow-lg: 0 14px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.40);
    --inset-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
    --highlight: rgba(255,255,255,0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--field);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  header.topbar {
    background: var(--steel);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 3;
  }

  header.topbar .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  header.topbar .brand .title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  header.topbar .brand .subtitle {
    font-size: 12.5px;
    color: #9FB0BC;
  }

  header.topbar .nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .current-user-label {
    font-size: 12.5px;
    color: #9FB0BC;
    margin-right: 2px;
  }

  .btn {
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    transition: filter 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:active { filter: brightness(0.88); transform: translateY(1px); box-shadow: none !important; }

  .btn-primary {
    background: linear-gradient(180deg, var(--highlight), rgba(0,0,0,0)), var(--amber);
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .btn-primary:hover { box-shadow: var(--shadow-md); }
  .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
  .btn-outline { background: var(--paper); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-xs); }
  .btn-danger { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .btn-success { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .btn-small { padding: 5px 10px; font-size: 12.5px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .settings-wrap { position: relative; }

  .settings-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 8px;
    flex-direction: column;
    gap: 2px;
    z-index: 10;
  }
  .settings-menu.open { display: flex; }

  .settings-menu .current-user-label {
    padding: 6px 10px 8px;
    margin: 0 0 4px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-soft);
  }

  .settings-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .settings-menu-item:hover { background: var(--panel-alt); }

  main {
    max-width: min(2000px, 97vw);
    margin: 0 auto;
    padding: 28px 32px 80px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--amber);
  }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 16px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }

  .deal-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .deal-card:hover { border-color: var(--muted); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .deal-card .info .job { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  .deal-card .info .meta { font-size: 12.5px; color: var(--muted); }

  .deal-card .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .deal-card .price { font-family: var(--mono); font-weight: 700; font-size: 15px; text-align: right; }
  .deal-card .price .label { display:block; font-family: var(--sans); font-weight: 500; font-size: 11px; color: var(--muted); }

  .stamp {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 2px solid currentColor;
    border-radius: 3px;
    transform: rotate(-4deg);
    white-space: nowrap;
    box-shadow: 1px 1px 0 rgba(0,0,0,0.10);
  }
  .stamp.pending { color: var(--amber); }
  .stamp.approved { color: var(--green); }
  .stamp.rejected { color: var(--red); }

  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }

  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--inset-shadow);
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
    border-color: var(--amber);
  }

  .section-block {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .section-head {
    background: var(--panel-alt);
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 1px 0 var(--line);
  }
  .section-head input[type=text] {
    font-weight: 700;
    border: none;
    background: transparent;
    padding: 4px 2px;
  }
  .section-head input[type=text]:focus { outline: none; border-bottom: 2px solid var(--amber); }

  table.items {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.items th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  table.items td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--row-border);
    vertical-align: middle;
  }
  table.items td input, table.items td select { padding: 6px 8px; font-size: 13px; }
  table.items td.num { text-align: right; font-family: var(--mono); }
  table.items tr.subtotal td { font-weight: 700; background: var(--panel-alt); font-family: var(--mono); box-shadow: inset 0 1px 0 var(--line); }
  table.items tr.subtotal td.label-cell { font-family: var(--sans); }

  .table-scroll { overflow-x: auto; }
  table.items { min-width: 1060px; }
  table.items input, table.items select { min-width: 76px; }
  table.items select { min-width: 132px; }
  .col-desc { min-width: 160px; }
  .col-action { width: 34px; text-align: center; }

  .totals-bar {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-end;
    background: var(--panel-alt);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-top: 6px;
    box-shadow: var(--inset-shadow);
  }
  .totals-bar .stat .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .totals-bar .stat .stat-value {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
  }
  .totals-bar .profit-input { max-width: 90px; }

  .attachments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }
  .attachment-card { display: flex; flex-direction: column; gap: 6px; }
  .attachment-thumb {
    position: relative;
    display: block;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 1;
    background: var(--field);
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .attachment-thumb:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .attachment-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attachment-thumb.attachment-file { text-decoration: none; }
  .attachment-thumb .file-icon {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  .attachment-thumb .file-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(28,43,54,0.65);
    color: #fff;
    font-size: 9.5px;
    padding: 2px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-category-select { font-size: 12px; padding: 5px 6px; }
  .attachment-description-input {
    font-size: 12px;
    padding: 5px 6px;
    min-height: 44px;
    resize: vertical;
    font-family: var(--sans);
  }
  .attachment-delete-btn { width: 100%; }
  .attach-btn-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .attach-hint { font-size: 12px; color: var(--muted); }

  #lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,15,20,0.88);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  #lightbox-overlay img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
  }

  .job-site-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    font-size: 13.5px;
  }
  .job-site-summary .kv .k { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .job-site-summary .kv .v { font-weight: 600; }

  .approval-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .approver-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-xs);
    background: var(--paper);
  }
  .approver-card .name { font-weight: 700; margin-bottom: 8px; font-size: 14.5px; }
  .approver-card .actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .approver-card .status-line { font-size: 12.5px; color: var(--muted); }
  .approver-card textarea { margin-top: 8px; }

  .comment-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .comment-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .comment {
    background: var(--panel-alt);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow-xs);
  }
  .comment-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .comment-author { font-weight: 700; font-size: 13px; }
  .comment-time { font-size: 11px; color: var(--muted); }
  .comment-text { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }

  .comment-composer {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .comment-composer textarea { flex: 1 1 220px; min-height: 40px; }
  .comment-composer .btn { flex: 0 0 auto; }

  .user-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .user-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.4fr auto;
    gap: 10px;
    align-items: center;
  }
  .user-row-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 0 2px;
  }
  .user-role { font-size: 13px; color: var(--muted); }
  .user-role-select { width: auto; min-width: 90px; }
  .user-row-add { padding-top: 8px; border-top: 1px solid var(--line); }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-weight: 600;
  }
  .back-link:hover { color: var(--amber); }

  .add-row-btn {
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 7px 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    margin: 8px;
  }
  .add-row-btn:hover { border-color: var(--amber); color: var(--amber); }

  .banner {
    background: var(--red-soft);
    color: var(--red);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* Real device width drives layout directly — no manual override needed. */
  @media (max-width: 640px) {
    .approval-grid { grid-template-columns: 1fr; }
    .field-grid { grid-template-columns: 1fr; }
    .job-site-summary { grid-template-columns: 1fr; }
    .totals-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
    header.topbar { padding: 14px 16px; }
    main { padding: 18px 12px 60px; }
    table.items { min-width: 900px; font-size: 12.5px; }
    .user-row { grid-template-columns: 1fr 1fr; }
    .user-row-head { display: none; }
    .user-role { grid-column: 1 / -1; }
  }

  /* Touch-target sizing for phones and other coarse-pointer devices. */
  @media (max-width: 640px), (pointer: coarse) {
    .btn { min-height: 40px; }
    .icon-btn { width: 42px; height: 42px; }
    input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
      padding: 10px 10px;
      font-size: 16px; /* prevents iOS Safari auto-zoom on focus */
    }
    .tab { padding: 11px 14px; }
  }

  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--steel);
    padding: 20px;
  }
  #gate .gate-card {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 32px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }

  .brand-strip {
    background: #000;
    display: flex;
    justify-content: center;
    padding: 14px 16px;
  }
  .brand-logo {
    display: block;
    width: 100%;
    max-width: 280px;
    height: auto;
  }
  #gate .gate-card .brand-logo {
    max-width: 220px;
    margin: 0 auto 20px;
  }
  #gate .gate-card .title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  #gate .gate-card .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  #gate select, #gate input[type=password] {
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  #gate .gate-error {
    color: var(--red);
    font-size: 12.5px;
    margin-bottom: 10px;
    min-height: 16px;
  }
  #gate .btn { width: 100%; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <img src="fence-installers-logo.png" alt="Fence Installers" class="brand-logo">
    <div class="title">Deal Approval Board</div>
    <div class="subtitle">Sign in to continue</div>
    <div class="gate-error" id="gate-error"></div>
    <select id="login-user-select"></select>
    <input type="password" id="login-pin-input" placeholder="PIN" onkeydown="if(event.key==='Enter') attemptLogin()">
    <button class="btn btn-primary" onclick="attemptLogin()">Log In</button>
  </div>
</div>

<div id="app" style="display:none;">
<div class="brand-strip">
  <img src="fence-installers-logo.png" alt="Fence Installers" class="brand-logo">
</div>
<header class="topbar">
  <div class="brand">
    <div class="title">Deal Approval Board</div>
    <div class="subtitle">Residential sales &mdash; cost breakdown &amp; sign-off</div>
  </div>
  <div class="nav">
    <button class="btn btn-ghost" onclick="App.goList()">All Deals</button>
    <button class="btn btn-primary" onclick="App.goNewDeal()">+ New Deal</button>
    <div class="settings-wrap">
      <button class="btn btn-ghost icon-btn" id="settings-btn" onclick="toggleSettingsMenu(event)" title="Settings">⚙️</button>
      <div class="settings-menu" id="settings-menu">
        <div class="current-user-label" id="current-user-label"></div>
        <button class="settings-menu-item" id="manage-users-btn" onclick="closeSettingsMenu(); App.goManageUsers();" style="display:none;">Manage Users</button>
        <button class="settings-menu-item" id="manage-templates-btn" onclick="closeSettingsMenu(); App.goManageTemplates();" style="display:none;">Proposal Templates</button>
        <button class="settings-menu-item" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>

<script>
// User accounts — same lightweight, client-side trust model as everything
// else in this app (no real backend auth, just a named PIN check). Replaces
// the old shared team passphrase and separate per-approver PIN modal: one
// login now gates the app, drives who can approve/reject, and attributes
// chat messages automatically.
let allUsers = [];
let currentUser = null;

function populateUserSelect() {
  const select = document.getElementById('login-user-select');
  if (!select) return;
  const prevValue = select.value;
  select.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
  if (prevValue && allUsers.some(u => u.id === prevValue)) select.value = prevValue;
}

function updateUserChrome() {
  const label = document.getElementById('current-user-label');
  if (label) label.textContent = currentUser ? ('Logged in as ' + currentUser.name) : '';
  const manageBtn = document.getElementById('manage-users-btn');
  if (manageBtn) manageBtn.style.display = isAdminUser(currentUser) ? '' : 'none';
  const templatesBtn = document.getElementById('manage-templates-btn');
  if (templatesBtn) templatesBtn.style.display = currentUser ? '' : 'none';
}

let gateLoadError = '';

function subscribeToUsersOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeUsers) {
      gateLoadError = 'Firebase failed to load in this browser.';
      resolve();
      return;
    }
    let settled = false;
    window.__firebaseSubscribeUsers((users) => {
      allUsers = users;
      gateLoadError = '';
      populateUserSelect();
      if (currentUser) {
        const updated = allUsers.find(u => u.id === currentUser.id);
        if (updated) { currentUser = updated; updateUserChrome(); }
      }
      if (currentView !== 'form') render();
      if (!settled) { settled = true; resolve(); }
    }, (err) => {
      gateLoadError = (err && err.message) || String(err);
      if (!settled) { settled = true; resolve(); }
    });
  });
}

function attemptLogin() {
  const select = document.getElementById('login-user-select');
  const pinInput = document.getElementById('login-pin-input');
  const user = allUsers.find(u => u.id === select.value);
  const val = (pinInput.value || '').trim();
  if (!user || val.toUpperCase() !== (user.pin || '').toUpperCase()) {
    document.getElementById('gate-error').textContent = 'Incorrect PIN — try again.';
    pinInput.value = '';
    pinInput.focus();
    return;
  }
  currentUser = user;
  try { localStorage.setItem('apc_current_user_id', user.id); } catch (e) {}
  enterApp();
}

function enterApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateUserChrome();
  initApp();
  render();
}

function logout() {
  currentUser = null;
  try { localStorage.removeItem('apc_current_user_id'); } catch (e) {}
  updateUserChrome();
  currentView = 'list';
  currentDealId = null;
  openRejectBoxFor = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  const pinInput = document.getElementById('login-pin-input');
  if (pinInput) pinInput.value = '';
  document.getElementById('gate-error').textContent = '';
}

function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function toggleSettingsMenu(event) {
  if (event) event.stopPropagation();
  document.getElementById('settings-menu').classList.toggle('open');
}

function closeSettingsMenu() {
  const menu = document.getElementById('settings-menu');
  if (menu) menu.classList.remove('open');
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.settings-wrap');
  if (wrap && !wrap.contains(e.target)) closeSettingsMenu();
});

function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem('apc_theme', next); } catch (e) {}
  applyTheme(next);
}

function initTheme() {
  let theme = 'light';
  try {
    const stored = localStorage.getItem('apc_theme');
    if (stored) theme = stored;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
  } catch (e) {}
  applyTheme(theme);
}

initTheme();

// Don't assume the type="module" script (which has a top-level await for
// anonymous sign-in) has finished defining window.__firebase* by the time
// DOMContentLoaded fires — that ordering isn't reliable in every browser.
// Poll for it instead of racing it.
function waitForFirebaseBridge(timeoutMs) {
  return new Promise((resolve) => {
    const start = Date.now();
    (function check() {
      if (window.__firebaseSubscribeUsers) { resolve(true); return; }
      if (Date.now() - start > timeoutMs) { resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}

document.addEventListener('DOMContentLoaded', async function initGate() {
  document.getElementById('gate-error').textContent = 'Loading users…';
  const bridgeReady = await waitForFirebaseBridge(10000);
  if (!bridgeReady) {
    gateLoadError = 'Firebase failed to load in this browser.';
  } else {
    if (window.__firebaseSeedUsers) {
      try { await window.__firebaseSeedUsers(); } catch (e) {}
    }
    await subscribeToUsersOnce();
  }
  if (gateLoadError) {
    document.getElementById('gate-error').textContent = "Couldn't load the user list — " + gateLoadError + ' Try refreshing the page.';
  } else if (allUsers.length === 0) {
    document.getElementById('gate-error').textContent = 'No users found yet — try refreshing the page.';
  } else {
    document.getElementById('gate-error').textContent = '';
  }

  let savedUserId = null;
  try { savedUserId = localStorage.getItem('apc_current_user_id'); } catch (e) {}
  const saved = allUsers.find(u => u.id === savedUserId);
  if (saved) {
    currentUser = saved;
    enterApp();
  } else {
    document.getElementById('login-pin-input').focus();
  }
});
</script>

<script>
const COST_TYPES = ['Labor','Material','Subcontractor','Equipment','Other','None'];
const PROPERTY_TYPES = ['Single-Family','Multi-Family','New Construction','Remodel / Addition','Commercial'];
const ACCESS_OPTIONS = ['Easy — full access','Moderate — some restrictions','Difficult — tight / crane needed'];
const DEFAULT_SECTIONS = ['General Requirements','Labor & Installation','Materials & Products','Mobilization'];

let deals = [];
let allTemplates = [];
let selectedTemplateId = null;
let currentView = 'list';
let currentFilter = 'all';
let draftDeal = null;
let currentDealId = null;
let storageError = false;
let storageErrorDetail = '';

function uid(prefix) { return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

// Approvers manage users because they're the two fixed approval seats;
// admins (like Richard, building the tool) get the same user-management
// access without an approval seat of their own.
function isAdminUser(user) {
  return !!user && (user.role === 'approver' || user.role === 'admin');
}

function money(n) {
  n = Number(n) || 0;
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function fullAddressLine(d) {
  const cityStateZip = [d.city, [d.state, d.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  return [d.address, cityStateZip].filter(Boolean).join(', ');
}

let firebaseSubscribed = false;
let openRejectBoxFor = null; // which approver's reject-reason box is open on the current detail view

// Save a single deal document, used after every mutation (submit,
// approve/reject, etc.) — only the changed deal is written, not the whole list.
async function saveDeal(deal) {
  try {
    const result = window.__firebaseSaveDeal
      ? await window.__firebaseSaveDeal(deal)
      : { ok: false, error: 'Firebase failed to load in this browser.' };
    storageError = !result.ok;
    storageErrorDetail = result.ok ? '' : (result.error || '');
  } catch (e) {
    storageError = true;
    storageErrorDetail = (e && e.message) || String(e);
  }
  render();
}

// Subscribes once to the shared Firestore `deals` collection. Resolves after
// the first snapshot arrives (or the first error) so initApp never hangs on
// "Loading deals..." forever, then keeps updating `deals` live as anyone
// (any device) makes changes.
function subscribeToDealsOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeDeals) {
      // Firebase script failed to load (offline, blocked, bad config, etc.)
      storageError = true;
      storageErrorDetail = 'Firebase failed to load in this browser.';
      resolve();
      return;
    }
    let settled = false;
    window.__firebaseSubscribeDeals((remoteDeals) => {
      deals = remoteDeals;
      storageError = false;
      storageErrorDetail = '';
      if (currentView === 'list' || currentView === 'detail') render();
      if (!settled) {
        settled = true;
        firebaseSubscribed = true;
        resolve();
      }
    }, (err) => {
      storageError = true;
      storageErrorDetail = (err && err.message) || String(err);
      render();
      if (!settled) {
        settled = true;
        resolve();
      }
    });
  });
}

function subscribeToTemplatesOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeTemplates) { resolve(); return; }
    let settled = false;
    window.__firebaseSubscribeTemplates((templates) => {
      allTemplates = templates;
      if (currentView === 'proposal' || currentView === 'templates') render();
      if (!settled) { settled = true; resolve(); }
    }, () => { if (!settled) { settled = true; resolve(); } });
  });
}

function blankDeal() {
  return {
    id: uid('deal'),
    customerName: '',
    company: '',
    email: '',
    address: '',
    city: '',
    state: '',
    zip: '',
    repName: '',
    date: todayStr(),
    jobSite: { propertyType: '', accessDifficulty: '', notes: '' },
    sections: DEFAULT_SECTIONS.map(name => ({ id: uid('sec'), name, items: [] })),
    attachments: [],
    approvals: { connor: null, sandy: null },
    rejectReasons: { connor: '', sandy: '' },
    comments: [],
    createdAt: Date.now()
  };
}

function blankItem() {
  return { id: uid('item'), desc: '', qty: 1, unit: 'each', unitCost: 0, costType: 'Material', markupPercent: 25 };
}

// Turns the raw rows from an uploaded cost-estimate export (BuilderTrend-style
// "Category / Title / Description / Quantity / Unit / Unit Cost / Cost Type /
// Markup" columns) into deal sections/items. Looks columns up by header name
// (case-insensitive) rather than fixed position, since exports can reorder
// columns across versions.
function parseEstimateRows(rows) {
  if (!rows || rows.length < 2) return [];
  const norm = h => String(h || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const headerRow = rows[0].map(norm);
  const idx = name => headerRow.indexOf(norm(name));
  const cCategory = idx('Category');
  const cTitle = idx('Title');
  const cDescription = idx('Description');
  const cQty = idx('Quantity');
  const cUnit = idx('Unit');
  const cUnitCost = idx('Unit Cost');
  const cCostType = idx('Cost Type');
  const cMarkup = idx('Markup');

  const sectionsByName = new Map();
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(v => v === '' || v == null)) continue;

    const title = cTitle >= 0 ? String(row[cTitle] || '').trim() : '';
    const description = cDescription >= 0 ? String(row[cDescription] || '').trim() : '';
    const desc = title && description ? `${title} - ${description}` : (description || title);
    if (!desc) continue;

    const sectionName = (cCategory >= 0 ? String(row[cCategory] || '').trim() : '') || 'Imported Costs';
    const qty = cQty >= 0 ? (Number(row[cQty]) || 1) : 1;
    const unit = (cUnit >= 0 ? String(row[cUnit] || '').trim() : '') || 'each';
    const unitCost = cUnitCost >= 0 ? (Number(row[cUnitCost]) || 0) : 0;
    const rawCostType = cCostType >= 0 ? String(row[cCostType] || '').trim() : '';
    const costType = COST_TYPES.find(t => t.toLowerCase() === rawCostType.toLowerCase()) || 'None';
    const markupPercent = cMarkup >= 0 ? (Number(row[cMarkup]) || 0) : 0;

    if (!sectionsByName.has(sectionName)) {
      sectionsByName.set(sectionName, { id: uid('sec'), name: sectionName, items: [] });
    }
    sectionsByName.get(sectionName).items.push({
      id: uid('item'), desc, qty, unit, unitCost, costType, markupPercent
    });
  }
  return Array.from(sectionsByName.values());
}

// Per-line-item cost math, mirroring the Builder Cost -> Markup -> Client Price -> Margin/Profit
// flow from the BuilderTrend reference.
function itemCalc(item) {
  const qty = Number(item.qty) || 0;
  const unitCost = Number(item.unitCost) || 0;
  const markup = Number(item.markupPercent) || 0;
  const builderCost = qty * unitCost;
  const unitPrice = unitCost * (1 + markup / 100);
  const clientPrice = qty * unitPrice;
  const profit = clientPrice - builderCost;
  const margin = clientPrice > 0 ? (profit / clientPrice) * 100 : 0;
  return { builderCost, unitPrice, clientPrice, profit, margin };
}

function sectionTotals(section) {
  return section.items.reduce((acc, item) => {
    const c = itemCalc(item);
    acc.builderCost += c.builderCost;
    acc.clientPrice += c.clientPrice;
    acc.profit += c.profit;
    return acc;
  }, { builderCost: 0, clientPrice: 0, profit: 0 });
}

function sectionMargin(totals) {
  return totals.clientPrice > 0 ? (totals.profit / totals.clientPrice) * 100 : 0;
}

function dealTotals(deal) {
  return deal.sections.reduce((acc, s) => {
    const t = sectionTotals(s);
    acc.builderCost += t.builderCost;
    acc.clientPrice += t.clientPrice;
    acc.profit += t.profit;
    return acc;
  }, { builderCost: 0, clientPrice: 0, profit: 0 });
}

function dealClientPrice(deal) {
  return dealTotals(deal).clientPrice;
}

function dealBuilderCost(deal) {
  return dealTotals(deal).builderCost;
}

function dealProfit(deal) {
  return dealTotals(deal).profit;
}

function dealMargin(deal) {
  const t = dealTotals(deal);
  return t.clientPrice > 0 ? (t.profit / t.clientPrice) * 100 : 0;
}

function dealStatus(deal) {
  if (deal.approvals.connor === false || deal.approvals.sandy === false) return 'rejected';
  if (deal.approvals.connor === true && deal.approvals.sandy === true) return 'approved';
  return 'pending';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Resize + compress a photo client-side before storing it, so a multi-MB phone
// photo shrinks down to something small enough to save alongside deal data.
function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 1280;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-overlay').style.display = 'flex';
}

function closeLightbox() {
  document.getElementById('lightbox-overlay').style.display = 'none';
  document.getElementById('lightbox-img').src = '';
}

const ATTACHMENT_CATEGORIES = ['Photo', 'Contract', 'Site Plan', 'Other'];

function guessAttachmentCategory(file) {
  const type = (file.type || '').toLowerCase();
  const name = (file.name || '').toLowerCase();
  if (type.startsWith('image/')) return 'Photo';
  if (type === 'application/pdf' || name.endsWith('.pdf')) return 'Contract';
  return 'Other';
}

// Images get resized/compressed like before; anything else (PDFs, etc.) is
// just read as-is — there's no canvas-based way to "compress" a PDF client-side.
function processAttachmentFile(file) {
  if ((file.type || '').startsWith('image/')) {
    return compressImageFile(file);
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

// Shared card markup for both the draft form and the always-open detail
// view — only the category/delete handlers differ between the two contexts.
function renderAttachmentCard(a, opts) {
  const isImage = !a.mimeType || a.mimeType.startsWith('image/');
  const preview = isImage
    ? `<div class="attachment-thumb" onclick="openLightbox('${a.dataUrl}')">
        <img src="${a.dataUrl}" alt="${esc(a.name)}">
        <div class="file-name">${esc(a.name)}</div>
      </div>`
    : `<a class="attachment-thumb attachment-file" href="${a.dataUrl}" target="_blank" rel="noopener" download="${esc(a.name)}">
        <div class="file-icon">📄</div>
        <div class="file-name">${esc(a.name)}</div>
      </a>`;
  return `<div class="attachment-card">
    ${preview}
    <select class="attachment-category-select" onchange="${opts.categoryOnChange}">
      ${ATTACHMENT_CATEGORIES.map(c => `<option value="${c}" ${c === (a.category || 'Photo') ? 'selected' : ''}>${c}</option>`).join('')}
    </select>
    <textarea class="attachment-description-input" placeholder="Add a description..."
        onchange="${opts.descriptionOnChange}">${esc(a.description || '')}</textarea>
    <button class="btn btn-outline btn-small attachment-delete-btn" onclick="${opts.deleteOnClick}">Delete</button>
  </div>`;
}

// Builds a real, fully-editable .docx from a deal + template using the docx
// library (loaded on demand, only when a proposal is actually downloaded —
// no reason to ship this to everyone who's just approving deals).
async function buildProposalDocx(docxLib, d, template) {
  const { Document, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, Packer } = docxLib;

  function cell(text, opts) {
    opts = opts || {};
    const params = {
      children: [new Paragraph({ children: [new TextRun({ text: text, bold: !!opts.bold })], alignment: opts.align || AlignmentType.LEFT })]
    };
    if (opts.width) params.width = { size: opts.width, type: WidthType.PERCENTAGE };
    if (opts.columnSpan) params.columnSpan = opts.columnSpan;
    return new TableCell(params);
  }

  const lineItemRows = [];
  lineItemRows.push(new TableRow({
    children: [
      cell('Description', { bold: true, width: 55 }),
      cell('Qty', { bold: true, width: 10, align: AlignmentType.CENTER }),
      cell('Unit', { bold: true, width: 15, align: AlignmentType.CENTER }),
      cell('Price', { bold: true, width: 20, align: AlignmentType.RIGHT })
    ]
  }));

  d.sections.forEach((sec) => {
    if (!sec.items.length) return;
    lineItemRows.push(new TableRow({
      children: [cell(sec.name, { bold: true, columnSpan: 4 })]
    }));
    sec.items.forEach((item) => {
      const c = itemCalc(item);
      lineItemRows.push(new TableRow({
        children: [
          cell(item.desc || '—'),
          cell(String(item.qty), { align: AlignmentType.CENTER }),
          cell(item.unit || '', { align: AlignmentType.CENTER }),
          cell(money(c.clientPrice), { align: AlignmentType.RIGHT })
        ]
      }));
    });
  });

  const itemsTable = new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: lineItemRows });

  function heading(text) {
    return new Paragraph({ text, heading: HeadingLevel.HEADING_2, spacing: { before: 300, after: 150 } });
  }
  function para(text) {
    return new Paragraph({ children: [new TextRun(text)], spacing: { after: 120 } });
  }
  function splitLines(text) {
    return (text || '').split('\n').map((s) => s.trim()).filter(Boolean);
  }
  function numbered(text) {
    return splitLines(text).map((line, i) => para((i + 1) + '. ' + line));
  }
  function bulleted(text) {
    return splitLines(text).map((line) => para('• ' + line));
  }

  const children = [];
  children.push(new Paragraph({ text: 'Fence Installers', heading: HeadingLevel.TITLE, alignment: AlignmentType.CENTER }));
  children.push(new Paragraph({ text: 'Proposal', heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER, spacing: { after: 300 } }));

  children.push(para('Date: ' + (d.date || '')));
  children.push(new Paragraph({ children: [new TextRun({ text: 'Prepared For', bold: true })], spacing: { before: 200, after: 100 } }));
  if (d.customerName) children.push(para(d.customerName));
  if (d.company) children.push(para(d.company));
  if (d.email) children.push(para(d.email));
  const addressLine = fullAddressLine(d);
  if (addressLine) children.push(para(addressLine));

  if (template.scopeIntro) {
    children.push(heading('Scope of Work'));
    children.push(para(template.scopeIntro));
  }
  if (template.scopeSteps) children.push(...numbered(template.scopeSteps));

  children.push(heading('Line Items & Pricing'));
  children.push(itemsTable);
  children.push(new Paragraph({ children: [new TextRun({ text: 'Total Price: ' + money(dealClientPrice(d)), bold: true })], spacing: { before: 200, after: 120 } }));

  if (template.conditions) {
    children.push(heading('Project Conditions & Requirements'));
    children.push(...numbered(template.conditions));
  }
  if (template.exclusions) {
    children.push(heading('Conditions & Exclusions'));
    children.push(...bulleted(template.exclusions));
  }
  if (template.legalProtections) {
    children.push(heading('Legal Protections'));
    children.push(...numbered(template.legalProtections));
  }
  if (template.nextSteps) {
    children.push(heading('Next Steps'));
    children.push(...numbered(template.nextSteps));
  }

  children.push(heading('Acceptance'));
  children.push(para('By signing below, I approve this proposal and authorize work to proceed.'));
  children.push(para('Signature: _______________________________          Date: ______________'));
  children.push(para('Printed Name: ___________________________'));

  const doc = new Document({ sections: [{ children }] });
  return Packer.toBlob(doc);
}

    if (i) i[field] = value;
    this.refreshTotals(secId, itemId);
  },

  // Editing Margin % directly back-solves the Markup % needed to hit that margin,
  // so either field can be used to drive pricing and they stay in sync.
  updateItemMargin(secId, itemId, value) {
    const s = draftDeal.sections.find(s => s.id === secId);
    const item = s && s.items.find(i => i.id === itemId);
    if (!item) return;

    const qty = Number(item.qty) || 0;
    const unitCost = Number(item.unitCost) || 0;
    const builderCost = qty * unitCost;

    let margin = Number(value);
    if (isNaN(margin)) margin = 0;
    margin = Math.min(margin, 99.9); // 100%+ margin implies infinite price, not solvable

    let markup = Number(item.markupPercent) || 0;
    if (builderCost > 0 && unitCost > 0 && qty > 0) {
      const clientPrice = builderCost / (1 - margin / 100);
      const unitPrice = clientPrice / qty;
      markup = (unitPrice / unitCost - 1) * 100;
    }
    item.markupPercent = markup;

    const markupInput = document.getElementById('markupinput-' + itemId);
    if (markupInput && document.activeElement !== markupInput) {
      markupInput.value = Math.round(markup * 100) / 100;
    }
    this.refreshTotals(secId, itemId);
  },

  refreshTotals(secId, itemId) {
    // Refresh the single edited row's computed cells (preserves input focus).
    if (secId && itemId) {
      const s = draftDeal.sections.find(s => s.id === secId);
      const item = s && s.items.find(i => i.id === itemId);
      if (item) {

        const cpEl = document.getElementById('itemcp-' + itemId);
        const mgEl = document.getElementById('itemmg-' + itemId);
        const pfEl = document.getElementById('itempf-' + itemId);
        if (upEl) upEl.textContent = money(c.unitPrice);
        if (bcEl) bcEl.textContent = money(c.builderCost);
        if (cpEl) cpEl.textContent = money(c.clientPrice);
        if (mgEl && document.activeElement !== mgEl) mgEl.value = Math.round(c.margin * 100) / 100;
        if (pfEl) pfEl.textContent = money(c.profit);
      }
    }
    // Refresh section subtotals.
    draftDeal.sections.forEach(s => {
      const t = sectionTotals(s);
      const bcEl = document.getElementById('sec-bc-' + s.id);
      const cpEl = document.getElementById('sec-cp-' + s.id);

      const pfEl = document.getElementById('sec-pf-' + s.id);
      if (bcEl) bcEl.textContent = money(t.builderCost);
      if (cpEl) cpEl.textContent = money(t.clientPrice);
      if (mgEl) mgEl.textContent = sectionMargin(t).toFixed(1) + '%';
      if (pfEl) pfEl.textContent = money(t.profit);
    });
    // Refresh deal grand totals.
    const dt = dealTotals(draftDeal);
    const bcEl = document.getElementById('grand-buildercost');
    const cpEl = document.getElementById('grand-clientprice');
    const mgEl = document.getElementById('grand-margin');
    const pfEl = document.getElementById('grand-profit');
    if (bcEl) bcEl.textContent = money(dt.builderCost);
    if (cpEl) cpEl.textContent = money(dt.clientPrice);
    if (mgEl) mgEl.textContent = dealMargin(draftDeal).toFixed(1) + '%';

    const d = deals.find(x => x.id === dealId);
    if (!d) return;
    const input = document.getElementById('comment-input');
    const text = (input.value || '').trim();
    if (!text) return;
    d.comments = d.comments || [];
    d.comments.push({ id: uid('cmt'), author: currentUser.name, text, createdAt: Date.now() });
    input.value = '';
    await saveDeal(d);
  },

  // Manage Users is only reachable via goManageUsers, which already checks
  // this, but these are re-checked here too since they mutate shared data.
  updateUserField(userId, field, value) {
    if (!isAdminUser(currentUser)) return;
    const u = allUsers.find(x => x.id === userId);
    if (u) u[field] = value;
  },

  async saveUserField(userId) {
    if (!isAdminUser(currentUser)) return;
    const u = allUsers.find(x => x.id === userId);
    if (!u || !window.__firebaseSaveUser) return;
    await window.__firebaseSaveUser(u);
    render();
  },

  // Existing PINs are never shown to admins editing other users — this only
  // ever writes a NEW value, and does nothing if left blank.
  async resetUserPin(userId, newPin) {
    if (!isAdminUser(currentUser)) return;
    const val = (newPin || '').trim();
    if (!val) return;
    const u = allUsers.find(x => x.id === userId);
    if (!u) return;
    u.pin = val;
    if (window.__firebaseSaveUser) await window.__firebaseSaveUser(u);
    render();
  },

  async addUser() {
    if (!isAdminUser(currentUser)) return;
    const nameInput = document.getElementById('new-user-name');
    const pinInput = document.getElementById('new-user-pin');
    const roleSelect = document.getElementById('new-user-role');
    const name = (nameInput.value || '').trim();
    const pin = (pinInput.value || '').trim();
    const role = roleSelect.value === 'admin' ? 'admin' : 'rep';
    if (!name || !pin) {
      alert('Enter a name and a PIN for the new user.');
      return;
    }
    if (allUsers.some(u => u.name.toLowerCase() === name.toLowerCase())) {
      alert('A user named "' + name + '" already exists.');
      return;
    }
    const user = { id: uid('usr'), name, pin, role, approverSlot: null, createdAt: Date.now() };
    if (window.__firebaseSaveUser) await window.__firebaseSaveUser(user);
    nameInput.value = '';
    pinInput.value = '';
    roleSelect.value = 'rep';
    render();
  },

  async removeUser(userId) {
    if (!isAdminUser(currentUser)) return;
    const u = allUsers.find(x => x.id === userId);
    if (!u) return;
    if (u.id === currentUser.id) {
      alert("You can't remove your own account while logged in as them.");
      return;
    }
    const warning = u.approverSlot
      ? (u.name + ' is the ' + (u.approverSlot === 'connor' ? 'Connor' : 'Sandy') + ' approver account — removing it means no one can approve or reject in that slot. Continue?')
      : ('Remove ' + u.name + '? They will no longer be able to log in.');
    if (!confirm(warning)) return;
    if (window.__firebaseDeleteUser) await window.__firebaseDeleteUser(userId);
    render();
  },

  // Templates (unlike Manage Users) are open to any logged-in user to create
  // and edit — anyone building proposals may need to add or adjust boilerplate.
  updateTemplateField(templateId, field, value) {
    if (!currentUser) return;
    const t = allTemplates.find(x => x.id === templateId);
    if (t) t[field] = value;
  },

  async saveTemplateField(templateId) {
    if (!currentUser) return;
    const t = allTemplates.find(x => x.id === templateId);
    if (!t || !window.__firebaseSaveTemplate) return;
    await window.__firebaseSaveTemplate(t);
    render();
  },

  async addTemplate() {
    if (!currentUser) return;
    const nameInput = document.getElementById('new-template-name');
    const name = (nameInput.value || '').trim();
    if (!name) {
      alert('Enter a name for the new template.');
      return;
    }
    const template = {
      id: uid('tpl'), name,
      scopeIntro: '', scopeSteps: '', conditions: '', exclusions: '', legalProtections: '', nextSteps: '',
      createdAt: Date.now()
    };
    if (window.__firebaseSaveTemplate) await window.__firebaseSaveTemplate(template);
    nameInput.value = '';
    render();
  },

  async removeTemplate(templateId) {
    if (!currentUser) return;
    const t = allTemplates.find(x => x.id === templateId);
    if (!t) return;
    if (!confirm('Remove template "' + t.name + '"? This cannot be undone.')) return;
    if (window.__firebaseDeleteTemplate) await window.__firebaseDeleteTemplate(templateId);
    render();
  }
};

// ---------- Render functions ----------
function render() {
  const main = document.getElementById('main');
  if (currentView === 'list') main.innerHTML = renderList();
  else if (currentView === 'form') main.innerHTML = renderForm();
  else if (currentView === 'detail') main.innerHTML = renderDetail();
  else if (currentView === 'users') main.innerHTML = renderUsers();
  else if (currentView === 'change-password') main.innerHTML = renderChangePassword();
  else if (currentView === 'templates') main.innerHTML = renderTemplates();
  else if (currentView === 'proposal') main.innerHTML = renderProposal();
}

function renderList() {
  let filtered = deals;
  if (currentFilter !== 'all') filtered = deals.filter(d => dealStatus(d) === currentFilter);

  const counts = {
    all: deals.length,
    pending: deals.filter(d => dealStatus(d) === 'pending').length,
    approved: deals.filter(d => dealStatus(d) === 'approved').length,
    rejected: deals.filter(d => dealStatus(d) === 'rejected').length
  };

  const tabs = ['all','pending','approved','rejected'].map(f =>
    `<div class="tab ${currentFilter===f?'active':''}" onclick="App.setFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)} (${counts[f]})</div>`
  ).join('');

  let body;
  if (filtered.length === 0) {
    body = `<div class="empty-state">
      <div class="big">No deals here yet</div>
      <div>New submissions will show up in this list.</div>
    </div>`;
  } else {
    body = filtered.map(d => {
      const status = dealStatus(d);
      return `<div class="deal-card" onclick="App.viewDeal('${d.id}')">
        <div class="info">
          <div class="job">${esc(d.customerName || 'Untitled deal')}</div>
          <div class="meta">${esc(fullAddressLine(d) || 'No address')} &middot; Rep: ${esc(d.repName || '—')} &middot; ${esc(d.date || '')}</div>
        </div>
        <div class="right">
          <div class="price">${money(dealClientPrice(d))}<span class="label">Client Price</span></div>
          <div class="stamp ${status}">${status}</div>
        </div>
      </div>`;
    }).join('');
  }

  const errBanner = storageError ? `<div class="banner">Something went wrong saving your last change. Try again — if it keeps happening, this device may be offline.${storageErrorDetail ? `<div style="margin-top:5px; font-size:11.5px; opacity:0.8;">Details: ${esc(storageErrorDetail)}</div>` : ''}</div>` : '';

  return `${errBanner}<div class="tabs">${tabs}</div>${body}`;
}

      <div class="stat"><div class="stat-label">Client Price</div><div class="stat-value">${money(dealClientPrice(d))}</div></div>

function renderUsers() {
  if (!isAdminUser(currentUser)) {
    return `<div class="empty-state">You don't have access to this page.<div class="back-link" onclick="App.goList()">&larr; Back</div></div>`;
  }

  const rows = allUsers.map(u => {
    const roleCell = u.approverSlot
      ? `<div class="user-role">Approver — ${u.approverSlot === 'connor' ? "Connor's seat" : "Sandy's seat"}</div>`
      : `<select class="user-role-select" onchange="App.updateUserField('${u.id}','role', this.value); App.saveUserField('${u.id}')">
          <option value="rep" ${u.role === 'rep' ? 'selected' : ''}>Rep</option>
          <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
        </select>`;
    return `<div class="user-row">
      <input type="text" value="${esc(u.name)}" class="user-name-input"
        onchange="App.updateUserField('${u.id}','name', this.value); App.saveUserField('${u.id}')">
      <input type="password" value="" class="user-pin-input" placeholder="New PIN (leave blank to keep)"
        onchange="App.resetUserPin('${u.id}', this.value); this.value='';">
      ${roleCell}
      <button class="btn btn-danger btn-small" onclick="App.removeUser('${u.id}')">Remove</button>
    </div>`;
  }).join('');

  return `
  <div class="back-link" onclick="App.goList()">&larr; Back to all deals</div>
  <div class="panel">
    <h2>Manage Users</h2>
    <div class="user-list">
      <div class="user-row user-row-head">
        <div>Name</div><div>PIN</div><div>Role</div><div></div>
      </div>
      ${rows}
    </div>
    <div class="user-row user-row-add">
      <input type="text" id="new-user-name" placeholder="New user's name">
      <input type="text" id="new-user-pin" placeholder="PIN">
      <select id="new-user-role">
        <option value="rep" selected>Rep</option>
        <option value="admin">Admin</option>
      </select>
      <button class="btn btn-primary btn-small" onclick="App.addUser()">Add User</button>
    </div>
    <p class="attach-hint" style="margin-top:10px;">Reps can submit deals, edit their own rejected deals, and post in Discussion, but can't approve or reject. Admins get this Manage Users page too, same as Reps otherwise. Only Connor and Sandy's own seats can approve; rename either account above to hand that seat to someone else.</p>
  </div>`;
}

function renderChangePassword() {
  if (!currentUser) return `<div class="empty-state">Not logged in.</div>`;
  return `
  <div class="back-link" onclick="App.goList()">&larr; Back to all deals</div>
  <div class="panel" style="max-width:360px;">
    <h2>Change Password</h2>
    <p style="color:var(--muted); font-size:13px; margin-top:-8px;">Changing the password for <strong>${esc(currentUser.name)}</strong>.</p>
    <div class="gate-error" id="change-password-error"></div>
    <div class="field-grid" style="grid-template-columns:1fr;">
      <div><label class="field-label">New Password</label>
        <input type="password" id="new-password-input"></div>
      <div><label class="field-label">Confirm New Password</label>
        <input type="password" id="confirm-password-input" onkeydown="if(event.key==='Enter') App.submitPasswordChange()"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="App.goList()">Cancel</button>
      <button class="btn btn-primary" onclick="App.submitPasswordChange()">Save New Password</button>
    </div>
  </div>`;
}

function templateEditorField(templateId, field, label, value, rows) {
  return `<label class="field-label" style="margin-top:10px; display:block;">${label}</label>
    <textarea rows="${rows}" onchange="App.updateTemplateField('${templateId}','${field}', this.value); App.saveTemplateField('${templateId}')">${esc(value)}</textarea>`;
}

function renderTemplates() {
  if (!currentUser) {
    return `<div class="empty-state">You don't have access to this page.<div class="back-link" onclick="App.goList()">&larr; Back</div></div>`;
  }

  const templatesHtml = allTemplates.map(t => `
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
        <input type="text" value="${esc(t.name)}" style="font-weight:700; font-size:15px; max-width:320px;"
          onchange="App.updateTemplateField('${t.id}','name', this.value); App.saveTemplateField('${t.id}')">
        <button class="btn btn-danger btn-small" onclick="App.removeTemplate('${t.id}')">Delete Template</button>
      </div>
      ${templateEditorField(t.id, 'scopeIntro', 'Scope of Work — Intro Paragraph', t.scopeIntro, 3)}
      ${templateEditorField(t.id, 'scopeSteps', 'Scope of Work — Steps (one per line)', t.scopeSteps, 4)}
      ${templateEditorField(t.id, 'conditions', 'Project Conditions &amp; Requirements (one per line)', t.conditions, 4)}
      ${templateEditorField(t.id, 'exclusions', 'Conditions &amp; Exclusions (one per line)', t.exclusions, 4)}
      ${templateEditorField(t.id, 'legalProtections', 'Legal Protections (one per line)', t.legalProtections, 3)}
      ${templateEditorField(t.id, 'nextSteps', 'Next Steps (one per line)', t.nextSteps, 4)}
    </div>`).join('');

  return `
  <div class="back-link" onclick="App.goList()">&larr; Back to all deals</div>
  <div class="panel">
    <h2>Proposal Templates</h2>
    <p class="attach-hint">Reusable boilerplate — combined with a deal's own customer info and line items when generating a client-facing Word proposal. Each field auto-saves when you click away.</p>
  </div>
  ${templatesHtml}
  <div class="panel">
    <h2>Add Template</h2>
    <div class="field-grid" style="grid-template-columns:1fr;">
      <div><label class="field-label">Template Name</label>
        <input type="text" id="new-template-name" placeholder="e.g. Standard Fence Proposal"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="App.addTemplate()">Add Template</button>
    </div>
  </div>`;
}

function renderProposal() {
  const d = deals.find(x => x.id === currentDealId);
  if (!d) return `<div class="empty-state">Deal not found.<div class="back-link" onclick="App.goList()">&larr; Back</div></div>`;

  const lineItemsHtml = d.sections.map(sec => {
    const rows = sec.items.map(item => {
      const c = itemCalc(item);
      return `<tr>
        <td class="col-desc">${esc(item.desc || '—')}</td>
        <td class="num">${item.qty}</td>
        <td>${esc(item.unit)}</td>
        <td class="num">${money(c.clientPrice)}</td>
      </tr>`;
    }).join('');
    const t = sectionTotals(sec);
    return `<div class="section-block">
      <div class="section-head"><strong>${esc(sec.name)}</strong></div>
      <div class="table-scroll">
      <table class="items">
        <thead><tr><th class="col-desc">Description</th><th>Qty</th><th>Unit</th><th>Price</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="subtotal"><td class="label-cell" colspan="3">Section Subtotal</td><td>${money(t.clientPrice)}</td></tr></tfoot>
      </table>
      </div>
    </div>`;
  }).join('');

  const templateOptions = allTemplates.map(t => `<option value="${t.id}" ${t.id === selectedTemplateId ? 'selected' : ''}>${esc(t.name)}</option>`).join('');

  return `
  <div class="back-link" onclick="App.viewDeal('${d.id}')">&larr; Back to deal</div>

  <div class="panel">
    <h2>Generate Proposal</h2>
    ${allTemplates.length === 0
      ? `<div class="banner">No proposal templates yet — <a href="#" onclick="App.goManageTemplates(); return false;">create one first</a>.</div>`
      : `<div class="field-grid" style="grid-template-columns:1fr;">
          <div><label class="field-label">Template</label>
            <select id="proposal-template-select" onchange="App.setProposalTemplate(this.value)">${templateOptions}</select></div>
        </div>`}
  </div>

  <div class="panel">
    <h2>Customer Information</h2>
    <p class="attach-hint" style="margin-top:-6px;">Fill in anything missing here — it saves to the deal and is used on the proposal.</p>
    <div class="field-grid">
      <div><label class="field-label">Customer Name</label>
        <input type="text" value="${esc(d.customerName)}" onchange="App.updateDealField('${d.id}','customerName', this.value)"></div>
      <div><label class="field-label">Company</label>
        <input type="text" value="${esc(d.company)}" onchange="App.updateDealField('${d.id}','company', this.value)"></div>
      <div><label class="field-label">Email Address</label>
        <input type="text" value="${esc(d.email)}" onchange="App.updateDealField('${d.id}','email', this.value)"></div>
    </div>
    <div class="field-grid" style="margin-top:14px;">
      <div><label class="field-label">Address</label>
        <input type="text" value="${esc(d.address)}" onchange="App.updateDealField('${d.id}','address', this.value)"></div>
      <div><label class="field-label">City</label>
        <input type="text" value="${esc(d.city)}" onchange="App.updateDealField('${d.id}','city', this.value)"></div>
      <div><label class="field-label">State</label>
        <input type="text" value="${esc(d.state)}" onchange="App.updateDealField('${d.id}','state', this.value)"></div>
      <div><label class="field-label">Zip</label>
        <input type="text" value="${esc(d.zip)}" onchange="App.updateDealField('${d.id}','zip', this.value)"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Line Items &amp; Pricing</h2>
    <p class="attach-hint" style="margin-top:-6px;">Only description and client price show on the proposal — cost, markup, and margin stay internal.</p>
    ${lineItemsHtml}
    <div class="totals-bar">
      <div class="stat"><div class="stat-label">Total Price</div><div class="stat-value">${money(dealClientPrice(d))}</div></div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn btn-outline" onclick="App.viewDeal('${d.id}')">Cancel</button>
    <button class="btn btn-primary" id="download-proposal-btn" onclick="App.downloadProposalDocx('${d.id}')" ${allTemplates.length === 0 ? 'disabled' : ''}>Download as Word (.docx)</button>
  </div>`;
}

// ---------- Init ----------
let appInitialized = false;
async function initApp() {
  if (appInitialized) return;
  appInitialized = true;
  document.getElementById('main').innerHTML = `<div class="empty-state">Loading deals...</div>`;
  const bridgeReady = await waitForFirebaseBridge(10000);
  if (!bridgeReady) {
    storageError = true;
    storageErrorDetail = 'Firebase failed to load in this browser.';
    render();
    return;
  }
  if (window.__firebaseMigrateLegacy) {
    try { await window.__firebaseMigrateLegacy(); } catch (e) { console.error('Migration failed:', e); }
  }
  await subscribeToDealsOnce();
  if (window.__firebaseSeedTemplates) {
    try { await window.__firebaseSeedTemplates(); } catch (e) { console.error('Template seed failed:', e); }
  }
  await subscribeToTemplatesOnce();
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.error('Service worker registration failed:', e));
  });
}
</script>
</body>
</html>
