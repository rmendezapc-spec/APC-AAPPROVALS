<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Approval Board</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1C2B36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deal Board">
<style>
  :root {
    --ink: #1C2B36;
    --ink-soft: #3D4E5C;
    --muted: #6B7A85;
    --line: #DCE2E6;
    --field: #F6F7F5;
    --paper: #FFFFFF;
    --panel-alt: #EEF1F0;
    --row-border: #EFF2F3;
    --amber: #C8791E;
    --amber-soft: #F3E2CC;
    --green: #2F6B4F;
    --green-soft: #DCEAE2;
    --red: #A83A3A;
    --red-soft: #F3DEDE;
    --steel: #1C2B36;
    --radius: 6px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --shadow-xs: 0 1px 2px rgba(16,23,29,0.05);
    --shadow-sm: 0 1px 3px rgba(16,23,29,0.07), 0 1px 2px rgba(16,23,29,0.05);
    --shadow-md: 0 3px 8px rgba(16,23,29,0.10), 0 1px 3px rgba(16,23,29,0.06);
    --shadow-lg: 0 10px 28px rgba(16,23,29,0.18), 0 3px 10px rgba(16,23,29,0.08);
    --inset-shadow: inset 0 1px 2px rgba(16,23,29,0.05);
    --highlight: rgba(255,255,255,0.14);
  }

  body.dark {
    --ink: #E7ECEF;
    --ink-soft: #C3CDD3;
    --muted: #8A98A3;
    --line: #2B3640;
    --field: #10171D;
    --paper: #1A222A;
    --panel-alt: #222B33;
    --row-border: #26313A;
    --amber: #E0954A;
    --amber-soft: #3A2E1D;
    --green: #6FBF97;
    --green-soft: #16281F;
    --red: #E08080;
    --red-soft: #3A2020;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.30);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.40), 0 1px 2px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 10px rgba(0,0,0,0.48), 0 1px 4px rgba(0,0,0,0.35);
    --shadow-lg: 0 14px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.40);
    --inset-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
    --highlight: rgba(255,255,255,0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--field);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  header.topbar {
    background: var(--steel);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 3;
  }

  header.topbar .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  header.topbar .brand .title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  header.topbar .brand .subtitle {
    font-size: 12.5px;
    color: #9FB0BC;
  }

  header.topbar .nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .current-user-label {
    font-size: 12.5px;
    color: #9FB0BC;
    margin-right: 2px;
  }

  .btn {
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    transition: filter 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
  }
  a.btn { text-decoration: none; display: inline-block; }
  .btn:hover { filter: brightness(0.95); }
  .btn:active { filter: brightness(0.88); transform: translateY(1px); box-shadow: none !important; }

  .btn-primary {
    background: linear-gradient(180deg, var(--highlight), rgba(0,0,0,0)), var(--amber);
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .btn-primary:hover { box-shadow: var(--shadow-md); }
  .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
  .btn-outline { background: var(--paper); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-xs); }
  .btn-danger { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .btn-success { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .btn-small { padding: 5px 10px; font-size: 12.5px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .settings-wrap { position: relative; }

  .settings-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 220px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 8px;
    flex-direction: column;
    gap: 2px;
    z-index: 10;
  }
  .settings-menu.open { display: flex; }

  .settings-menu .current-user-label {
    padding: 6px 10px 8px;
    margin: 0 0 4px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-soft);
  }

  .settings-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .settings-menu-item:hover { background: var(--panel-alt); }

  .notif-wrap { position: relative; }

  .notif-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    min-width: 16px;
    height: 16px;
    padding: 0 3px;
    border-radius: 8px;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
  }

  .notif-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 340px;
    max-height: 420px;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 8px;
    flex-direction: column;
    gap: 2px;
    z-index: 10;
  }
  .notif-menu.open { display: flex; }

  .notif-menu-header {
    padding: 6px 10px 8px;
    margin: 0 0 4px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
  }

  .notif-empty {
    padding: 14px 10px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .notif-item {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
  }
  .notif-item:hover { background: var(--panel-alt); }
  .notif-item.unread { background: var(--panel-alt); }
  .notif-item .notif-text { font-size: 13.5px; line-height: 1.4; color: var(--ink); }
  .notif-item .notif-time { font-size: 11px; color: var(--muted); margin-top: 3px; }

  main {
    max-width: min(2000px, 97vw);
    margin: 0 auto;
    padding: 28px 32px 80px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--amber);
  }

  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 16px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }

  .deal-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }
  .deal-card:hover { border-color: var(--muted); box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .deal-card .info .job { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  .deal-card .info .meta { font-size: 12.5px; color: var(--muted); }

  .deal-card .right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .deal-card .price { font-family: var(--mono); font-weight: 700; font-size: 15px; text-align: right; }
  .deal-card .price .label { display:block; font-family: var(--sans); font-weight: 500; font-size: 11px; color: var(--muted); }

  .stamp {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 2px solid currentColor;
    border-radius: 3px;
    transform: rotate(-4deg);
    white-space: nowrap;
    box-shadow: 1px 1px 0 rgba(0,0,0,0.10);
  }
  .stamp.pending { color: var(--amber); }
  .stamp.approved { color: var(--green); }
  .stamp.rejected { color: var(--red); }

  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
  }

  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--inset-shadow);
  }
  textarea { resize: vertical; min-height: 60px; }
  textarea.notes-autogrow { resize: none; overflow: hidden; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
    border-color: var(--amber);
  }

  .section-block {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .section-head {
    background: var(--panel-alt);
    padding: 9px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 1px 0 var(--line);
  }
  .section-head input[type=text] {
    font-weight: 700;
    border: none;
    background: transparent;
    padding: 4px 2px;
  }
  .section-head input[type=text]:focus { outline: none; border-bottom: 2px solid var(--amber); }

  table.items {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.items th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  table.items td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--row-border);
    vertical-align: middle;
  }
  table.items td input, table.items td select { padding: 6px 8px; font-size: 13px; }
  table.items td.num { text-align: right; font-family: var(--mono); }
  table.items tr.subtotal td { font-weight: 700; background: var(--panel-alt); font-family: var(--mono); box-shadow: inset 0 1px 0 var(--line); }
  table.items tr.subtotal td.label-cell { font-family: var(--sans); }

  .table-scroll { overflow-x: auto; }
  table.items { min-width: 1060px; }
  table.items input, table.items select { min-width: 76px; }
  table.items select { min-width: 132px; }
  .col-desc { min-width: 160px; }
  .col-action { width: 34px; text-align: center; }

  /* Handoff Sheet / Engineering Order tabs — styled to echo the printed
     forms they replace: navy section bars, checklist tables with a
     checkbox column, and light-blue table headers for data grids. */
  .doc-form-bar {
    background: #1F3864;
    color: #fff;
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 14px;
    border-radius: 6px 6px 0 0;
    margin-top: 18px;
  }
  .doc-form-bar:first-of-type { margin-top: 0; }
  .doc-form-section {
    border: 1px solid var(--line);
    border-radius: 0 0 6px 6px;
    border-top: none;
    padding: 14px;
    margin-bottom: 4px;
    box-shadow: var(--shadow-xs);
  }
  table.checklist { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.checklist th {
    background: #1F3864;
    color: #fff;
    text-align: left;
    font-size: 11.5px;
    padding: 7px 10px;
  }
  table.checklist td { padding: 6px 8px; border-bottom: 1px solid var(--row-border); vertical-align: middle; }
  table.checklist td.col-check { width: 34px; text-align: center; }
  table.checklist td.col-check input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
  table.checklist td.col-item { width: 40%; }
  table.checklist td.col-notes input { padding: 6px 8px; font-size: 13px; }
  table.grid-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 10px; }
  table.grid-table th {
    background: var(--panel-alt);
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--muted);
    padding: 7px 8px;
    border-bottom: 1px solid var(--line);
  }
  table.grid-table td { padding: 5px 6px; border-bottom: 1px solid var(--row-border); }
  table.grid-table td input { padding: 6px 8px; font-size: 13px; }
  .check-option-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .check-option-row input[type=checkbox], .check-option-row input[type=radio] { width: 17px; height: 17px; cursor: pointer; }
  .check-option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 16px; }
  .doc-download-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

  .totals-bar {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-end;
    background: var(--panel-alt);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-top: 6px;
    box-shadow: var(--inset-shadow);
  }
  .totals-bar .stat .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .totals-bar .stat .stat-value {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
  }
  .totals-bar .profit-input { max-width: 90px; }

  .attachments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }
  .attachment-card { display: flex; flex-direction: column; gap: 6px; }
  .attachment-thumb {
    position: relative;
    display: block;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 1;
    background: var(--field);
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .attachment-thumb:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .attachment-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attachment-thumb.attachment-file { text-decoration: none; }
  .attachment-thumb .file-icon {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  .attachment-thumb .file-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(28,43,54,0.65);
    color: #fff;
    font-size: 9.5px;
    padding: 2px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-category-select { font-size: 12px; padding: 5px 6px; }
  .attachment-description-input {
    font-size: 12px;
    padding: 5px 6px;
    min-height: 44px;
    resize: vertical;
    font-family: var(--sans);
  }
  .attachment-delete-btn { width: 100%; }
  .attach-btn-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .attach-hint { font-size: 12px; color: var(--muted); }

  #lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,15,20,0.88);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  #lightbox-overlay img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
  }

  .job-site-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    font-size: 13.5px;
  }
  .job-site-summary .kv .k { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .job-site-summary .kv .v { font-weight: 600; }

  .approval-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .approver-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-xs);
    background: var(--paper);
  }
  .approver-card .name { font-weight: 700; margin-bottom: 8px; font-size: 14.5px; }
  .approver-card .actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .approver-card .status-line { font-size: 12.5px; color: var(--muted); }
  .approver-card textarea { margin-top: 8px; }

  .comment-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 340px;
    overflow-y: auto;
    margin-bottom: 14px;
  }
  .comment-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .comment {
    background: var(--panel-alt);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow-xs);
  }
  .comment-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .comment-author { font-weight: 700; font-size: 13px; }
  .comment-time { font-size: 11px; color: var(--muted); }
  .comment-text { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }

  .comment-composer {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .comment-composer textarea { flex: 1 1 220px; min-height: 40px; }
  .comment-composer .btn { flex: 0 0 auto; }

  .user-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .user-row {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .user-row-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 0 2px;
  }
  .user-role { font-size: 13px; color: var(--muted); }
  .user-role-select { width: auto; min-width: 90px; }
  .user-row-add { padding-top: 8px; border-top: 1px solid var(--line); }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-weight: 600;
  }
  .back-link:hover { color: var(--amber); }

  .add-row-btn {
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 7px 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    margin: 8px;
  }
  .add-row-btn:hover { border-color: var(--amber); color: var(--amber); }

  .banner {
    background: var(--red-soft);
    color: var(--red);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  @media print {

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

  import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-ai.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDDHjIX-V_DwizD85TzwvcjuDPu1lMZoSc",
    authDomain: "apc-approvals.firebaseapp.com",
    projectId: "apc-approvals",
    storageBucket: "apc-approvals.firebasestorage.app",
    messagingSenderId: "170502222959",
    appId: "1:170502222959:web:2a9b4345c3ac9bef8b099a",

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const auth = getAuth(firebaseApp);

  // AI Logic (Gemini, via the free "Gemini Developer API" backend) powers

  // AI Logic configuration, enabled once in the Firebase Console. If that
  // product isn't enabled yet, aiModel stays null and the button just shows
  // a clear error instead of silently failing.
  let aiModel = null;
  try {
    const ai = getAI(firebaseApp, { backend: new GoogleAIBackend() });
    // Use the "-latest" alias rather than pinning a dated model id — Google
    // rolls specific model versions out of availability over time (this is
    // exactly what broke gemini-2.5-flash), but commits to keeping this
    // alias pointed at a current flash model with 2 weeks' notice before any
    // breaking change.
    aiModel = getGenerativeModel(ai, { model: 'gemini-flash-latest' });
  } catch (e) {
    console.error('Firebase AI Logic init failed:', e);
  }

  window.__firebaseOrganizeNotes = async function (rawText) {
    if (!aiModel) throw new Error('AI Logic is not enabled for this Firebase project yet.');
    const prompt = 'Organize the following sales rep site notes into clear, concise bullet points. '
      + 'Keep every specific detail (measurements, names, dates, concerns) — just tighten the wording and structure. '
      + 'Return ONLY the bullet points, one per line, each starting with "- ". No intro, no summary, no extra commentary.\n\n'
      + 'Site notes:\n' + rawText;
    const result = await aiModel.generateContent(prompt);
    return result.response.text();
  };

  // Firestore rules require request.auth != null on every collection, so some
  // Firebase Auth session is the real access barrier: a plain curl/API call
  // with just the (public, unavoidably visible) project config no longer
  // gets in. Microsoft sign-in (see __firebaseSignInMicrosoft below) is now
  // the primary login path and persists its own real session across page
  // loads — so first check whether one is already restored before ever
  // falling back to an anonymous session, otherwise a returning Microsoft
  // user would get silently signed out of their real identity and back into
  // an anonymous one on every reload. Top-level await here delays this
  // module's completion (and therefore DOMContentLoaded) until that's
  // settled, raced against a timeout so a stuck sign-in can't block the
  // whole gate from loading — Firestore calls below just fail with a clear
  // permission error instead, which the classic script surfaces on the gate.
  try {
    const restoredUser = await Promise.race([
      new Promise((resolve) => {
        const unsub = onAuthStateChanged(auth, (user) => { unsub(); resolve(user); });
      }),
      new Promise((resolve) => setTimeout(() => resolve(undefined), 8000)),
    ]);
    if (!restoredUser) {
      await Promise.race([
        signInAnonymously(auth),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timed out')), 8000))
      ]);
    }
  } catch (e) {
    console.error('Sign-in failed:', e);
  }

  // Microsoft sign-in via Entra ID (Azure AD), restricted to the American
  // Precast Concrete tenant — see AZURE_TENANT_ID below, set up per the
  // walkthrough in this project's chat history / README. This REPLACES the
  // anonymous session with a real, verified identity; the classic script
  // matches the resulting email against a `users` document to decide who's
  // logged in, same as the PIN flow does, just without a spoofable
  // client-side-only credential.
  const AZURE_TENANT_ID = '4e7bc0be-2ccd-4d9c-aeb5-55a5483c3314';
  window.__firebaseSignInMicrosoft = async function () {
    try {
      const provider = new OAuthProvider('microsoft.com');
      provider.setCustomParameters({ tenant: AZURE_TENANT_ID, prompt: 'select_account' });
      const result = await signInWithPopup(auth, provider);
      const email = (result.user && result.user.email) || null;
      if (!email) return { ok: false, error: 'Microsoft did not return an email address for this account.' };
      return { ok: true, email };
    } catch (e) {
      console.error('Microsoft sign-in failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__firebaseSignOut = async function () {
    try { await signOut(auth); } catch (e) { console.error('Sign-out failed:', e); }
  };

  // Legacy single-document store (one JSON blob for every deal). Superseded
  // by the `deals` collection below, kept only as a one-time migration source.
  const legacyDocRef = doc(db, 'apcDealBoard', 'deals');
  const dealsCollRef = collection(db, 'deals');
  const usersCollRef = collection(db, 'users');
  const templatesCollRef = collection(db, 'templates');
  const settingsCollRef = collection(db, 'settings');
  const notificationsCollRef = collection(db, 'notifications');
  const costCodesCollRef = collection(db, 'costCodes');
  const dealTemplatesCollRef = collection(db, 'dealTemplates');

  // Each deal is its own document, keyed by the deal's own id. This avoids the
  // 1MB single-document cap and the "last write wins, whole list" concurrency
  // issue that came with storing everything in one blob.
  window.__firebaseSaveDeal = async function (deal) {
    try {
      await setDoc(doc(dealsCollRef, deal.id), deal);
      return { ok: true };
    } catch (e) {
      console.error('Firestore save failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  // Real-time subscription over the whole collection — fires immediately with
  // current data, then again any time ANYONE (any device) changes it.
  window.__firebaseSubscribeDeals = function (onData, onError) {
    onSnapshot(dealsCollRef, (snap) => {
      const arr = [];
      snap.forEach((d) => arr.push(d.data()));
      arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      onData(arr);
    }, (err) => {
      console.error('Firestore listen error:', err);
      if (onError) onError(err);
    });
  };

  // One-time migration: if the `deals` collection is still empty but the old
  // single-document store has data, copy each deal into its own document.
  // Safe to call on every load — a no-op once the collection is populated.
  window.__firebaseMigrateLegacy = async function () {
    try {
      const existing = await getDocs(dealsCollRef);
      if (!existing.empty) return;
      const legacySnap = await getDoc(legacyDocRef);
      if (!legacySnap.exists()) return;
      const parsed = JSON.parse(legacySnap.data().data || '[]');
      for (const deal of parsed) {
        await setDoc(doc(dealsCollRef, deal.id), deal);
      }
    } catch (e) {
      console.error('Legacy migration failed:', e);
    }
  };

  // User accounts (login identity + approver slot + role). Same lightweight
  // trust model as everything else in this app — no real auth, just a named
  // PIN check — but it replaces the old shared passphrase + per-approver PIN
  // scheme with one login that also drives who can approve/reject and post
  // chat messages as themselves.
  window.__firebaseSaveUser = async function (user) {
    try {
      await setDoc(doc(usersCollRef, user.id), user);
      return { ok: true };
    } catch (e) {
      console.error('Firestore save user failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__firebaseDeleteUser = async function (userId) {
    try {
      await deleteDoc(doc(usersCollRef, userId));
      return { ok: true };
    } catch (e) {
      console.error('Firestore delete user failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__firebaseSubscribeUsers = function (onData, onError) {
    onSnapshot(usersCollRef, (snap) => {
      const arr = [];
      snap.forEach((d) => arr.push(d.data()));
      onData(arr);
    }, (err) => {
      console.error('Firestore listen error (users):', err);
      if (onError) onError(err);
    });
  };

  // Seed of the base accounts (Sandy and Connor as the two fixed approver
  // seats, Richard/Navid as admins, Fidel as a rep, Christina/Russell as
  // viewers — view/comment/download, no deal creation). Backfills whichever
  // of these specific IDs are still missing rather than bailing out if the
  // collection is non-empty, so adding a new base account later still lands
  // even if the others were already seeded/edited. Also backfills just the
  // `email` field onto an account that already existed before Microsoft
  // sign-in was added, without touching anything an admin has since edited
  // (name/pin/role) on that account.
  window.__firebaseSeedUsers = async function () {
    try {
      const existing = await getDocs(usersCollRef);
      const existingById = new Map();
      existing.forEach((d) => existingById.set(d.id, d.data()));
      const seed = [
        { id: 'usr_sandy', name: 'Sandy', pin: 'SANDY888', role: 'approver', approverSlot: 'sandy', email: 'sandy@americanprecast.com', createdAt: Date.now() },
        { id: 'usr_connor', name: 'Connor', pin: 'CONNOR2385', role: 'approver', approverSlot: 'connor', email: 'connor@americanprecast.com', createdAt: Date.now() },
        { id: 'usr_richard', name: 'Richard', pin: 'Warrior662!', role: 'admin', approverSlot: null, email: 'richard@americanprecast.com', createdAt: Date.now() },
        { id: 'usr_fidel', name: 'Fidel', pin: 'FIDEL1234', role: 'rep', approverSlot: null, email: 'fidel@americanprecast.com', createdAt: Date.now() },
        { id: 'usr_navid', name: 'Navid', pin: 'NAVID7741', role: 'admin', approverSlot: null, email: 'navid@americanprecast.com', createdAt: Date.now() },
        { id: 'usr_christina', name: 'Christina Aviles', pin: 'CHRISTINA5290', role: 'viewer', approverSlot: null, email: 'christina.aviles@americanprecast.com', createdAt: Date.now() },
        { id: 'usr_russell', name: 'Russell', pin: 'RUSSELL3168', role: 'viewer', approverSlot: null, email: 'russell@americanprecast.com', createdAt: Date.now() },
      ];
      for (const user of seed) {
        const existingDoc = existingById.get(user.id);
        if (!existingDoc) {
          await setDoc(doc(usersCollRef, user.id), user);
        } else if (!existingDoc.email && user.email) {
          await setDoc(doc(usersCollRef, user.id), { email: user.email }, { merge: true });
        }
      }
    } catch (e) {
      console.error('User seed failed:', e);
    }
  };

  // Proposal templates — the reusable boilerplate (scope of work, terms,

    try {

      console.error('Firestore save template failed:', e);

  window.__firebaseDeleteTemplate = async function (templateId) {

      console.error('Firestore delete template failed:', e);

  window.__firebaseSubscribeTemplates = function (onData, onError) {

  };

      await deleteDoc(doc(costCodesCollRef, costCodeId));

      console.error('Firestore delete cost code failed:', e);

  window.__firebaseSeedCostCodes = async function () {

        { id: 'cc_3055', code: '3055', name: 'I Beams', category: 'Installation', defaultCostType: 'Equipment', defaultUnit: 'each' },
        { id: 'cc_3065', code: '3065', name: 'Job Supplies Consumables', category: 'Installation', defaultCostType: 'Material', defaultUnit: 'each' },

        { id: 'cc_3080', code: '3080', name: 'Paint', category: 'Installation', defaultCostType: 'None', defaultUnit: 'Gallon' },

        { id: 'cc_4000', code: '4000', name: 'Housing/Airbnb/Hotel', category: 'Mobilization', defaultCostType: 'Other', defaultUnit: 'each' },
        { id: 'cc_4010', code: '4010', name: 'Per Diem', category: 'Mobilization', defaultCostType: 'Other', defaultUnit: 'each' },
        { id: 'cc_4020', code: '4020', name: 'Drive Time', category: 'Mobilization', defaultCostType: 'Labor', defaultUnit: 'each' },
        { id: 'cc_5000', code: '5000', name: 'COGS', category: '', defaultCostType: 'Other', defaultUnit: 'each' },
        { id: 'cc_5009', code: '5009', name: 'Precast Wall', category: 'Precast Concrete Wall', defaultCostType: 'Other', defaultUnit: 'LF' },
        { id: 'cc_5010', code: '5010', name: 'Freight', category: 'Precast Concrete Wall', defaultCostType: 'Subcontractor', defaultUnit: 'each' },
        { id: 'cc_5020', code: '5020', name: 'Tax', category: 'Precast Concrete Wall', defaultCostType: 'Other', defaultUnit: 'each' },
        { id: 'cc_6020', code: '6020', name: 'Overhead', category: 'Unassigned', defaultCostType: 'None', defaultUnit: 'each' }

      for (const code of seed) {
        if (!existingIds.has(code.id)) {

  // Deal templates — a saved Cost Breakdown structure (sections + line

  // starts a new deal, instead of the 4 empty default sections. Captured
  // from a real deal via "Save as Template" rather than hand-built, so the
  // structure/items shape always matches what a deal's own Cost Breakdown
  // already produces.
  window.__firebaseSaveDealTemplate = async function (template) {
    try {
      await setDoc(doc(dealTemplatesCollRef, template.id), template);
      return { ok: true };
    } catch (e) {
      console.error('Firestore save deal template failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__firebaseDeleteDealTemplate = async function (templateId) {
    try {
      await deleteDoc(doc(dealTemplatesCollRef, templateId));
      return { ok: true };
    } catch (e) {
      console.error('Firestore delete deal template failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__firebaseSubscribeDealTemplates = function (onData, onError) {
    onSnapshot(dealTemplatesCollRef, (snap) => {
      const arr = [];
      snap.forEach((d) => arr.push(d.data()));
      onData(arr);

  window.__firebaseSubscribeMaterialPricing = function (onData, onError) {
    onSnapshot(doc(settingsCollRef, 'materialPricing'), (snap) => {
      onData(snap.exists() ? snap.data() : null);

      console.error('Firestore listen error (material pricing):', err);

  };

  // A user's inbox — one document per "X sent you a Y for Z" event, created
  // when a rep assigns and sends a Proposal, Handoff Sheet, or Engineering
  // Order. Queried per-recipient rather than kept on the deal itself so a
  // user's inbox doesn't require scanning every deal in the collection.
  window.__firebaseSaveNotification = async function (notification) {

      await setDoc(doc(notificationsCollRef, notification.id), notification);

  window.__firebaseMarkNotificationRead = async function (notificationId) {

<script>
// User accounts — same lightweight, client-side trust model as everything
// else in this app (no real backend auth, just a named PIN check). Replaces
// the old shared team passphrase and separate per-approver PIN modal: one
// login now gates the app, drives who can approve/reject, and attributes
// chat messages automatically.
let allUsers = [];
let currentUser = null;
let notifications = []; // the logged-in user's inbox, newest first

function populateUserSelect() {
  const select = document.getElementById('login-user-select');
  if (!select) return;
  const prevValue = select.value;
  select.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
  if (prevValue && allUsers.some(u => u.id === prevValue)) select.value = prevValue;
}

function updateUserChrome() {
  const label = document.getElementById('current-user-label');
  if (label) label.textContent = currentUser ? ('Logged in as ' + currentUser.name) : '';
  const newDealBtn = document.getElementById('new-deal-btn');
  if (newDealBtn) newDealBtn.style.display = canAddDeals(currentUser) ? '' : 'none';
  const manageBtn = document.getElementById('manage-users-btn');
  if (manageBtn) manageBtn.style.display = isAdminUser(currentUser) ? '' : 'none';
  const templatesBtn = document.getElementById('manage-templates-btn');
  if (templatesBtn) templatesBtn.style.display = currentUser ? '' : 'none';
  const costCodesBtn = document.getElementById('manage-cost-codes-btn');
  if (costCodesBtn) costCodesBtn.style.display = currentUser ? '' : 'none';
  const dealTemplatesBtn = document.getElementById('manage-deal-templates-btn');
  if (dealTemplatesBtn) dealTemplatesBtn.style.display = currentUser ? '' : 'none';
}

let gateLoadError = '';

function subscribeToUsersOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeUsers) {
      gateLoadError = 'Firebase failed to load in this browser.';
      resolve();
      return;
    }
    let settled = false;
    window.__firebaseSubscribeUsers((users) => {
      allUsers = users;
      gateLoadError = '';
      populateUserSelect();
      if (currentUser) {
        const updated = allUsers.find(u => u.id === currentUser.id);
        if (updated) { currentUser = updated; updateUserChrome(); }
      }
      if (currentView !== 'form') render();
      if (!settled) { settled = true; resolve(); }
    }, (err) => {
      gateLoadError = (err && err.message) || String(err);
      if (!settled) { settled = true; resolve(); }
    });
  });
}

function attemptLogin() {
  const select = document.getElementById('login-user-select');
  const pinInput = document.getElementById('login-pin-input');
  const user = allUsers.find(u => u.id === select.value);
  const val = (pinInput.value || '').trim();
  if (!user || val.toUpperCase() !== (user.pin || '').toUpperCase()) {
    document.getElementById('gate-error').textContent = 'Incorrect PIN — try again.';
    pinInput.value = '';
    pinInput.focus();
    return;
  }
  currentUser = user;
  try { localStorage.setItem('apc_current_user_id', user.id); } catch (e) {}
  enterApp();
}

async function attemptMicrosoftLogin() {
  const errorEl = document.getElementById('gate-error');
  const btn = document.getElementById('ms-login-btn');
  if (!window.__firebaseSignInMicrosoft) {
    errorEl.textContent = 'Microsoft sign-in is not available in this browser.';
    return;
  }
  errorEl.textContent = '';
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
  try {
    const result = await window.__firebaseSignInMicrosoft();
    if (!result.ok) {
      errorEl.textContent = 'Microsoft sign-in failed: ' + result.error;
      return;
    }
    const email = result.email.trim().toLowerCase();
    const user = allUsers.find(u => (u.email || '').trim().toLowerCase() === email);
    if (!user) {
      errorEl.textContent = `Signed in as ${result.email}, but no account here is set up for that address yet — ask an admin to add it under Manage Users.`;
      return;
    }
    currentUser = user;
    try { localStorage.setItem('apc_current_user_id', user.id); } catch (e) {}
    enterApp();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Sign in with Microsoft'; }
  }
}

function enterApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateUserChrome();
  initApp();
  subscribeToNotificationsOnce(); // fresh every login — see its own comment
  render();
}

function logout() {
  currentUser = null;
  try { localStorage.removeItem('apc_current_user_id'); } catch (e) {}
  // End the real Firebase Auth session too (not just the app's own notion of
  // "who's logged in") — otherwise a Microsoft-authenticated session would
  // just get silently restored again on the next page load.
  if (window.__firebaseSignOut) window.__firebaseSignOut();
  if (notifUnsubscribe) { notifUnsubscribe(); notifUnsubscribe = null; }
  notifications = [];
  renderNotifChrome();
  updateUserChrome();
  currentView = 'list';
  currentDealId = null;
  openRejectBoxFor = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  const pinInput = document.getElementById('login-pin-input');
  if (pinInput) pinInput.value = '';
  document.getElementById('gate-error').textContent = '';
}

function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function toggleSettingsMenu(event) {
  if (event) event.stopPropagation();
  document.getElementById('settings-menu').classList.toggle('open');
}

function closeSettingsMenu() {
  const menu = document.getElementById('settings-menu');
  if (menu) menu.classList.remove('open');
}

function toggleNotifMenu(event) {
  if (event) event.stopPropagation();
  document.getElementById('notif-menu').classList.toggle('open');
}

function closeNotifMenu() {
  const menu = document.getElementById('notif-menu');
  if (menu) menu.classList.remove('open');
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.settings-wrap');
  if (wrap && !wrap.contains(e.target)) closeSettingsMenu();
  const notifWrap = document.querySelector('.notif-wrap');
  if (notifWrap && !notifWrap.contains(e.target)) closeNotifMenu();
});

function toggleTheme() {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem('apc_theme', next); } catch (e) {}
  applyTheme(next);
}

function initTheme() {
  let theme = 'light';
  try {
    const stored = localStorage.getItem('apc_theme');
    if (stored) theme = stored;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
  } catch (e) {}
  applyTheme(theme);
}

initTheme();

// Don't assume the type="module" script (which has a top-level await for
// anonymous sign-in) has finished defining window.__firebase* by the time
// DOMContentLoaded fires — that ordering isn't reliable in every browser.
// Poll for it instead of racing it.
function waitForFirebaseBridge(timeoutMs) {
  return new Promise((resolve) => {
    const start = Date.now();
    (function check() {
      if (window.__firebaseSubscribeUsers) { resolve(true); return; }
      if (Date.now() - start > timeoutMs) { resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}

document.addEventListener('DOMContentLoaded', async function initGate() {
  document.getElementById('gate-error').textContent = 'Loading users…';
  const bridgeReady = await waitForFirebaseBridge(10000);
  if (!bridgeReady) {
    gateLoadError = 'Firebase failed to load in this browser.';
  } else {
    if (window.__firebaseSeedUsers) {
      try { await window.__firebaseSeedUsers(); } catch (e) {}
    }
    await subscribeToUsersOnce();
  }
  if (gateLoadError) {
    document.getElementById('gate-error').textContent = "Couldn't load the user list — " + gateLoadError + ' Try refreshing the page.';
  } else if (allUsers.length === 0) {
    document.getElementById('gate-error').textContent = 'No users found yet — try refreshing the page.';
  } else {
    document.getElementById('gate-error').textContent = '';
  }

  let savedUserId = null;
  try { savedUserId = localStorage.getItem('apc_current_user_id'); } catch (e) {}
  const saved = allUsers.find(u => u.id === savedUserId);
  if (saved) {
    currentUser = saved;
    enterApp();
  } else {
    document.getElementById('login-pin-input').focus();
  }
});
</script>

// Logs that a Proposal/Handoff Sheet/Engineering Order was (re)generated, so
// the Overview tab's Documents panel can show "last generated" info without
// storing the actual file — Download always rebuilds it fresh from the

async function recordDocumentGenerated(d, type) {
  d.documents = d.documents || { proposal: null, handoff: null, engineering: null };

async function saveDeal(deal) {
  try {
    const result = window.__firebaseSaveDeal
      ? await window.__firebaseSaveDeal(deal)
      : { ok: false, error: 'Firebase failed to load in this browser.' };
    storageError = !result.ok;
    storageErrorDetail = result.ok ? '' : (result.error || '');
  } catch (e) {
    storageError = true;
    storageErrorDetail = (e && e.message) || String(e);
  }
  render();
}

// Subscribes once to the shared Firestore `deals` collection. Resolves after
// the first snapshot arrives (or the first error) so initApp never hangs on
// "Loading deals..." forever, then keeps updating `deals` live as anyone
// (any device) makes changes.
function subscribeToDealsOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeDeals) {
      // Firebase script failed to load (offline, blocked, bad config, etc.)
      storageError = true;
      storageErrorDetail = 'Firebase failed to load in this browser.';
      resolve();
      return;
    }
    let settled = false;
    window.__firebaseSubscribeDeals((remoteDeals) => {
      deals = remoteDeals;
      storageError = false;
      storageErrorDetail = '';
      if (currentView === 'list' || currentView === 'detail') render();
      if (!settled) {
        settled = true;
        firebaseSubscribed = true;
        resolve();
      }
    }, (err) => {
      storageError = true;
      storageErrorDetail = (err && err.message) || String(err);
      render();
      if (!settled) {
        settled = true;
        resolve();
      }
    });
  });
}

function subscribeToTemplatesOnce() {
  return new Promise((resolve) => {
    if (!window.__firebaseSubscribeTemplates) { resolve(); return; }

    window.__firebaseSubscribeTemplates((templates) => {

function applyMaterialPricingOverrides(data) {

  MATERIAL_CALC_PRODUCTS.forEach(p => {

  });
}

// Turns the raw rows from an uploaded cost-estimate export (BuilderTrend-style
// "Category / Title / Description / Quantity / Unit / Unit Cost / Cost Type /
// Markup" columns) into deal sections/items. Looks columns up by header name
// (case-insensitive) rather than fixed position, since exports can reorder
// columns across versions.
function parseEstimateRows(rows) {
  if (!rows || rows.length < 2) return [];
  const norm = h => String(h || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const headerRow = rows[0].map(norm);
  const idx = name => headerRow.indexOf(norm(name));
  const cCategory = idx('Category');
  const cTitle = idx('Title');
  const cDescription = idx('Description');
  const cQty = idx('Quantity');
  const cUnit = idx('Unit');
  const cUnitCost = idx('Unit Cost');
  const cCostType = idx('Cost Type');
  const cMarkup = idx('Markup');

  const sectionsByName = new Map();
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every(v => v === '' || v == null)) continue;

    const title = cTitle >= 0 ? String(row[cTitle] || '').trim() : '';
    const description = cDescription >= 0 ? String(row[cDescription] || '').trim() : '';
    const desc = title && description ? `${title} - ${description}` : (description || title);
    if (!desc) continue;

    const sectionName = (cCategory >= 0 ? String(row[cCategory] || '').trim() : '') || 'Imported Costs';
    const qty = cQty >= 0 ? (Number(row[cQty]) || 1) : 1;
    const unit = (cUnit >= 0 ? String(row[cUnit] || '').trim() : '') || 'each';
    const unitCost = cUnitCost >= 0 ? (Number(row[cUnitCost]) || 0) : 0;
    const rawCostType = cCostType >= 0 ? String(row[cCostType] || '').trim() : '';
    const costType = COST_TYPES.find(t => t.toLowerCase() === rawCostType.toLowerCase()) || 'None';
    const markupPercent = cMarkup >= 0 ? (Number(row[cMarkup]) || 0) : 0;

    if (!sectionsByName.has(sectionName)) {
      sectionsByName.set(sectionName, { id: uid('sec'), name: sectionName, items: [] });
    }
    sectionsByName.get(sectionName).items.push({
      id: uid('item'), desc, qty, unit, unitCost, costType, markupPercent
    });
  }
  return Array.from(sectionsByName.values());
}

// Per-line-item cost math, mirroring the Builder Cost -> Markup -> Client Price -> Margin/Profit
// flow from the BuilderTrend reference.
function itemCalc(item) {
  const qty = Number(item.qty) || 0;
  const unitCost = Number(item.unitCost) || 0;
  const markup = Number(item.markupPercent) || 0;
  const builderCost = qty * unitCost;
  const unitPrice = unitCost * (1 + markup / 100);
  const clientPrice = qty * unitPrice;
  const profit = clientPrice - builderCost;
  const margin = clientPrice > 0 ? (profit / clientPrice) * 100 : 0;
  return { builderCost, unitPrice, clientPrice, profit, margin };
}

// Client proposals show an "Items" / "Description" pair per line, not the
// cost breakdown's Qty/Unit/Price — no per-item pricing at all, just a
// single grand total at the end. Items imported from an estimate file are
// stored as "Title - Description" (see parseEstimateRows); split that back
// apart here. Manually-typed items have no such split, so the whole desc
// just becomes the Items column with a blank Description.
function proposalItemColumns(item) {
  const desc = item.desc || '';
  const dashIdx = desc.indexOf(' - ');
  if (dashIdx === -1) return { items: desc || '—', description: '' };
  return { items: desc.slice(0, dashIdx), description: desc.slice(dashIdx + 3) };
}

function sectionTotals(section) {
  return section.items.reduce((acc, item) => {
    const c = itemCalc(item);
    acc.builderCost += c.builderCost;
    acc.clientPrice += c.clientPrice;
    acc.profit += c.profit;
    return acc;
  }, { builderCost: 0, clientPrice: 0, profit: 0 });
}

function sectionMargin(totals) {
  return totals.clientPrice > 0 ? (totals.profit / totals.clientPrice) * 100 : 0;
}

function dealTotals(deal) {
  return deal.sections.reduce((acc, s) => {
    const t = sectionTotals(s);
    acc.builderCost += t.builderCost;
    acc.clientPrice += t.clientPrice;
    acc.profit += t.profit;
    return acc;
  }, { builderCost: 0, clientPrice: 0, profit: 0 });
}

function dealClientPrice(deal) {
  return dealTotals(deal).clientPrice;
}

function dealBuilderCost(deal) {
  return dealTotals(deal).builderCost;
}

function dealProfit(deal) {
  return dealTotals(deal).profit;
}

function dealMargin(deal) {
  const t = dealTotals(deal);
  return t.clientPrice > 0 ? (t.profit / t.clientPrice) * 100 : 0;
}

function dealStatus(deal) {
  if (deal.approvals.connor === false || deal.approvals.sandy === false) return 'rejected';
  if (deal.approvals.connor === true && deal.approvals.sandy === true) return 'approved';
  return 'pending';
}

// Gate between a rep's Submit for Approval and Sandy/Connor's review queue,
// mirroring CFI SOP "Improvement 02 — Proposal Process": the 8 requirements
// a proposal must meet before it's submittable. Returns one entry per
// incomplete category — an empty array means the deal is ready to submit.
const JOBSITE_PHOTO_MINIMUM = 3;

function evaluateSubmissionChecklist(d) {
  const categories = [];
  const need = (title, missing) => { if (missing.length) categories.push({ title, missing }); };
  // Deals saved before this checklist existed won't have the newer fields
  // at all (undefined, not ''), so read every field through this.
  const text = (v) => (v || '').trim();

  need('Customer & Project Info', [
    !text(d.customerName) && 'Customer Name',
    !text(d.address) && 'Project Address',
    (!text(d.city) || !text(d.state) || !text(d.zip)) && 'City / State / Zip',
    !text(d.email) && 'Contact Info (Email)',
    !d.date && 'Proposal Date',
    !text(d.repName) && 'Rep Name',
  ].filter(Boolean));

  need('Clear Job Description', [
    !text(d.productDesign) && 'Wall Type / Product',
    !text(d.wallHeightSpec) && 'Height',
    !text(d.linearFeet) && 'Linear Feet',
    !text(d.demoRequirements) && 'Demo Requirements (enter "None" if not applicable)',
    !(d.jobSite && d.jobSite.accessDifficulty) && 'Site Access',
    !d.installType && 'Materials vs. Turnkey',
  ].filter(Boolean));

  const photoCount = (d.attachments || []).filter(a => (a.category || 'Photo') === 'Photo').length;
  if (photoCount < JOBSITE_PHOTO_MINIMUM) {
    need('Jobsite Pictures', [`At least ${JOBSITE_PHOTO_MINIMUM} photos covering the work area, existing walls, access points, grade changes, and obstructions (${photoCount} attached)`]);
  }

  const hasDescribedItem = d.sections.some(s => s.items.some(i => text(i.desc)));
  if (!hasDescribedItem) {
    need('Scope of Work', ['At least one described line item in the Cost Breakdown']);
  }

  need('Product Information', [
    !text(d.productDesign) && 'Series / Product Design',
    !text(d.wallHeightSpec) && 'Height',
    !text(d.linearFeet) && 'Linear Feet',
    !text(d.panelPostStyle) && 'Panel / Post Style',
    !text(d.colorFinish) && 'Color / Finish',
    !text(d.specialRequirements) && 'Special Requirements (enter "None" if not applicable)',
  ].filter(Boolean));

  const hasAnyItem = d.sections.some(s => s.items.length > 0);
  if (!hasAnyItem) {
    need('Pricing (Full Breakdown)', ['At least one line item in the Cost Breakdown']);
  } else if (dealClientPrice(d) <= 0) {
    need('Pricing (Full Breakdown)', ['A completed price breakdown (Client Price is currently $0)']);
  }

  if (!text(d.clarificationsAssumptions)) {
    need('Clarifications & Assumptions', ['Clarifications & Assumptions (enter "None" if not applicable)']);
  }

  if (!text(d.exclusions)) {
    need('Exclusions', ['Exclusions — everything NOT included (enter "None" if not applicable)']);
  }

  return categories;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// One line of "Not yet generated" / "Generated <date> by <name> · Assigned to <name>"
// for the Overview tab's Documents panel.
function documentStatusLine(record, assignedTo) {
  if (!record) return 'Not yet generated';
  const assignedPart = assignedTo ? ` · Assigned to ${esc(assigneeName(assignedTo))}` : '';
  return `Generated ${esc(new Date(record.generatedAt).toLocaleDateString())} by ${esc(record.generatedBy || '—')}${assignedPart}`;
}

function postTypeSummary(rows) {
  const parts = (rows || []).filter(r => r.qty > 0).map(r => `${r.qty} ${r.type}`);
  return parts.length ? parts.join(', ') : 'N/A';
}

// Maps a saved Material Estimate onto the Intake Sheet's fields — component
// breakdown and quantities only, no pricing (production doesn't need it).
// Anything the chosen product doesn't use (e.g. Smoothstone has neither
// panel nor post caps) reads "N/A" rather than a misleading 0.
function computeIntakeFields(d, est) {
  if (!est) return null;
  const heightText = est.heightFt ? est.heightFt + ' ft high' : 'N/A';
  const postSummary = postTypeSummary(est.postTypeRows);
  return {
    projectInfo: (d.customerName || 'Untitled deal') + (fullAddressLine(d) ? ' — ' + fullAddressLine(d) : ''),
    wallLengthHeight: `${est.linearFeet} LF, ${heightText}`,
    color: d.colorFinish || 'N/A',
    panelsNeeded: est.kind === 'panel' ? `${est.secondaryValue} panels` : 'N/A',
    postsNeeded: `${est.posts} posts (${postSummary})`,
    postCapsNeeded: est.hasPostCaps ? `${est.posts} post caps (${postSummary})` : 'N/A',
    panelCapsNeeded: est.hasPanelCaps ? `${est.posts} panel caps` : 'N/A'
  };
}

// Resize + compress a photo client-side before storing it, so a multi-MB phone
// photo shrinks down to something small enough to save alongside deal data.
function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 1280;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-overlay').style.display = 'flex';
}

function closeLightbox() {
  document.getElementById('lightbox-overlay').style.display = 'none';
  document.getElementById('lightbox-img').src = '';
}

const ATTACHMENT_CATEGORIES = ['Photo', 'Contract', 'Site Plan', 'Other'];

function guessAttachmentCategory(file) {
  const type = (file.type || '').toLowerCase();
  const name = (file.name || '').toLowerCase();
  if (type.startsWith('image/')) return 'Photo';
  if (type === 'application/pdf' || name.endsWith('.pdf')) return 'Contract';
  return 'Other';
}

// Images get resized/compressed like before; anything else (PDFs, etc.) is
// just read as-is — there's no canvas-based way to "compress" a PDF client-side.
function processAttachmentFile(file) {
  if ((file.type || '').startsWith('image/')) {
    return compressImageFile(file);
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

// Shared card markup for both the draft form and the always-open detail
// view — only the category/delete handlers differ between the two contexts.
function renderAttachmentCard(a, opts) {
  const isImage = !a.mimeType || a.mimeType.startsWith('image/');
  const preview = isImage
    ? `<div class="attachment-thumb" onclick="openLightbox('${a.dataUrl}')">
        <img src="${a.dataUrl}" alt="${esc(a.name)}">
      </div>`
    : `<a class="attachment-thumb attachment-file" href="${a.dataUrl}" target="_blank" rel="noopener" download="${esc(a.name)}">
        <div class="file-icon">📄</div>
        <div class="file-name">${esc(a.name)}</div>
      </a>`;
  return `<div class="attachment-card">
    ${preview}
    <select class="attachment-category-select" onchange="${opts.categoryOnChange}">
      ${ATTACHMENT_CATEGORIES.map(c => `<option value="${c}" ${c === (a.category || 'Photo') ? 'selected' : ''}>${c}</option>`).join('')}
    </select>
    <textarea class="attachment-description-input" placeholder="Add a description..."
        onchange="${opts.descriptionOnChange}">${esc(a.description || '')}</textarea>
    <button class="btn btn-outline btn-small attachment-delete-btn" onclick="${opts.deleteOnClick}">Delete</button>
  </div>`;
}

// Triggers a browser download for an in-memory Blob — shared by every
// "Download as Word (.docx)" button (Proposal, Handoff Sheet, Engineering
// Order) so there's one place that owns the object-URL lifecycle.
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

let cachedLetterheadLogo = null;
async function loadLetterheadLogo() {
  if (cachedLetterheadLogo) return cachedLetterheadLogo;
  const resp = await fetch(COMPANY_LETTERHEAD.logoFile);
  const buf = await resp.arrayBuffer();
  cachedLetterheadLogo = new Uint8Array(buf);

// Builds a real, fully-editable .docx from a deal + template using the docx
// library (loaded on demand, only when a proposal is actually downloaded —
// no reason to ship this to everyone who's just approving deals). Layout
// mirrors the company's actual signed proposal letterhead/format: logo +
// letterhead, Job Address block, Scope of Work with product specs, one
// Items/Description table per cost-breakdown section (no per-item pricing —
// only a single Total price at the end), then Conditions, Exclusions,
// Legal Protections, and Next Steps.
async function buildProposalDocx(docxLib, d, template) {
  const { Document, Paragraph, TextRun, ImageRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, Packer } = docxLib;

  function cell(text, opts) {
    opts = opts || {};
    const params = {
      children: [new Paragraph({ children: [new TextRun({ text: text, bold: !!opts.bold })], alignment: opts.align || AlignmentType.LEFT })]
    };
    if (opts.width) params.width = { size: opts.width, type: WidthType.PERCENTAGE };
    return new TableCell(params);
  }

  function heading(text) {
    return new Paragraph({ text, heading: HeadingLevel.HEADING_2, spacing: { before: 300, after: 150 } });
  }
  function coloredHeading(text) {
    return new Paragraph({ children: [new TextRun({ text, bold: true, size: 28, color: '2E74B5' })], spacing: { before: 300, after: 150 } });
  }
  function para(text) {
    return new Paragraph({ children: [new TextRun(text || '')], spacing: { after: 120 } });
  }
  function centered(text, opts) {
    opts = opts || {};
    return new Paragraph({ children: [new TextRun({ text, bold: !!opts.bold })], alignment: AlignmentType.CENTER, spacing: { after: opts.after != null ? opts.after : 60 } });
  }
  function splitLines(text) {
    return (text || '').split('\n').map((s) => s.trim()).filter(Boolean);
  }
  function bulleted(text) {
    return splitLines(text).map((line) => para('• ' + line));
  }
  // Each template line can be "Title | Description" — rendered as a bold
  // (optionally numbered/colored) title followed by a plain paragraph — or
  // just plain text with no title, for a simple flat list.
  function titledBlocks(text, opts) {
    opts = opts || {};
    const out = [];
    splitLines(text).forEach((line, i) => {
      const prefix = opts.numbered ? (i + 1) + '. ' : '';
      const pipeIdx = line.indexOf('|');
      if (pipeIdx === -1) {
        out.push(para(prefix + line));
        return;
      }
      const title = line.slice(0, pipeIdx).trim();
      const desc = line.slice(pipeIdx + 1).trim();
      out.push(new Paragraph({
        children: [new TextRun({ text: prefix + title, bold: true, color: opts.titleColor })],
        spacing: { before: 140, after: 40 }
      }));
      if (desc) out.push(para(desc));
    });
    return out;
  }

  const children = [];

  // Letterhead
  try {
    const logoData = await loadLetterheadLogo();
    children.push(new Paragraph({
      children: [new ImageRun({ data: logoData, transformation: { width: COMPANY_LETTERHEAD.logoWidth, height: COMPANY_LETTERHEAD.logoHeight }, type: 'png' })],
      alignment: AlignmentType.CENTER,
      spacing: { after: 80 }
    }));
  } catch (e) {
    // Logo is a nice-to-have — the proposal is still complete without it if the fetch fails.
  }
  children.push(centered(COMPANY_LETTERHEAD.name, { bold: true, after: 40 }));
  children.push(centered(COMPANY_LETTERHEAD.addressLine, { after: 20 }));
  children.push(centered(COMPANY_LETTERHEAD.license, { after: 240 }));

  // Job Address
  children.push(new Paragraph({ children: [new TextRun({ text: 'Job Address:', bold: true })], spacing: { after: 20 } }));
  if (d.address) children.push(para(d.address));
  const cityStateZip = [d.city, [d.state, d.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  if (cityStateZip) children.push(para(cityStateZip));

  const nameLine = (d.customerName || '') + (d.company ? ' — ' + d.company : '');
  if (nameLine) children.push(new Paragraph({ children: [new TextRun(nameLine)], spacing: { before: 120, after: 200 } }));

  if (template.scopeIntro) children.push(para(template.scopeIntro));

  children.push(heading('Scope of Work'));
  const specLines = [];
  if (d.productDesign) specLines.push(['Product Design', d.productDesign]);
  if (d.colorFinish) specLines.push(['Color', d.colorFinish]);
  if (d.linearFeet) specLines.push(['Linear Feet', d.linearFeet + ' LF']);
  if (d.wallHeightSpec) specLines.push(['Height', d.wallHeightSpec + 'H']);
  specLines.forEach(([label, value]) => {
    children.push(new Paragraph({ children: [new TextRun({ text: label + ': ', bold: true }), new TextRun(value)], spacing: { after: 40 } }));
  });
  if (template.scopeSteps) children.push(...titledBlocks(template.scopeSteps, { numbered: true }));

  // One Items/Description table per cost-breakdown section — no per-item
  // pricing anywhere; only the single grand total below every table.
  d.sections.filter((sec) => sec.items.length).forEach((sec) => {
    children.push(new Paragraph({ children: [new TextRun({ text: sec.name, bold: true })], spacing: { before: 220, after: 80 } }));
    const rows = [new TableRow({
      children: [cell('Items', { bold: true, width: 30 }), cell('Description', { bold: true, width: 70 })]
    })];
    sec.items.forEach((item) => {
      const cols = proposalItemColumns(item);
      rows.push(new TableRow({ children: [cell(cols.items), cell(cols.description)] }));
    });
    children.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows }));
  });

  children.push(new Paragraph({
    children: [new TextRun({ text: 'Total price:    ' + money(dealClientPrice(d)), bold: true })],
    spacing: { before: 200, after: 200 }
  }));

  if (template.conditions) {
    children.push(heading('Project Conditions & Requirements'));
    children.push(...titledBlocks(template.conditions, { numbered: true }));
  }
  if (template.exclusions) {
    children.push(heading('Conditions & Exclusions'));
    children.push(para('This proposal excludes:'));
    children.push(...bulleted(template.exclusions));
  }
  if (template.legalProtections) {
    children.push(heading('Legal Protections'));
    children.push(...titledBlocks(template.legalProtections, { numbered: true }));
  }
  if (template.nextSteps) {
    children.push(coloredHeading('Next Steps — Partnering for a Smooth Build'));
    children.push(para('We appreciate the opportunity to work with you. Our goal is to make this process simple, stress-free, and dialed-in from day one. Here’s how we move forward together:'));
    children.push(...titledBlocks(template.nextSteps, { numbered: true, titleColor: '2E74B5' }));
  }

  children.push(coloredHeading('Let’s Get Started'));
  children.push(para("To move forward, just reply to this proposal or contact our team directly. We're here to walk you through every step and ensure a smooth, on-time, on-budget build."));
  children.push(para('I confirm that my action here represents my electronic signature and is binding.'));
  children.push(para('Signature: _______________________________          Date: ______________'));
  children.push(para('Printed Name: ___________________________'));

  const doc = new Document({ sections: [{ children }] });
  return Packer.toBlob(doc);
}

// Mirrors the printed "APC / CFI Sales to Project Coordinator Handoff
// Checklist" — checkbox glyphs (☐/☑) stand in for real form checkboxes,
// same as the original PDF uses, since docx has no native checkbox control.
async function buildHandoffDocx(docxLib, d) {
  const { Document, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, ShadingType, Packer } = docxLib;
  const h = d.handoff || blankHandoff(d);
  const NAVY = '1F3864';

  function cell(text, opts) {
    opts = opts || {};
    const runOpts = { text: text, bold: !!opts.bold };
    if (opts.color) runOpts.color = opts.color;
    const params = { children: [new Paragraph({ children: [new TextRun(runOpts)], alignment: opts.align || AlignmentType.LEFT })] };
    if (opts.width) params.width = { size: opts.width, type: WidthType.PERCENTAGE };
    if (opts.shading) params.shading = { fill: opts.shading, type: ShadingType.CLEAR, color: 'auto' };
    return new TableCell(params);
  }

  function checklistTable(items) {
    const rows = [new TableRow({
      children: [
        cell('', { width: 8, shading: NAVY }),
        cell('Checklist Item', { bold: true, color: 'FFFFFF', shading: NAVY, width: 52 }),
        cell('Notes', { bold: true, color: 'FFFFFF', shading: NAVY, width: 40 })
      ]
    })];
    items.forEach(([key, label]) => {
      const item = h.items[key] || { checked: false, notes: '' };
      rows.push(new TableRow({
        children: [
          cell(item.checked ? '☑' : '☐', { align: AlignmentType.CENTER }),
          cell(label),
          cell(item.notes || '')
        ]
      }));
    });
    return new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows });
  }

  function heading(text) {
    return new Paragraph({ children: [new TextRun({ text, bold: true })], spacing: { before: 260, after: 100 } });
  }
  function para(text) {
    return new Paragraph({ children: [new TextRun(text || '')], spacing: { after: 100 } });
  }
  function fieldLine(label, value) {
    return para(label + ': ' + (value || ''));
  }

  const children = [];
  children.push(new Paragraph({ text: 'APC / CFI', alignment: AlignmentType.CENTER, heading: HeadingLevel.HEADING_2 }));
  children.push(new Paragraph({ text: 'Sales to Project Coordinator Handoff Checklist', alignment: AlignmentType.CENTER, heading: HeadingLevel.HEADING_1, spacing: { after: 240 } }));

  children.push(para('Project: ' + (d.customerName || '') + (d.company ? ' — ' + d.company : '') + '     Buildertrend #: ' + (d.jobNumber || '')));
  children.push(para('Salesperson: ' + (d.repName || '') + '     Project Coordinator: ' + (h.projectCoordinator || '')));

  HANDOFF_SECTIONS.forEach(sec => {
    children.push(heading(sec.title));
    children.push(checklistTable(sec.items));
  });

  children.push(heading('Sales Project Briefing (Required)'));
  children.push(para('1. What is the biggest risk on this project?'));
  children.push(para(h.briefing.biggestRisk));
  children.push(para("2. What is the customer's biggest expectation?"));
  children.push(para(h.briefing.customerExpectation));
  children.push(para('3. What could cause a Change Order?'));
  children.push(para(h.briefing.changeOrderRisk));
  children.push(para('4. Is there anything Operations needs to know that is NOT obvious from the plans or proposal?'));
  children.push(para(h.briefing.opsNotes));
  children.push(para('5. Schedule & Customer Commitments'));
  children.push(para('Start: ' + (h.briefing.scheduleStart || '') + '   Finish: ' + (h.briefing.scheduleFinish || '') + '   Promised Dates: ' + (h.briefing.promisedDates || '')));
  children.push(para('Scheduling Constraints (HOA / City / Access / Deliveries / Other): ' + (h.briefing.schedulingConstraints || '')));
  children.push(para('Promises Made to Customer:'));
  children.push(para(h.briefing.promisesToCustomer));

  children.push(heading('Final Certification'));
  HANDOFF_CERTIFICATION_ITEMS.forEach(([key, label]) => {
    children.push(para((h.certification[key] ? '☑ ' : '☐ ') + label));
  });

  children.push(heading('Sign-Off'));
  children.push(fieldLine('Salesperson', h.signatures.salesperson));
  children.push(fieldLine('Date', h.signatures.salespersonDate));
  children.push(fieldLine('Project Coordinator', h.signatures.pc));
  children.push(fieldLine('Date', h.signatures.pcDate));
  children.push(fieldLine('Operations Approval', h.signatures.opsApproval));
  children.push(fieldLine('Date', h.signatures.opsDate));

  const doc = new Document({ sections: [{ children }] });
  return Packer.toBlob(doc);
}

// Mirrors the company's printed "Intake Sheet" — logo, project info,
// "Submit to Production Manager", and a component-quantity table pulled
// from a saved Material Estimate. No pricing anywhere; production only
// needs physical takeoff counts.
async function buildIntakeDocx(docxLib, d, est) {
  const { Document, Paragraph, TextRun, ImageRun, AlignmentType, Table, TableRow, TableCell, WidthType, Packer } = docxLib;
  const fields = computeIntakeFields(d, est);

  function cell(text, opts) {
    opts = opts || {};
    const params = { children: [new Paragraph({ children: [new TextRun({ text: text, bold: !!opts.bold })] })] };
    if (opts.width) params.width = { size: opts.width, type: WidthType.PERCENTAGE };
    return new TableCell(params);
  }
  function centered(text, opts) {
    opts = opts || {};
    return new Paragraph({ children: [new TextRun({ text, bold: !!opts.bold })], alignment: AlignmentType.CENTER, spacing: { after: opts.after != null ? opts.after : 120 } });
  }
  function row(label, value) {
    return new TableRow({ children: [cell(label, { bold: true, width: 60 }), cell(value, { width: 40 })] });
  }

  const children = [];
  try {
    const logoData = await loadLetterheadLogo();
    children.push(new Paragraph({
      children: [new ImageRun({ data: logoData, transformation: { width: COMPANY_LETTERHEAD.logoWidth, height: COMPANY_LETTERHEAD.logoHeight }, type: 'png' })],
      alignment: AlignmentType.CENTER,
      spacing: { after: 120 }
    }));
  } catch (e) {
    // Logo is a nice-to-have — the sheet is still complete without it.
  }

  children.push(centered(fields.projectInfo));
  children.push(centered('Submit to Production Manager'));
  children.push(centered('PLEASE INCLUDE IF ANY, THE ENGINEERING PLANS', { bold: true, after: 240 }));

  children.push(new Table({
    width: { size: 100, type: WidthType.PERCENTAGE },
    rows: [
      row('Total length and height of wall', fields.wallLengthHeight),
      row('Integral color or paint? If integral what color?', fields.color),
      row('Total panels needed if retaining is required include quantity separate from the regular panels.', fields.panelsNeeded),
      row('Total post needed including height if it is more than our standard additional 2’ and how many lines, ends, and corner post. If retaining is required include quantity separate from the regular post.', fields.postsNeeded),
      row('Total post caps needed including how many line, end, and corner post caps.', fields.postCapsNeeded),
      row('How many panel caps are needed?', fields.panelCapsNeeded)
    ]
  }));

  const doc = new Document({ sections: [{ children }] });
  return Packer.toBlob(doc);
}

  // Editing Margin % directly back-solves the Markup % needed to hit that margin,
  // so either field can be used to drive pricing and they stay in sync.
  updateItemMargin(secId, itemId, value) {
    const s = draftDeal.sections.find(s => s.id === secId);
    const item = s && s.items.find(i => i.id === itemId);
    if (!item) return;

    const qty = Number(item.qty) || 0;
    const unitCost = Number(item.unitCost) || 0;
    const builderCost = qty * unitCost;

    let margin = Number(value);
    if (isNaN(margin)) margin = 0;
    margin = Math.min(margin, 99.9); // 100%+ margin implies infinite price, not solvable

    let markup = Number(item.markupPercent) || 0;
    if (builderCost > 0 && unitCost > 0 && qty > 0) {
      const clientPrice = builderCost / (1 - margin / 100);
      const unitPrice = clientPrice / qty;
      markup = (unitPrice / unitCost - 1) * 100;
    }
    item.markupPercent = markup;

    const markupInput = document.getElementById('markupinput-' + itemId);
    if (markupInput && document.activeElement !== markupInput) {
      markupInput.value = Math.round(markup * 100) / 100;
    }
    this.refreshTotals(secId, itemId);
  },

  refreshTotals(secId, itemId) {
    // Refresh the single edited row's computed cells (preserves input focus).
    if (secId && itemId) {
      const s = draftDeal.sections.find(s => s.id === secId);
      const item = s && s.items.find(i => i.id === itemId);
      if (item) {
        const c = itemCalc(item);
        const upEl = document.getElementById('itemup-' + itemId);
        const bcEl = document.getElementById('itembc-' + itemId);
        const cpEl = document.getElementById('itemcp-' + itemId);
        const mgEl = document.getElementById('itemmg-' + itemId);
        const pfEl = document.getElementById('itempf-' + itemId);
        if (upEl) upEl.textContent = money(c.unitPrice);
        if (bcEl) bcEl.textContent = money(c.builderCost);
        if (cpEl) cpEl.textContent = money(c.clientPrice);
        if (mgEl && document.activeElement !== mgEl) mgEl.value = Math.round(c.margin * 100) / 100;
        if (pfEl) pfEl.textContent = money(c.profit);
      }
    }
    // Refresh section subtotals.
    draftDeal.sections.forEach(s => {
      const t = sectionTotals(s);
      const bcEl = document.getElementById('sec-bc-' + s.id);
      const cpEl = document.getElementById('sec-cp-' + s.id);
      const mgEl = document.getElementById('sec-mg-' + s.id);
      const pfEl = document.getElementById('sec-pf-' + s.id);
      if (bcEl) bcEl.textContent = money(t.builderCost);
      if (cpEl) cpEl.textContent = money(t.clientPrice);
      if (mgEl) mgEl.textContent = sectionMargin(t).toFixed(1) + '%';
      if (pfEl) pfEl.textContent = money(t.profit);
    });
    // Refresh deal grand totals.
    const dt = dealTotals(draftDeal);
    const bcEl = document.getElementById('grand-buildercost');
    const cpEl = document.getElementById('grand-clientprice');
    const mgEl = document.getElementById('grand-margin');
    const pfEl = document.getElementById('grand-profit');
    if (bcEl) bcEl.textContent = money(dt.builderCost);
    if (cpEl) cpEl.textContent = money(dt.clientPrice);
    if (mgEl) mgEl.textContent = dealMargin(draftDeal).toFixed(1) + '%';
    if (pfEl) pfEl.textContent = money(dt.profit);
  },

  async importEstimateFile(fileList) {
    const file = fileList && fileList[0];
    if (!file) return;
    const hasExistingItems = draftDeal.sections.some(s => s.items.length > 0);
    if (hasExistingItems && !confirm('Importing will replace the cost breakdown sections below with the line items from this file. Continue?')) {
      return;
    }
    try {
      const XLSX = await import('https://unpkg.com/xlsx@0.18.5/xlsx.mjs');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const sections = parseEstimateRows(rows);
      if (!sections.length) {
        alert("Could not find any cost line items in that file — double check it's an estimate/cost report export.");
        return;
      }
      draftDeal.sections = sections;
      render();
      const itemCount = sections.reduce((n, s) => n + s.items.length, 0);
      alert(`Imported ${itemCount} line item(s) across ${sections.length} section(s). Customer name, contact info, and address still need to be filled in manually — this file only contains cost data.`);
    } catch (e) {
      alert("Could not read that file — make sure it's a .xls or .xlsx estimate export.");
    }
  },

  async handleFiles(fileList) {
    const files = Array.from(fileList || []);
    for (const file of files) {
      try {
        const dataUrl = await processAttachmentFile(file);
        draftDeal.attachments.push({
          id: uid('att'),
          name: file.name || 'file',
          dataUrl,
          mimeType: file.type || '',
          category: guessAttachmentCategory(file),
          description: '',
          addedAt: Date.now()
        });
      } catch (e) {
        alert('Could not attach "' + (file.name || 'that file') + '" — try a different file.');
      }
    }
    render();
  },

  // Gate: nothing reaches Sandy/Connor's queue until it clears every CFI SOP
