<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Report</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1C2B36">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #1C2B36;
    --ink-soft: #3D4E5C;
    --muted: #6B7A85;
    --line: #DCE2E6;
    --field: #F6F7F5;
    --paper: #FFFFFF;
    --panel-alt: #EEF1F0;
    --row-border: #EFF2F3;
    --amber: #C8791E;
    --amber-soft: #F3E2CC;
    --green: #2F6B4F;
    --green-soft: #DCEAE2;
    --red: #A83A3A;
    --red-soft: #F3DEDE;
    --steel: #1C2B36;
    --radius: 6px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --shadow-xs: 0 1px 2px rgba(16,23,29,0.05);
    --shadow-sm: 0 1px 3px rgba(16,23,29,0.07), 0 1px 2px rgba(16,23,29,0.05);
    --shadow-md: 0 3px 8px rgba(16,23,29,0.10), 0 1px 3px rgba(16,23,29,0.06);
    --shadow-lg: 0 10px 28px rgba(16,23,29,0.18), 0 3px 10px rgba(16,23,29,0.08);
    --inset-shadow: inset 0 1px 2px rgba(16,23,29,0.05);
    --highlight: rgba(255,255,255,0.14);

    /* chart series — fixed categorical order (dataviz skill default palette) */
    --c-blue: #2a78d6;
    --c-orange: #eb6834;
    --c-aqua: #1baf7a;
    --c-yellow: #eda100;
    --c-magenta: #e87ba4;
    --c-green: #008300;
    --c-violet: #4a3aa7;
    --c-red: #e34948;
    --c-other: #9aa5ab;
    --grid-line: #e3e8ea;
    --axis-line: #c7cfd3;
  }

  body.dark {
    --ink: #E7ECEF;
    --ink-soft: #C3CDD3;
    --muted: #8A98A3;
    --line: #2B3640;
    --field: #10171D;
    --paper: #1A222A;
    --panel-alt: #222B33;
    --row-border: #26313A;
    --amber: #E0954A;
    --amber-soft: #3A2E1D;
    --green: #6FBF97;
    --green-soft: #16281F;
    --red: #E08080;
    --red-soft: #3A2020;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.30);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.40), 0 1px 2px rgba(0,0,0,0.30);
    --shadow-md: 0 4px 10px rgba(0,0,0,0.48), 0 1px 4px rgba(0,0,0,0.35);
    --shadow-lg: 0 14px 32px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.40);
    --inset-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
    --highlight: rgba(255,255,255,0.05);

    --c-blue: #3987e5;
    --c-orange: #d95926;
    --c-aqua: #199e70;
    --c-yellow: #c98500;
    --c-magenta: #d55181;
    --c-green: #3fae3f;
    --c-violet: #9085e9;
    --c-red: #e66767;
    --c-other: #5b6b73;
    --grid-line: #2b3640;
    --axis-line: #3d4e5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--field);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  header.topbar {
    background: var(--steel);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 3;
  }
  header.topbar .brand { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  header.topbar .brand .title { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
  header.topbar .brand .subtitle { font-size: 12.5px; color: #9FB0BC; }
  header.topbar .nav { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; }

  .brand-strip { text-align: center; padding: 14px 0 0; }
  .brand-strip img { max-height: 46px; }

  .btn {
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    transition: filter 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:active { filter: brightness(0.88); transform: translateY(1px); box-shadow: none !important; }
  .btn-primary { background: linear-gradient(180deg, var(--highlight), rgba(0,0,0,0)), var(--amber); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { box-shadow: var(--shadow-md); }
  .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
  .btn-outline { background: var(--paper); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-xs); }
  .btn-small { padding: 5px 10px; font-size: 12.5px; }
  .btn-outline.active { border-color: var(--amber); color: var(--amber); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .icon-btn { width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .settings-wrap { position: relative; }
  .settings-menu {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; min-width: 200px;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 8px; flex-direction: column; gap: 2px; z-index: 20;
  }
  .settings-menu.open { display: flex; }
  .settings-menu-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    color: var(--ink); font-family: var(--sans); font-size: 14px; font-weight: 600;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
  }
  .settings-menu-item:hover { background: var(--panel-alt); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,15,20,0.55); z-index: 60;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow-lg);
    padding: 22px 24px; max-width: 480px; width: 100%; max-height: 82vh; overflow-y: auto;
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 16px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
  .tab-settings-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--row-border);
  }
  .tab-settings-row .order-btns { display: flex; flex-direction: column; gap: 1px; }
  .tab-settings-row .order-btns button {
    width: 22px; height: 18px; line-height: 1; font-size: 10px; padding: 0;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 3px; cursor: pointer;
  }
  .tab-settings-row .order-btns button:disabled { opacity: 0.3; cursor: not-allowed; }
  .tab-settings-row input[type=text] { flex: 1; min-width: 0; }
  .tab-settings-row label.hide-toggle { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .tab-settings-row label.hide-toggle input { width: 15px; height: 15px; cursor: pointer; }

  main { max-width: min(1400px, 97vw); margin: 0 auto; padding: 24px 28px 80px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { padding: 9px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; border-left: none; border-right: none; border-top: none; font-family: var(--sans); }
  .tab.active { color: var(--ink); border-bottom-color: var(--amber); }

  .year-toggle { display: flex; gap: 6px; }

  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .panel h2 { font-size: 15px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-soft); }
  .panel .panel-sub { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-xs); }
  .kpi-card .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); margin-bottom: 6px; }
  .kpi-card .kpi-value { font-family: var(--mono); font-size: 21px; font-weight: 700; line-height: 1.2; }
  .kpi-card .kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

  .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12.5px; color: var(--ink-soft); }
  .chart-legend .swatch { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .chart-wrap { position: relative; }
  svg.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-bar { cursor: pointer; transition: opacity 0.1s ease; }
  .chart-bar:hover { opacity: 0.82; }
  .chart-dot { cursor: pointer; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; }
  .axis-baseline { stroke: var(--axis-line); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 10.5px; font-family: var(--sans); }
  .chart-line { fill: none; stroke-width: 2; }

  #chart-tip {
    position: fixed;
    display: none;
    pointer-events: none;
    background: var(--steel);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 4px;
    box-shadow: var(--shadow-md);
    z-index: 50;
    white-space: nowrap;
  }

  .field-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .field-row input[type=text], .field-row select { width: auto; min-width: 160px; }

  input[type=text], input[type=file], select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--inset-shadow);
  }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: var(--amber); }

  .table-scroll { overflow-x: auto; }
  table.report { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.report th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  table.report th.sorted { color: var(--amber); }
  table.report th .arrow { font-size: 9px; margin-left: 2px; }
  table.report td { padding: 7px 10px; border-bottom: 1px solid var(--row-border); vertical-align: middle; }
  table.report td.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
  table.report tbody tr:hover td { background: var(--panel-alt); }
  table.report .stage-pill {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px;
    border-radius: 10px; white-space: nowrap;
  }
  table.report .stage-won { background: var(--green-soft); color: var(--green); }
  table.report .stage-payment { background: var(--amber-soft); color: var(--amber); }
  table.report .stage-other { background: var(--panel-alt); color: var(--muted); }

  table.report tr.month-group-header td {
    background: #1F3864; color: #fff; font-weight: 700; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.4px; padding: 8px 10px;
  }
  table.report tr.month-group-header .gap-flag {
    margin-left: 10px; font-weight: 600; text-transform: none; letter-spacing: normal;
    color: #ffd699; font-size: 11.5px; cursor: help;
  }
  table.report tr.month-group-total td {
    background: var(--panel-alt); font-weight: 700; font-family: var(--mono);
    border-bottom: 2px solid var(--line);
  }
  table.report tr.month-group-total td:first-child { font-family: var(--sans); }

  .mat-bar-row { display: grid; grid-template-columns: 130px 1fr 90px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .mat-bar-row .mat-name { text-align: right; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mat-bar-track { background: var(--panel-alt); border-radius: 3px; overflow: hidden; height: 16px; }
  .mat-bar-fill { height: 100%; border-radius: 3px; }
  .mat-bar-amount { font-family: var(--mono); text-align: right; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }

  .footnote { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .stat-strip { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat-strip .stat .stat-label { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .stat-strip .stat .stat-value { font-family: var(--mono); font-size: 18px; font-weight: 700; }
  .stat-strip .stat .stat-sub { font-size: 11px; color: var(--muted); }

  .month-select-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .month-select-row select { min-width: 200px; }

  table.grid-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.grid-table th, table.grid-table td { padding: 7px 10px; border-bottom: 1px solid var(--row-border); white-space: nowrap; }
  table.grid-table th { background: #1F3864; color: #fff; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; text-align: right; }
  table.grid-table th:first-child { text-align: left; background: #16294a; }
  table.grid-table td:first-child { text-align: left; font-weight: 600; color: var(--ink-soft); background: var(--panel-alt); position: sticky; left: 0; }
  table.grid-table td { text-align: right; font-family: var(--mono); }
  table.grid-table td.ytd, table.grid-table th.ytd { background: var(--panel-alt); font-weight: 700; }
  table.grid-table tr.strong td { font-weight: 700; }
  table.grid-table tr.spacer td { border: none; padding: 4px; background: transparent; }
  table.grid-table input.grid-edit {
    width: 100%; min-width: 84px; text-align: right; border: 1px solid transparent; background: transparent;
    color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 3px 4px; border-radius: 3px; box-shadow: none;
  }
  table.grid-table input.grid-edit:hover { border-color: var(--line); }
  table.grid-table input.grid-edit:focus { outline: none; border-color: var(--amber); background: var(--paper); }

  .storage-banner { padding: 10px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px; font-weight: 600; }
  .storage-banner.error { background: var(--red-soft); color: var(--red); }
  .storage-banner.info { background: var(--amber-soft); color: var(--amber); }

  .upload-preview-table { margin-top: 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; align-items: end; }
  .form-grid label { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

  @media (max-width: 640px) {
    main { padding: 18px 14px 60px; }
    .panel { padding: 16px 16px; }
    header.topbar { padding: 14px 16px; }
    .mat-bar-row { grid-template-columns: 90px 1fr 70px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="brand-strip">
  <img src="fence-installers-logo.png" alt="Fence Installers">
</div>
<header class="topbar">
  <div class="brand">
    <div class="title">APC Sales Report</div>
    <div class="subtitle">Closed deals, materials &amp; pipeline &mdash; from HubSpot</div>
  </div>
  <div class="nav">
    <div class="year-toggle" id="year-toggle"></div>
    <a class="btn btn-ghost" href="index.html">Deal Board &rarr;</a>
    <div class="settings-wrap">
      <button class="btn btn-ghost icon-btn" id="settings-btn" onclick="toggleSettingsMenu(event)" title="Settings">⚙️</button>
      <div class="settings-menu" id="settings-menu">
        <button class="settings-menu-item" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
        <button class="settings-menu-item" onclick="closeSettingsMenu(); App.openTabSettings();">Customize Tabs</button>
      </div>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="chart-tip"></div>

<div id="tab-settings-overlay" class="modal-overlay" onclick="if (event.target === this) App.closeTabSettings();">
  <div class="modal-card">
    <h3>Customize Tabs</h3>
    <p class="panel-sub">Reorder, rename, or hide tabs. Saved on this device.</p>
    <div id="tab-settings-list"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-small" onclick="App.resetTabs()">Reset to Defaults</button>
      <button class="btn btn-primary" onclick="App.closeTabSettings()">Done</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

  // Same Firebase project as the Deal Approval Board (index.html), so this
  // page's live data (uploads, collections, overrides) is shared across
  // devices the same way deals already are there. New collection names —
  // if Firestore Rules deny them, saves fail with a clear error instead of
  // a silent no-op; see the graceful-degrade fallback in the classic script.
  const firebaseConfig = {
    apiKey: "AIzaSyDDHjIX-V_DwizD85TzwvcjuDPu1lMZoSc",
    authDomain: "apc-approvals.firebaseapp.com",
    projectId: "apc-approvals",
    storageBucket: "apc-approvals.firebasestorage.app",
    messagingSenderId: "170502222959",
    appId: "1:170502222959:web:2a9b4345c3ac9bef8b099a",
    measurementId: "G-X2P3DWF9DD"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);
  const auth = getAuth(firebaseApp);

  try {
    await Promise.race([
      signInAnonymously(auth),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timed out')), 8000))
    ]);
  } catch (e) {
    console.error('Anonymous sign-in failed:', e);
  }

  const uploadsCollRef = collection(db, 'salesReportUploads');
  const collectionsCollRef = collection(db, 'salesReportCollections');
  const overridesCollRef = collection(db, 'salesReportOverrides');

  window.__srSaveUpload = async function (monthKey, deals, fileName) {
    try {
      await setDoc(doc(uploadsCollRef, monthKey), { month: monthKey, deals, fileName: fileName || '', uploadedAt: Date.now() });
      return { ok: true };
    } catch (e) {
      console.error('Sales report upload save failed:', e);
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__srDeleteUpload = async function (monthKey) {
    try {
      await deleteDoc(doc(uploadsCollRef, monthKey));
      return { ok: true };
    } catch (e) {
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__srSubscribeUploads = function (onData, onError) {
    onSnapshot(uploadsCollRef, (snap) => {
      const out = {};
      snap.forEach(d => { out[d.id] = d.data(); });
      onData(out);
    }, (err) => { console.error('Sales report uploads listen error:', err); if (onError) onError(err); });
  };

  window.__srSaveCollection = async function (entry) {
    try {
      await setDoc(doc(collectionsCollRef, entry.id), entry);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__srDeleteCollection = async function (id) {
    try {
      await deleteDoc(doc(collectionsCollRef, id));
      return { ok: true };
    } catch (e) {
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__srSubscribeCollections = function (onData, onError) {
    onSnapshot(collectionsCollRef, (snap) => {
      const out = [];
      snap.forEach(d => out.push(d.data()));
      onData(out);
    }, (err) => { console.error('Sales report collections listen error:', err); if (onError) onError(err); });
  };

  window.__srSaveOverride = async function (monthKey, field, value) {
    try {
      await setDoc(doc(overridesCollRef, monthKey), { month: monthKey, [field]: value }, { merge: true });
      return { ok: true };
    } catch (e) {
      return { ok: false, error: (e && e.message) || String(e) };
    }
  };

  window.__srSubscribeOverrides = function (onData, onError) {
    onSnapshot(overridesCollRef, (snap) => {
      const out = {};
      snap.forEach(d => { out[d.id] = d.data(); });
      onData(out);
    }, (err) => { console.error('Sales report overrides listen error:', err); if (onError) onError(err); });
  };

  // Merge saved order/labels/hidden with the known tab ids — drops any
  // stale id from an older version, appends any new one at the end.
  const byId = new Map(DEFAULT_TABS.map(t => [t.id, t]));
  const merged = saved.filter(t => byId.has(t.id)).map(t => ({
    id: t.id, label: t.label || byId.get(t.id).label, hidden: !!t.hidden,
  }));
  DEFAULT_TABS.forEach(t => { if (!merged.some(m => m.id === t.id)) merged.push({ ...t, hidden: false }); });
  return merged;
}
function saveTabs() {
  try { localStorage.setItem('sr_tabs', JSON.stringify(state.tabs)); } catch (e) {}
}

if (!state.tabs.some(t => t.id === state.tab && !t.hidden)) {

// live.mode: 'connecting' | 'cloud' | 'local' (Firebase unreachable/denied —
// falls back to this browser's localStorage only, see loadLocalFallback()).
const live = { uploads: {}, collections: [], overrides: {}, mode: 'connecting', error: '' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function money(n, decimals) {
  n = Number(n) || 0;
  const d = decimals == null ? 0 : decimals;
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function moneyCompact(n) {
  n = Number(n) || 0;
  const abs = Math.abs(n);
  if (abs >= 1000000) return '$' + (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (abs >= 1000) return '$' + (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return '$' + Math.round(n);
}

function pct(n, decimals) {
  n = Number(n) || 0;
  return (n * 100).toFixed(decimals == null ? 1 : decimals) + '%';
}

function num(n) {
  return (Number(n) || 0).toLocaleString('en-US');
}

function dateStr(s) {
  if (!s) return '—';
  // most close dates are plain 'YYYY-MM-DD'; a handful of source rows store
  // a full ISO datetime instead — handle both without re-interpreting the
  // date-only form in the browser's local timezone.
  const datePart = s.slice(0, 10);
  const d = new Date(datePart + 'T00:00:00');
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function parseMoneyCell(v) {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/[$,]/g, ''));
  return isNaN(n) ? 0 : n;
}

// ---------------------------------------------------------------------------
// Month-key helpers — a month key is always "<MONTHNAME> <YEAR>", e.g.
// "AUGUST 2026", matching the format already used in the parsed deal ledger.
// ---------------------------------------------------------------------------
function monthKeyOf(name, year) { return `${name} ${year}`; }
function monthYearOf(monthKey) { return monthKey.slice(-4); }
function monthNameOf(monthKey) { return monthKey.slice(0, monthKey.length - 5); }
function monthSortValue(monthKey) {
  const year = parseInt(monthYearOf(monthKey), 10);
  const idx = MONTH_NAMES.indexOf(monthNameOf(monthKey));
  return year * 12 + (idx === -1 ? 0 : idx);
}
function currentMonthKey() {
  const d = new Date();
  return monthKeyOf(MONTH_NAMES[d.getMonth()], d.getFullYear());
}
function titleCaseMonth(monthKey) {
  const name = monthNameOf(monthKey);
  return name.charAt(0) + name.slice(1).toLowerCase() + ' ' + monthYearOf(monthKey);
}
function shortMonth(m) {
  return m.slice(0, 3).charAt(0) + m.slice(1, 3).toLowerCase();
}
function knownMonthKeys() {
  const set = new Set();
  YEARS.forEach(y => (SALES_DATA.years[y].monthNames || []).forEach(mn => set.add(monthKeyOf(mn, y))));
  Object.keys(live.uploads).forEach(k => set.add(k));
  // always include the current calendar month, so a collection can be
  // logged against it even before any deals have been uploaded for it.
  set.add(currentMonthKey());
  return Array.from(set).sort((a, b) => monthSortValue(a) - monthSortValue(b));
}

// ---------------------------------------------------------------------------
// Chart builders — inline SVG, no external deps
// ---------------------------------------------------------------------------
function chartColor(varName) {
  return getComputedStyle(document.body).getPropertyValue(varName).trim() || '#888';
}

function barChart(categories, values, opts) {
  opts = opts || {};
  const w = 900, h = opts.height || 220;
  const padL = opts.padL || 46, padR = 12, padT = 14, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...values.map(v => Math.abs(v) || 0)) * 1.15;
  const n = Math.max(1, categories.length);
  const slot = innerW / n;
  const bw = Math.max(2, slot * 0.62);
  const color = opts.color || 'var(--c-blue)';
  const valFmt = opts.valFmt || (v => v);
  let out = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const val = max * i / ticks;
    const y = padT + innerH - (val / max) * innerH;
    out += `<line x1="${padL}" x2="${w - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid-line"/>`;
    out += `<text x="${padL - 8}" y="${(y + 3).toFixed(1)}" class="axis-label" text-anchor="end">${esc(opts.tickFmt ? opts.tickFmt(val) : Math.round(val))}</text>`;
  }
  categories.forEach((cat, i) => {
    const v = values[i] || 0;
    const bh = max ? (Math.abs(v) / max) * innerH : 0;
    const x = padL + i * slot + (slot - bw) / 2;
    const y = padT + innerH - bh;
    out += `<rect data-tip="${esc(cat)}: ${esc(valFmt(v))}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, 1).toFixed(1)}" rx="4" fill="${color}" class="chart-bar"/>`;
    out += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - 8}" class="axis-label" text-anchor="middle">${esc(cat)}</text>`;
  });
  out += `<line x1="${padL}" x2="${w - padR}" y1="${(padT + innerH).toFixed(1)}" y2="${(padT + innerH).toFixed(1)}" class="axis-baseline"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">${out}</svg>`;
}

function groupedBarChart(categories, series, opts) {
  // series: [{name, color, values}]
  opts = opts || {};
  const w = 900, h = opts.height || 240;
  const padL = 46, padR = 12, padT = 14, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const max = Math.max(1, ...allVals.map(v => Math.abs(v) || 0)) * 1.15;
  const n = Math.max(1, categories.length);
  const slot = innerW / n;
  const groupW = slot * 0.78;
  const barGap = 2;
  const bw = Math.max(1, (groupW - barGap * (series.length - 1)) / series.length);
  const valFmt = opts.valFmt || (v => v);
  let out = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const val = max * i / ticks;
    const y = padT + innerH - (val / max) * innerH;
    out += `<line x1="${padL}" x2="${w - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid-line"/>`;
    out += `<text x="${padL - 8}" y="${(y + 3).toFixed(1)}" class="axis-label" text-anchor="end">${esc(opts.tickFmt ? opts.tickFmt(val) : Math.round(val))}</text>`;
  }
  categories.forEach((cat, i) => {
    const groupX = padL + i * slot + (slot - groupW) / 2;
    series.forEach((s, si) => {
      const v = s.values[i] || 0;
      const bh = max ? (Math.abs(v) / max) * innerH : 0;
      const x = groupX + si * (bw + barGap);
      const y = padT + innerH - bh;
      out += `<rect data-tip="${esc(cat)} — ${esc(s.name)}: ${esc(valFmt(v))}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, 1).toFixed(1)}" rx="3" fill="${s.color}" class="chart-bar"/>`;
    });
    out += `<text x="${(groupX + groupW / 2).toFixed(1)}" y="${h - 8}" class="axis-label" text-anchor="middle">${esc(cat)}</text>`;
  });
  out += `<line x1="${padL}" x2="${w - padR}" y1="${(padT + innerH).toFixed(1)}" y2="${(padT + innerH).toFixed(1)}" class="axis-baseline"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">${out}</svg>`;
}

function lineChart(categories, values, opts) {
  opts = opts || {};
  const w = 900, h = opts.height || 200;
  const padL = 46, padR = 16, padT = 16, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const min = opts.min != null ? opts.min : 0;
  const max = opts.max != null ? opts.max : Math.max(1, ...values.map(v => v || 0)) * 1.2;
  const n = Math.max(1, categories.length - 1);
  const color = opts.color || 'var(--c-blue)';
  const valFmt = opts.valFmt || (v => v);
  let out = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const val = min + (max - min) * i / ticks;
    const y = padT + innerH - ((val - min) / (max - min)) * innerH;
    out += `<line x1="${padL}" x2="${w - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid-line"/>`;
    out += `<text x="${padL - 8}" y="${(y + 3).toFixed(1)}" class="axis-label" text-anchor="end">${esc(opts.tickFmt ? opts.tickFmt(val) : val.toFixed(0))}</text>`;
  }
  const pts = categories.map((cat, i) => {
    const v = values[i] || 0;
    const x = padL + (n ? (i / n) * innerW : innerW / 2);
    const y = padT + innerH - ((v - min) / (max - min)) * innerH;
    return { x, y, cat, v };
  });
  out += `<polyline class="chart-line" points="${pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}" stroke="${color}"/>`;
  pts.forEach(p => {
    out += `<circle data-tip="${esc(p.cat)}: ${esc(valFmt(p.v))}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}" class="chart-dot"/>`;
  });
  categories.forEach((cat, i) => {
    const x = padL + (n ? (i / n) * innerW : innerW / 2);
    out += `<text x="${x.toFixed(1)}" y="${h - 8}" class="axis-label" text-anchor="middle">${esc(cat)}</text>`;
  });
  out += `<line x1="${padL}" x2="${w - padR}" y1="${(padT + innerH).toFixed(1)}" y2="${(padT + innerH).toFixed(1)}" class="axis-baseline"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">${out}</svg>`;
}

function legendRow(items) {
  return `<div class="chart-legend">${items.map(it =>
    `<span class="swatch"><span class="dot" style="background:${it.color}"></span>${esc(it.name)}</span>`
  ).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// Data model — merges the static parsed-workbook snapshot (SALES_DATA) with
// live data (uploaded months, manual collections, manual overrides). The
// static snapshot never changes at runtime; everything editable lives in
// `live` and is layered on top at render time.
// ---------------------------------------------------------------------------

// Config values the source workbook hardcodes in ~20 formulas — see SPEC.md §1.
const COMMISSION_RATE = 0.005;
const COMMISSION_THRESHOLD = 250000;

// All-or-nothing gate, NOT prorated and NOT applied to only the excess — see
// SPEC.md §3. Applied uniformly to every month (baked or uploaded) as the
// live default, so logging a new collection that pushes a month's Total
// Collected across the threshold updates that month's commission too.
function commissionFor(totalCollected) {
  return totalCollected >= COMMISSION_THRESHOLD ? totalCollected * COMMISSION_RATE : 0;
}

// SPEC.md §3: Outstanding is always DERIVED (Amount − Collected), never
// trusted from a stored/uploaded column. Avg Deal Size = Deal Amount ÷
// Deals (not Revenue ÷ Deals — those coincide only when a month has zero
// Outstanding). Smallest Deal excludes non-positive amounts.
function computeMonthMetrics(deals) {
  const won = deals.filter(d => d.stage && d.stage.indexOf('Closed Won') === 0);
  const paymentCollected = deals.filter(d => d.stage === 'Payment Collected');
  const dealAmount = won.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const outstanding = won.reduce((s, d) => s + ((Number(d.amount) || 0) - (Number(d.collected) || 0)), 0);
  const revenue = dealAmount - outstanding;
  const dealsCount = won.length;
  const amounts = won.map(d => Number(d.amount) || 0);
  const positiveAmounts = amounts.filter(a => a > 0);
  // Outstanding Collected for a month = SUMIF(stage = Payment Collected,
  // collected) among that month's own rows — see SPEC.md §3. This is
  // additive with any manually-logged Collections, not a replacement for them.
  const outstandingCollectedFromRows = paymentCollected.reduce((s, d) => s + (Number(d.collected) || 0), 0);
  return {
    dealAmount, revenue, outstanding,
    deals: dealsCount,
    avgDealSize: dealsCount ? dealAmount / dealsCount : 0,
    largestDeal: amounts.length ? Math.max(...amounts) : 0,
    smallestDeal: positiveAmounts.length ? Math.min(...positiveAmounts) : 0,
    outstandingCollectedFromRows,
  };
}

function collectionsSumFor(monthKey) {
  return live.collections.filter(c => c.month === monthKey).reduce((s, c) => s + (Number(c.amount) || 0), 0);
}

// One row per month, baked (from the workbook) or uploaded (via the Upload
// tab), in chronological order. Manual overrides (Commission/Outstanding)
// and logged collections (Outstanding Collected) are layered on top of both
// kinds identically.
function effectiveMonthly(year) {
  const base = SALES_DATA.years[year] || { monthNames: [], monthly: [] };
  const bakedKeys = base.monthNames.map(mn => monthKeyOf(mn, year));
  const uploadedKeys = Object.keys(live.uploads)
    .filter(k => monthYearOf(k) === String(year) && bakedKeys.indexOf(k) === -1)
    .sort((a, b) => monthSortValue(a) - monthSortValue(b));

  const months = [];

  base.monthNames.forEach((mn, i) => {
    const monthKey = monthKeyOf(mn, year);
    const baked = base.monthly[i];
    const ov = live.overrides[monthKey] || {};
    const outstanding = ov.outstanding != null ? ov.outstanding : baked.outstanding;
    const outstandingCollected = baked.outstandingCollected + collectionsSumFor(monthKey);
    const totalCollected = baked.revenue + outstandingCollected;
    const commission = ov.commission != null ? ov.commission : commissionFor(totalCollected);
    months.push({
      month: monthKey, monthLabel: mn, isUploaded: false,
      dealAmount: baked.dealAmount, revenue: baked.revenue,
      deals: baked.deals, avgDealSize: baked.avgDealSize,
      largestDeal: baked.largestDeal, smallestDeal: baked.smallestDeal,
      commission, outstanding, outstandingCollected, totalCollected,
    });
  });

  uploadedKeys.forEach(monthKey => {
    const upload = live.uploads[monthKey];
    const metrics = computeMonthMetrics(upload.deals || []);
    const ov = live.overrides[monthKey] || {};
    const outstanding = ov.outstanding != null ? ov.outstanding : metrics.outstanding;
    const outstandingCollected = metrics.outstandingCollectedFromRows + collectionsSumFor(monthKey);
    const totalCollected = metrics.revenue + outstandingCollected;
    const commission = ov.commission != null ? ov.commission : commissionFor(totalCollected);
    months.push({
      month: monthKey, monthLabel: monthNameOf(monthKey), isUploaded: true,
      dealAmount: metrics.dealAmount, revenue: metrics.revenue,
      deals: metrics.deals, avgDealSize: metrics.avgDealSize,
      largestDeal: metrics.largestDeal, smallestDeal: metrics.smallestDeal,
      commission, outstanding, outstandingCollected, totalCollected,
    });
  });

  return months;
}

// The full effective dataset for a year: monthly rollups (above), a merged
// deal ledger (baked + uploaded), a merged material breakdown, and a
// recomputed YTD totals row — the shape every render function consumes.
function effectiveYearData(year) {
  const base = SALES_DATA.years[year] || { deals: [], materials: [], materialsTotal: null };
  const monthly = effectiveMonthly(year);
  const monthNames = monthly.map(m => m.monthLabel);

  const uploadedDeals = Object.keys(live.uploads)
    .filter(k => monthYearOf(k) === String(year))
    .sort((a, b) => monthSortValue(a) - monthSortValue(b))
    .flatMap(k => live.uploads[k].deals || []);
  const deals = base.deals.concat(uploadedDeals);

  const matMap = new Map();
  base.materials.forEach(m => matMap.set(m.material, { material: m.material, deals: m.deals, amount: m.amount }));
  uploadedDeals.forEach(d => {
    if (!d.material || !d.stage || d.stage.indexOf('Closed Won') !== 0) return;
    const cur = matMap.get(d.material) || { material: d.material, deals: 0, amount: 0 };
    cur.deals += 1;
    cur.amount += Number(d.amount) || 0;
    matMap.set(d.material, cur);
  });
  const materials = Array.from(matMap.values());
  const materialsAmountTotal = materials.reduce((s, m) => s + m.amount, 0);
  const materialsDealsTotal = materials.reduce((s, m) => s + m.deals, 0);
  materials.forEach(m => { m.pct = materialsAmountTotal ? m.amount / materialsAmountTotal : 0; });
  const materialsTotal = ['TOTAL', materialsDealsTotal, materialsAmountTotal, 1];

  // SPEC.md §4 — YTD Avg Deal Size is recomputed from YTD aggregates (Deal
  // Amount ÷ Deals), NOT an average of the monthly averages. YTD Commission
  // is the SUM of monthly commissions (the $250K gate is per-month and is
  // never re-applied to the yearly total — a month under threshold
  // permanently contributes $0, even if the year clears it). Smallest Deal
  // excludes non-positive amounts.
  const wonAmounts = deals.filter(d => d.stage && d.stage.indexOf('Closed Won') === 0).map(d => Number(d.amount) || 0);
  const positiveWonAmounts = wonAmounts.filter(a => a > 0);
  const totals = monthly.reduce((acc, m) => {
    acc.dealAmount += m.dealAmount; acc.revenue += m.revenue; acc.deals += m.deals;
    acc.commission += m.commission; acc.outstanding += m.outstanding;
    acc.outstandingCollected += m.outstandingCollected; acc.totalCollected += m.totalCollected;
    return acc;
  }, { dealAmount: 0, revenue: 0, deals: 0, commission: 0, outstanding: 0, outstandingCollected: 0, totalCollected: 0 });
  totals.avgDealSize = totals.deals ? totals.dealAmount / totals.deals : 0;
  totals.largestDeal = wonAmounts.length ? Math.max(...wonAmounts) : 0;
  totals.smallestDeal = positiveWonAmounts.length ? Math.min(...positiveWonAmounts) : 0;

  return { year, monthNames, monthly, totals, deals, materials, materialsTotal };
}

// ---------------------------------------------------------------------------
// Live-data persistence — Firestore when reachable, this browser's
// localStorage as a fallback so uploads/collections still work (just not
// shared across devices) if Firebase is unreachable or its rules haven't
// been extended to the three new collections this page uses.
// ---------------------------------------------------------------------------
function loadLocalFallback() {
  try {
    live.uploads = JSON.parse(localStorage.getItem('sr_uploads') || '{}');
    live.collections = JSON.parse(localStorage.getItem('sr_collections') || '[]');
    live.overrides = JSON.parse(localStorage.getItem('sr_overrides') || '{}');
  } catch (e) {}
}
function saveLocalFallback() {
  try {
    localStorage.setItem('sr_uploads', JSON.stringify(live.uploads));
    localStorage.setItem('sr_collections', JSON.stringify(live.collections));
    localStorage.setItem('sr_overrides', JSON.stringify(live.overrides));
  } catch (e) {}
}

function waitForBridge(timeoutMs) {
  return new Promise((resolve) => {
    const start = Date.now();
    (function check() {
      if (window.__srSubscribeUploads) { resolve(true); return; }
      if (Date.now() - start > timeoutMs) { resolve(false); return; }
      setTimeout(check, 100);
    })();
  });
}

async function initLiveData() {
  const ready = await waitForBridge(10000);
  if (!ready) {
    live.mode = 'local';
    live.error = 'Firebase failed to load in this browser.';
    loadLocalFallback();
    render();
    return;
  }
  let uploadsOk = false, collectionsOk = false, overridesOk = false;
  const maybeGoCloud = () => {
    if (uploadsOk && collectionsOk && overridesOk && live.mode === 'connecting') live.mode = 'cloud';
  };
  const onErr = (err) => {
    live.mode = 'local';
    live.error = (err && err.message) || String(err);
    loadLocalFallback();
    render();
  };
  window.__srSubscribeUploads((data) => { live.uploads = data; uploadsOk = true; maybeGoCloud(); render(); }, onErr);
  window.__srSubscribeCollections((data) => { live.collections = data; collectionsOk = true; maybeGoCloud(); render(); }, onErr);
  window.__srSubscribeOverrides((data) => { live.overrides = data; overridesOk = true; maybeGoCloud(); render(); }, onErr);
}

function renderStorageBanner() {
  if (live.mode === 'cloud') return '';
  if (live.mode === 'connecting') return `<div class="storage-banner info">Connecting to shared storage…</div>`;
  return `<div class="storage-banner error">Uploads and collections are only being saved on this device right now (${esc(live.error || 'shared storage unavailable')}) — they won't show up elsewhere until this is fixed.</div>`;
}

      <div class="mat-bar-row">

function stagePill(stage) {
  if (!stage) return `<span class="stage-pill stage-other">—</span>`;
  if (stage.indexOf('Closed Won') === 0) return `<span class="stage-pill stage-won">Closed Won</span>`;
  if (stage.indexOf('Payment Collected') === 0) return `<span class="stage-pill stage-payment">Payment Collected</span>`;
  return `<span class="stage-pill stage-other">${esc(stage)}</span>`;
}

function renderDeals() {
  const yd = effectiveYearData(state.year);
  const monthKeys = Array.from(new Set(yd.deals.map(d => d.month))).sort((a, b) => monthSortValue(a) - monthSortValue(b));

  let rows = yd.deals.filter(d => {
    if (state.dealMonth !== 'all' && d.month !== state.dealMonth) return false;
    if (state.dealStage !== 'all' && d.stage !== state.dealStage) return false;
    if (state.dealSearch) {
      const q = state.dealSearch.toLowerCase();
      const hay = `${d.name || ''} ${d.material || ''} ${d.owner || ''}`.toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  const { key, dir } = state.dealSort;
  rows = rows.slice().sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'closeDate') { av = av || ''; bv = bv || ''; }
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av == null) av = '';
    if (bv == null) bv = '';
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  const stages = Array.from(new Set(yd.deals.map(d => d.stage))).filter(Boolean);

  const col = (key2, label) => {
    const sorted = state.dealSort.key === key2;
    const arrow = sorted ? (state.dealSort.dir === 'asc' ? '↑' : '↓') : '';
    return `<th class="${sorted ? 'sorted' : ''}" data-sort-key="${key2}">${label}<span class="arrow">${arrow}</span></th>`;
  };

  // Group by month, like the source spreadsheet's per-month blocks —
  // preserving each month's internal ordering from the sort/filter above,
  // and the months themselves in chronological order.
  const groupIndex = new Map();
  rows.forEach(d => {
    if (!groupIndex.has(d.month)) groupIndex.set(d.month, []);
    groupIndex.get(d.month).push(d);
  });
  const groups = Array.from(groupIndex.keys())
    .sort((a, b) => monthSortValue(a) - monthSortValue(b))
    .map(mk => ({ month: mk, rows: groupIndex.get(mk) }));

  return `
  <div class="panel">
    <div class="field-row">
      <input type="text" id="deal-search" placeholder="Search name, material, owner…" value="${esc(state.dealSearch)}">
      <select id="deal-month-filter">
        <option value="all">All months</option>
        ${monthKeys.map(m => `<option value="${esc(m)}" ${state.dealMonth === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}
      </select>
      <select id="deal-stage-filter">
        <option value="all">All stages</option>
        ${stages.map(s => `<option value="${esc(s)}" ${state.dealStage === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
      </select>
      <span class="footnote">${rows.length} of ${yd.deals.length} rows</span>
    </div>
    ${groups.length === 0 ? `<div class="empty-state">No deals match this search/filter.</div>` : `
    <div class="table-scroll">
      <table class="report" id="deals-table">
        <thead><tr>
          ${col('name', 'Deal Name')}
          ${col('closeDate', 'Close Date')}
          ${col('stage', 'Stage')}
          ${col('material', 'Material')}
          ${col('owner', 'Owner')}
          ${col('amount', 'Amount')}
          ${col('collected', 'Collected')}
        </tr></thead>
        <tbody>
          ${groups.map(g => dealGroupRows(g, yd)).join('')}
        </tbody>
      </table>
    </div>`}
  </div>`;
}

// One month's section: a banner row (flagging a KPI/ledger mismatch inline,
// same check as before but visible per-group instead of only when filtered
// to that single month), its deal rows, then a "MONTHLY TOTAL" row — mirrors
// the source workbook's own per-month block layout.
function dealGroupRows(group, yd) {
  const monthRow = yd.monthly.find(m => m.month === group.month);
  const wonRows = group.rows.filter(d => d.stage && d.stage.indexOf('Closed Won') === 0);
  const wonAmount = wonRows.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const gap = monthRow && wonRows.length !== monthRow.deals;
  const gapFlag = gap
    ? ` <span class="gap-flag" title="This month's KPI total says ${monthRow.deals} deals, but only ${wonRows.length} are listed here.">⚠ ${num(wonRows.length)} of ${num(monthRow.deals)} deals listed</span>`
    : '';
  let out = `<tr class="month-group-header"><td colspan="7">📅 ${esc(titleCaseMonth(group.month))}${gapFlag}</td></tr>`;
  out += group.rows.map(d => `<tr>
    <td>${esc(d.name)}</td>
    <td>${dateStr(d.closeDate)}</td>
    <td>${stagePill(d.stage)}</td>
    <td>${esc(d.material || '—')}</td>
    <td>${esc(d.owner || '—')}</td>
    <td class="num">${d.amount != null ? money(d.amount, 2) : '—'}</td>
    <td class="num">${d.collected != null ? money(d.collected, 2) : '—'}</td>
  </tr>`).join('');
  out += `<tr class="month-group-total"><td colspan="5">MONTHLY TOTAL (${num(wonRows.length)} deals)</td><td class="num">${money(wonAmount, 2)}</td><td></td></tr>`;
  return out;
}

function wireDealControls() {
  const search = document.getElementById('deal-search');
  if (search) {
    search.addEventListener('input', () => { state.dealSearch = search.value; renderDealsOnly(); });
  }
  const monthSel = document.getElementById('deal-month-filter');
  if (monthSel) monthSel.addEventListener('change', () => { state.dealMonth = monthSel.value; renderDealsOnly(); });
  const stageSel = document.getElementById('deal-stage-filter');
  if (stageSel) stageSel.addEventListener('change', () => { state.dealStage = stageSel.value; renderDealsOnly(); });
  document.querySelectorAll('th[data-sort-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-sort-key');
      if (state.dealSort.key === key) state.dealSort.dir = state.dealSort.dir === 'asc' ? 'desc' : 'asc';
      else state.dealSort = { key, dir: key === 'closeDate' ? 'desc' : 'asc' };
      renderDealsOnly();
    });
  });
}

function renderDealsOnly() {
  const main = document.getElementById('main');
  main.innerHTML = renderTabs() + renderDeals();
  wireDealControls();
  const search = document.getElementById('deal-search');
  if (search) {
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
  }
}

// SPEC.md §5: Created is cohorted by create date, Won/Lost by close date, so
// a month can close more than it created — the MAX(0, …) floor on Pending
// then reads as "0 pending" when it actually means "cohort mismatch,
// unrelated to this month's real pipeline". Surface that distinction instead
// of a bare, misleading 0.
function pendingCell(a, key) {
  const isMismatch = a.pending === 0 && (a.won + a.lost) > a.dealsCreated;
  if (isMismatch) return `<span title="Won + Lost exceeds Deals Created this month — cohorts don't line up, not literally zero pipeline.">n/a*</span>`;
  return key === 'count' ? num(a.pending) : moneyCompact(a.pendingAmount);
}

}

// Upload tab — parse an .xlsx/.xls/.csv of closed deals for one month and
// save it as a new "live" month layered on top of the static snapshot; plus
// manual collection entries against any known month.
// ---------------------------------------------------------------------------
const COLUMN_ALIASES = {
  name: ['deal name', 'name', 'deal'],
  closeDate: ['close date', 'date', 'closed date'],
  stage: ['deal stage', 'stage'],
  amount: ['amount', 'deal amount'],
  owner: ['deal owner', 'owner'],
  collected: ['collected'],
  material: ['material type', 'material'],
  recordId: ['record id', 'id'],
};

function normalizeDateCell(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  const d = new Date(s);
  if (!isNaN(d) && /\d{4}/.test(s)) return d.toISOString().slice(0, 10);
  return s;
}

function mapUploadRows(rows) {
  let headerRowIdx = -1, colIndex = {};
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const row = rows[i] || [];
    const norm = row.map(c => (c == null ? '' : String(c).trim().toLowerCase()));
    const found = {};
    let hits = 0;
    Object.keys(COLUMN_ALIASES).forEach(field => {
      const idx = norm.findIndex(c => COLUMN_ALIASES[field].indexOf(c) !== -1);
      if (idx !== -1) { found[field] = idx; hits++; }
    });
    if (hits >= 2 && found.name != null && found.amount != null) { headerRowIdx = i; colIndex = found; break; }
  }
  if (headerRowIdx === -1) {
    throw new Error('Could not find a header row with recognizable columns (need at least "Deal Name" and "Amount").');
  }
  const warnings = [];
  const deals = [];
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    if (row.every(c => c == null || String(c).trim() === '')) continue;
    const name = colIndex.name != null ? row[colIndex.name] : null;
    if (!name || String(name).trim() === '') { warnings.push(`Row ${i + 1}: missing deal name`); continue; }
    deals.push({
      recordId: colIndex.recordId != null ? row[colIndex.recordId] : null,
      name: String(name).trim(),
      closeDate: normalizeDateCell(colIndex.closeDate != null ? row[colIndex.closeDate] : null),
      stage: (colIndex.stage != null && row[colIndex.stage]) ? String(row[colIndex.stage]).trim() : 'Closed Won (APC Materials)',
      amount: colIndex.amount != null ? parseMoneyCell(row[colIndex.amount]) : 0,
      owner: (colIndex.owner != null && row[colIndex.owner]) ? String(row[colIndex.owner]).trim() : null,
      collected: colIndex.collected != null ? parseMoneyCell(row[colIndex.collected]) : null,
      material: (colIndex.material != null && row[colIndex.material]) ? String(row[colIndex.material]).trim() : null,
    });
  }
  return { deals, warnings };
}

function parseUploadFile(file) {
  return new Promise((resolve, reject) => {
    const isCsv = /\.csv$/i.test(file.name);
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the file.'));
    reader.onload = (e) => {
      try {
        if (typeof XLSX === 'undefined') throw new Error('The spreadsheet parser failed to load (check your internet connection) and try refreshing the page.');
        const wb = isCsv
          ? XLSX.read(e.target.result, { type: 'string' })
          : XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
        resolve(mapUploadRows(rows));
      } catch (err) {
        reject(err);
      }
    };
    if (isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}

function renderUpload() {
  if (!state.uploadYear) state.uploadYear = state.year;
  const year = state.uploadYear;
  const bakedKeys = new Set((SALES_DATA.years[year] ? SALES_DATA.years[year].monthNames : []).map(mn => monthKeyOf(mn, year)));
  const targetOptions = MONTH_NAMES.map(mn => monthKeyOf(mn, year));
  if (!state.uploadMonth || monthYearOf(state.uploadMonth) !== String(year)) {
    state.uploadMonth = targetOptions.find(mk => !bakedKeys.has(mk)) || currentMonthKey();
  }
  if (!state.collMonth) state.collMonth = currentMonthKey();

  const existingUploads = Object.keys(live.uploads).sort((a, b) => monthSortValue(b) - monthSortValue(a));
  const parsed = state.uploadParsed;
  const collMonths = knownMonthKeys();

  return `
  ${renderStorageBanner()}
  <div class="panel">
    <h2>Upload Closed Deals</h2>
    <p class="panel-sub">Upload a spreadsheet of closed deals for a month that isn't already baked into this report (e.g. the current month, as it happens). Recognized columns (any order): Deal Name, Close Date, Amount, Material Type, Deal Owner, Stage (optional — defaults to Closed Won; rows marked "Payment Collected" count toward that month's Outstanding Collected instead of a new deal), Collected (optional). Outstanding is always calculated as Amount − Collected, never read from the file.</p>
    <div class="form-grid">
      <div>
        <label>Year</label>
        <select id="upload-year-select">${YEARS.map(y => `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`).join('')}</select>
      </div>
      <div>
        <label>Month</label>
        <select id="upload-month-select">
          ${targetOptions.map(mk => `<option value="${mk}" ${mk === state.uploadMonth ? 'selected' : ''} ${bakedKeys.has(mk) ? 'disabled' : ''}>${titleCaseMonth(mk)}${bakedKeys.has(mk) ? ' (already in report)' : (live.uploads[mk] ? ' (uploaded — re-uploading replaces it)' : '')}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>File (.xlsx, .xls, .csv)</label>
        <input type="file" id="upload-file-input" accept=".xlsx,.xls,.csv">
      </div>
    </div>
    ${parsed ? `
      <div class="footnote">Parsed ${num(parsed.deals.length)} rows from "${esc(parsed.fileName)}" — ${num(parsed.deals.filter(d => d.stage.indexOf('Closed Won') === 0).length)} closed-won, total ${money(parsed.deals.reduce((s, d) => s + (Number(d.amount) || 0), 0))}.
      ${parsed.warnings.length ? `<br>${parsed.warnings.length} row(s) skipped: ${esc(parsed.warnings.slice(0, 5).join('; '))}${parsed.warnings.length > 5 ? '…' : ''}` : ''}</div>
      <div class="table-scroll upload-preview-table">
        <table class="report">
          <thead><tr><th>Deal Name</th><th>Close Date</th><th>Stage</th><th>Material</th><th style="text-align:right">Amount</th></tr></thead>
          <tbody>${parsed.deals.slice(0, 15).map(d => `<tr><td>${esc(d.name)}</td><td>${dateStr(d.closeDate)}</td><td>${stagePill(d.stage)}</td><td>${esc(d.material || '—')}</td><td class="num">${money(d.amount, 2)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
      ${parsed.deals.length > 15 ? `<div class="footnote">…and ${parsed.deals.length - 15} more rows.</div>` : ''}
      <div class="field-row" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="App.confirmUpload()">Save to Sales Report</button>
        <button class="btn btn-outline" onclick="App.cancelUpload()">Cancel</button>
      </div>
    ` : ''}
    ${state.uploadMsg ? `<div class="footnote">${esc(state.uploadMsg)}</div>` : ''}
  </div>

  <div class="panel">
    <h2>Uploaded Months</h2>
    ${existingUploads.length === 0 ? `<div class="empty-state">No months uploaded yet.</div>` : `
    <div class="table-scroll">
      <table class="report">
        <thead><tr><th>Month</th><th style="text-align:right">Deals</th><th style="text-align:right">Total Amount</th><th>Uploaded</th><th>File</th><th></th></tr></thead>
        <tbody>
          ${existingUploads.map(mk => {
            const u = live.uploads[mk];
            const won = (u.deals || []).filter(d => d.stage && d.stage.indexOf('Closed Won') === 0);
            const total = won.reduce((s, d) => s + (Number(d.amount) || 0), 0);
            return `<tr>
              <td>${esc(titleCaseMonth(mk))}</td>
              <td class="num">${num(won.length)}</td>
              <td class="num">${money(total)}</td>
              <td>${u.uploadedAt ? new Date(u.uploadedAt).toLocaleDateString('en-US') : '—'}</td>
              <td>${esc(u.fileName || '—')}</td>
              <td><button class="btn btn-outline btn-small" onclick="App.deleteUpload('${esc(mk)}')">Delete</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`}
  </div>

  <div class="panel">
    <h2>Log a Collection</h2>
    <p class="panel-sub">Record cash collected this month against a deal's outstanding balance from a prior period — adds to that month's Outstanding Collected and Total Collected on the Overview tab.</p>
    <div class="form-grid">
      <div>
        <label>Month Collected</label>
        <select id="coll-month-select">${collMonths.map(mk => `<option value="${mk}" ${mk === state.collMonth ? 'selected' : ''}>${titleCaseMonth(mk)}</option>`).join('')}</select>
      </div>
      <div>
        <label>Amount</label>
        <input type="text" id="coll-amount-input" placeholder="0.00" value="${esc(state.collAmount)}">
      </div>
      <div>
        <label>Note (optional)</label>
        <input type="text" id="coll-note-input" placeholder="e.g. Frank Lepori — Nov deal" value="${esc(state.collNote)}">
      </div>
      <div><button class="btn btn-primary" onclick="App.addCollection()">Add Collection</button></div>
    </div>
  </div>

  <div class="panel">
    <h2>Collections Log</h2>
    ${live.collections.length === 0 ? `<div class="empty-state">No collections logged yet.</div>` : `
    <div class="table-scroll">
      <table class="report">
        <thead><tr><th>Month Collected</th><th style="text-align:right">Amount</th><th>Note</th><th>Logged</th><th></th></tr></thead>
        <tbody>
          ${live.collections.slice().sort((a, b) => (b.enteredAt || 0) - (a.enteredAt || 0)).map(c => `<tr>
            <td>${esc(titleCaseMonth(c.month))}</td>
            <td class="num">${money(c.amount, 2)}</td>
            <td>${esc(c.note || '—')}</td>
            <td>${c.enteredAt ? new Date(c.enteredAt).toLocaleDateString('en-US') : '—'}</td>
            <td><button class="btn btn-outline btn-small" onclick="App.deleteCollection('${esc(c.id)}')">Delete</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
  </div>`;
}

function wireUploadControls() {
  const yearSel = document.getElementById('upload-year-select');
  if (yearSel) yearSel.addEventListener('change', () => { state.uploadYear = yearSel.value; state.uploadMonth = null; state.uploadParsed = null; renderUploadOnly(); });
  const monthSel = document.getElementById('upload-month-select');
  if (monthSel) monthSel.addEventListener('change', () => { state.uploadMonth = monthSel.value; state.uploadParsed = null; renderUploadOnly(); });
  const fileInput = document.getElementById('upload-file-input');
  if (fileInput) fileInput.addEventListener('change', () => { if (fileInput.files[0]) App.handleUploadFile(fileInput.files[0]); });
  const collMonthSel = document.getElementById('coll-month-select');
  if (collMonthSel) collMonthSel.addEventListener('change', () => { state.collMonth = collMonthSel.value; });
  const collAmount = document.getElementById('coll-amount-input');
  if (collAmount) collAmount.addEventListener('input', () => { state.collAmount = collAmount.value; });
  const collNote = document.getElementById('coll-note-input');
  if (collNote) collNote.addEventListener('input', () => { state.collNote = collNote.value; });
}

function renderUploadOnly() {
  const main = document.getElementById('main');
  main.innerHTML = renderTabs() + renderUpload();
  wireUploadControls();
}

// ---------------------------------------------------------------------------
// Tab customization modal
// ---------------------------------------------------------------------------
function renderTabSettingsList() {
  const list = document.getElementById('tab-settings-list');
  const n = state.tabs.length;
  const visibleCount = state.tabs.filter(t => !t.hidden).length;
  list.innerHTML = state.tabs.map((t, i) => `
    <div class="tab-settings-row">
      <div class="order-btns">
        <button ${i === 0 ? 'disabled' : ''} onclick="App.moveTab(${i}, -1)" title="Move up">▲</button>
        <button ${i === n - 1 ? 'disabled' : ''} onclick="App.moveTab(${i}, 1)" title="Move down">▼</button>
      </div>
      <input type="text" value="${esc(t.label)}" data-tab-id="${t.id}" class="tab-name-input">
      <label class="hide-toggle">
        <input type="checkbox" data-tab-id="${t.id}" ${t.hidden ? 'checked' : ''} ${(!t.hidden && visibleCount <= 1) ? 'disabled' : ''}>
        Hidden
      </label>
    </div>
  `).join('');
  list.querySelectorAll('.tab-name-input').forEach(inp => {
    inp.addEventListener('change', () => App.renameTab(inp.getAttribute('data-tab-id'), inp.value));
  });
  list.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => App.toggleTabHidden(cb.getAttribute('data-tab-id')));
  });
}

// ---------------------------------------------------------------------------
// App namespace + init
// ---------------------------------------------------------------------------
const App = {
  goYear(y) { state.year = y; state.monthView = 'all'; render(); },
  goTab(t) {
    state.tab = t;
    if (t === 'deals') { state.dealSearch = ''; state.dealMonth = 'all'; state.dealStage = 'all'; }
    render();
  },
  setMonthView(v) { state.monthView = v; render(); },

  async handleUploadFile(file) {
    state.uploadMsg = 'Parsing…';
    renderUploadOnly();
    try {
      const { deals, warnings } = await parseUploadFile(file);
      state.uploadParsed = { deals, warnings, fileName: file.name };
      state.uploadMsg = '';
    } catch (e) {
      state.uploadParsed = null;
      state.uploadMsg = 'Could not parse this file: ' + ((e && e.message) || String(e));
    }
    renderUploadOnly();
  },

  cancelUpload() { state.uploadParsed = null; state.uploadMsg = ''; renderUploadOnly(); },

  async confirmUpload() {
    if (!state.uploadParsed) return;
    const monthKey = state.uploadMonth;
    const deals = state.uploadParsed.deals.map(d => ({ ...d, month: monthKey, year: parseInt(monthYearOf(monthKey), 10) }));
    state.uploadMsg = 'Saving…';
    renderUploadOnly();
    if (live.mode === 'cloud' && window.__srSaveUpload) {
      const res = await window.__srSaveUpload(monthKey, deals, state.uploadParsed.fileName);
      if (!res.ok) { state.uploadMsg = 'Save failed: ' + res.error; renderUploadOnly(); return; }
    } else {
      live.uploads[monthKey] = { month: monthKey, deals, fileName: state.uploadParsed.fileName, uploadedAt: Date.now() };
      saveLocalFallback();
    }
    state.uploadParsed = null;
    state.uploadMsg = `Saved ${deals.length} deals for ${titleCaseMonth(monthKey)}.`;
    render();
  },

  async deleteUpload(monthKey) {
    if (!confirm(`Delete the uploaded deals for ${titleCaseMonth(monthKey)}?`)) return;
    if (live.mode === 'cloud' && window.__srDeleteUpload) await window.__srDeleteUpload(monthKey);
    else { delete live.uploads[monthKey]; saveLocalFallback(); }
    render();
  },

  async addCollection() {
    const monthSel = document.getElementById('coll-month-select');
    const amountInput = document.getElementById('coll-amount-input');
    const noteInput = document.getElementById('coll-note-input');
    const month = monthSel ? monthSel.value : state.collMonth;
    const amount = parseMoneyCell(amountInput ? amountInput.value : 0);
    const note = noteInput ? noteInput.value.trim() : '';
    if (!amount) { state.uploadMsg = 'Enter a non-zero amount before logging a collection.'; renderUploadOnly(); return; }
    const entry = { id: 'col_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8), month, amount, note, enteredAt: Date.now() };
    if (live.mode === 'cloud' && window.__srSaveCollection) {
      const res = await window.__srSaveCollection(entry);
      if (!res.ok) { state.uploadMsg = 'Save failed: ' + res.error; renderUploadOnly(); return; }
    } else {
      live.collections.push(entry);
      saveLocalFallback();
    }
    state.collAmount = ''; state.collNote = '';
    state.uploadMsg = 'Collection logged.';
    render();
  },

  async deleteCollection(id) {
    if (!confirm('Delete this collection entry?')) return;
    if (live.mode === 'cloud' && window.__srDeleteCollection) await window.__srDeleteCollection(id);
    else { live.collections = live.collections.filter(c => c.id !== id); saveLocalFallback(); }
    render();
  },

  async saveOverride(monthKey, field, value) {
    const parsed = value === '' || value == null ? null : parseMoneyCell(value);
    if (live.mode === 'cloud' && window.__srSaveOverride) {
      await window.__srSaveOverride(monthKey, field, parsed);
    } else {
      live.overrides[monthKey] = { ...(live.overrides[monthKey] || {}), month: monthKey, [field]: parsed };
      saveLocalFallback();
    }
    render();
  },

  openTabSettings() {
    document.getElementById('tab-settings-overlay').classList.add('open');
    renderTabSettingsList();
  },
  closeTabSettings() {
    document.getElementById('tab-settings-overlay').classList.remove('open');
  },
  moveTab(index, dir) {
    const target = index + dir;
    if (target < 0 || target >= state.tabs.length) return;
    const copy = state.tabs.slice();
    const [moved] = copy.splice(index, 1);
    copy.splice(target, 0, moved);
    state.tabs = copy;
    saveTabs();
    renderTabSettingsList();
    render();
  },
  renameTab(id, value) {
    const label = value.trim();
    const tab = state.tabs.find(t => t.id === id);
    if (tab) tab.label = label || DEFAULT_TABS.find(t => t.id === id).label;
    saveTabs();
    renderTabSettingsList();
    render();
  },
  toggleTabHidden(id) {
    const tab = state.tabs.find(t => t.id === id);
    if (!tab) return;
    if (!tab.hidden) {
      // about to hide it — never hide the last visible tab
      const otherVisible = state.tabs.filter(t => t.id !== id && !t.hidden).length;
      if (otherVisible === 0) { renderTabSettingsList(); return; }
    }
    tab.hidden = !tab.hidden;
    if (tab.hidden && state.tab === id) {
      const firstVisible = state.tabs.find(t => !t.hidden);
      if (firstVisible) state.tab = firstVisible.id;
    }
    saveTabs();
    renderTabSettingsList();
    render();
  },
  resetTabs() {
    state.tabs = DEFAULT_TABS.map(t => ({ ...t, hidden: false }));
    saveTabs();
    renderTabSettingsList();
    render();
  },
};

initTheme();
setupChartTooltips();
render();
initLiveData();
</script>
</body>
</html>
